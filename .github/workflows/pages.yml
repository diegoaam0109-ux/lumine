name: Publicar prototipo en Pages
on:
  push:
    branches: [main, claude/quirky-darwin-326nn0]
    paths: ['entrega3/prototipo/app/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - run: |
          mkdir -p _site
          cp entrega3/prototipo/app/index.html _site/index.html
          cp entrega3/prototipo/app/registro_ejemplo.csv _site/registro_ejemplo.csv
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
