name: Publicar prototipo y presentaciones en Pages
on:
  push:
    branches: [main]
    paths: ['ventas/**', 'lumine-presentaciones/**', '.github/workflows/pages.yml']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      # Conserva el estimador publicado, sin reemplazarlo por la versión antigua de main.
      - uses: actions/checkout@v4
        with:
          ref: de2f7438e584d2648fb3f7a85166bab4a29629e4
          path: _estimador
          sparse-checkout: entrega3/prototipo/app
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: ventas/package-lock.json
      - name: Construir página comercial con rutas relativas
        working-directory: ventas
        run: npm ci && npm run build -- --base=./
      - name: Preparar pruebas de navegador
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: npm install --prefix "$RUNNER_TEMP/pages-check" --no-save playwright@1.64.1
      - name: Probar presentación con file y sin red
        run: |
          NODE_PATH="$RUNNER_TEMP/pages-check/node_modules" CHROMIUM_PATH="$(command -v google-chrome)" LUMINE_SCREENSHOTS="$RUNNER_TEMP/presentacion-file" node lumine-presentaciones/engine/tests/deck.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: presentacion-file-capturas
          path: ${{ runner.temp }}/presentacion-file
      - uses: actions/configure-pages@v5
      - name: Preparar ambos sitios
        run: |
          mkdir -p _site
          cp _estimador/entrega3/prototipo/app/index.html _site/index.html
          cp _estimador/entrega3/prototipo/app/registro_ejemplo.csv _site/registro_ejemplo.csv
          cp -a lumine-presentaciones _site/lumine-presentaciones
          cp -a ventas/dist _site/ventas
          test -s _site/index.html
          test -s _site/lumine-presentaciones/fase3/index.html
          test -s _site/lumine-presentaciones/engine/deck.js
          test -s _site/lumine-presentaciones/fase3/deck-data.js
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - uses: actions/deploy-pages@v4
        id: deployment
      - name: Comprobar página comercial pública sin sesión
        env:
          PLAYWRIGHT_SKIP_BROWSER_DOWNLOAD: '1'
        run: |
          NODE_PATH="$RUNNER_TEMP/pages-check/node_modules" node <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch({channel: 'chrome', headless: true});
            try {
              for (let attempt = 0; attempt < 6; attempt++) {
                const context = await browser.newContext({viewport: {width: 1920, height: 1080}});
                const page = await context.newPage();
                const errors = [];
                page.on('pageerror', e => errors.push(e.message));
                page.on('response', r => {if (r.url().includes('.github.io/') && r.status() >= 400) errors.push(r.status() + ' ' + r.url());});
                try {
                  const response = await page.goto('https://diegoaam0109-ux.github.io/lumine/ventas/', {waitUntil: 'networkidle'});
                  if (!response.ok()) throw new Error('HTTP ' + response.status());
                  await page.locator('h1').filter({hasText: /HÍBRIDO/i}).waitFor();
                  if (errors.length) throw new Error(errors.join('\n'));
                  await page.screenshot({path: 'ventas-publica.png'});
                  console.log('PASS: /lumine/ventas/ carga sin sesión en un contexto de incógnito, sin errores ni 404.');
                  await context.close();
                  return;
                } catch (error) {
                  await context.close();
                  if (attempt === 5) throw error;
                  await new Promise(resolve => setTimeout(resolve, 15000));
                }
              }
            } finally { await browser.close(); }
          })().catch(error => {console.error(error); process.exit(1);});
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: comprobacion-ventas-publica
          path: ventas-publica.png
      - name: Probar presentación pública sin sesión
        run: |
          NODE_PATH="$RUNNER_TEMP/pages-check/node_modules" CHROMIUM_PATH="$(command -v google-chrome)" LUMINE_DECK_URL="https://diegoaam0109-ux.github.io/lumine/lumine-presentaciones/fase3/index.html" LUMINE_SCREENSHOTS="$RUNNER_TEMP/presentacion-publica" node lumine-presentaciones/engine/tests/deck.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: presentacion-publica-capturas
          path: ${{ runner.temp }}/presentacion-publica
