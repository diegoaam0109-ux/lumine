name: Pruebas del prototipo
on: [push, pull_request]
permissions:
  contents: read
jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: entrega3/prototipo/requirements.txt
      - run: pip install -r entrega3/prototipo/requirements.txt
      - run: python -m pytest entrega3/prototipo/tests -q
