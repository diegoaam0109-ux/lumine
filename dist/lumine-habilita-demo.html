  await syncMuchos([d.a, d.b]);
  return { anticipado };
}

/* ---------- solicitudes de rotación (D13) ----------
   El técnico escribe su solicitud en su propio documento; la respuesta vive en personas/,
   que solo escribe administración. Así nadie se aprueba su propia rotación. */
function solicitudesRotacion(){
  return Object.entries(S.D.solicitudes || {})
    .map(([uid, doc]) => ({ uid, sol: doc && doc.rotacion, p: personaPorUid(uid) }))
    .filter(x => x.sol && x.sol.id && x.p && x.p.etapa === 'tecnico' && !(x.p.rotacion && x.p.rotacion.id === x.sol.id))
    .map(x => Object.assign(x, { duo: duoActivoDe(x.p.id, duos()) }))
    .sort((a, b) => String(a.sol.enviada || '').localeCompare(String(b.sol.enviada || '')));
}
async function resolverSolicitudRotacion(uid, aprobar, respuesta){
  requireAdmin(); mustId(uid);
  return conCandado('rotacion:' + uid, async () => {
    const x = solicitudesRotacion().find(s => s.uid === uid);
    if(!x) throw new Error('La solicitud ya no está pendiente');
    const r = txt(respuesta, 300);
    if(!aprobar && !motivoValido(r)) throw new Error('Explica por qué se rechaza');
    const res = { id: x.sol.id, estado: aprobar ? 'aprobada' : 'rechazada', respuesta: r, fecha: S.hoy, por: S.me.id };
    const pasos = [];
    if(aprobar){
      if(!x.duo) throw new Error(x.p.nombre + ' ya no está en un duo activo');
      // el plazo se revisa aquí con la fecha del duo, no con lo que diga la solicitud
      const sep = separacionAnticipada(x.duo, params(), S.hoy);
      if(sep.anticipado) throw new Error('El duo cumple ' + rotacionMeses(params()) + ' meses el ' + fechaLarga(sep.libreDesde) + ': antes no se rota por solicitud (D13)');
      pasos.push({ path:'duos/' + x.duo.id, op:'update', data:{ activo:false, hasta: S.hoy, motivoFin: txt('Rotación pedida por ' + x.p.nombre + ': ' + x.sol.motivo, 300), anticipado:false } });
    }
    pasos.push({ path:'personas/' + x.p.id, op:'update', data:{ rotacion: res, actualizado: nowISO() } });
    await transaccion(aprobar ? 'Aprobación de la rotación' : 'Rechazo de la rotación', pasos);
    if(aprobar) S.D.duos[x.duo.id] = Object.assign({}, x.duo, { activo:false, hasta: S.hoy });
    S.D.personas[x.p.id] = Object.assign({}, x.p, { rotacion: res });
    await logEvento(aprobar ? 'Rotación aprobada' : 'Rotación rechazada', x.p.id, x.p.nombre + (r ? ': ' + r : ''));
    await syncMuchos(aprobar ? [x.duo.a, x.duo.b] : [x.p.id]);
    return res;
  });
}

function numOrNull(v, min, max){ if(v === '' || v === null || v === undefined) return null; const n = Number(v); if(!isFinite(n)) return null; return clamp(n, min, max); }
async function guardarParametros(pp){
  requireAdmin();
  const clean = {
    // numParam: un 0 escrito a propósito no se pierde (antes '0 || 3' guardaba 3)
    umbralComp: clamp(Math.round(numParam(pp.umbralComp, 85)), 50, 100),
    umbralFund: clamp(Math.round(numParam(pp.umbralFund, 2)), 1, 3),
    revalidacionMeses: clamp(Math.round(numParam(pp.revalidacionMeses, 12)), 1, 60),
    rotacionMinMeses: clamp(Math.round(numParam(pp.rotacionMinMeses, 3)), 0, 24),
    periodoAutonomoDias: numOrNull(pp.periodoAutonomoDias, 1, 365),
    firmaPorNivel: 'confirmada', // D18 cerrada: ya no se edita
    horasModulo: {}, horasValidacion: {}, bonoNivel: {}, v:1
  };
  for(const m of MODULOS) clean.horasModulo[m.id] = numOrNull(pp.horasModulo && pp.horasModulo[m.id], 0, 500);
  for(const t of Object.keys(TIPOS_SESION)) clean.horasValidacion[t] = numOrNull(pp.horasValidacion && pp.horasValidacion[t], 0, 200);
  for(const n of [1,2,3,4]) clean.bonoNivel[n] = numOrNull(pp.bonoNivel && pp.bonoNivel[n], 0, 100000000);
  const bp = pp.bonoPresupuesto;
  if(bp){
    clean.bonoPresupuesto = { presupuesto: numOrNull(bp.presupuesto, 0, 1e12), meses: numOrNull(bp.meses, 1, 60), paso: numOrNull(bp.paso, 1, 1e6), esperados:{}, pesos:{} };
    for(const n of [1,2,3,4]){ clean.bonoPresupuesto.esperados[n] = numOrNull(bp.esperados && bp.esperados[n], 0, 10000); clean.bonoPresupuesto.pesos[n] = numOrNull(bp.pesos && bp.pesos[n], 0, 100); }
  }
  const prev = params();
  await W.set('config/parametros', clean);
  const cambios = ['umbralComp','umbralFund','revalidacionMeses','rotacionMinMeses','periodoAutonomoDias','firmaPorNivel'].filter(k => prev[k] !== clean[k]).map(k => k + ': ' + prev[k] + ' → ' + clean[k]);
  await logEvento('Parámetros actualizados', 'config/parametros', cambios.join('; ') || 'horas o bono');
  S.D.params = clean;
  await syncTodosSilencioso();
}
async function syncTodosSilencioso(){ for(const p of personas()) if(p.uid) await syncExpediente(p.id); }
async function guardarGestion(g){
  requireAdmin();
  const cur = gestion();
  const clean = {
    costos: {
      horaFormacion: numOrNull(g.costos.horaFormacion, 0, 1e9), horaValidacionInterna: numOrNull(g.costos.horaValidacionInterna, 0, 1e9),
      validacionExterna: numOrNull(g.costos.validacionExterna, 0, 1e9), otros: numOrNull(g.costos.otros, 0, 1e12)
    },
    metas: {}, instalaciones: cur.instalaciones, equipo: cur.equipo, v:1
  };
  for(const i of INDICADORES) clean.metas[i.id] = numOrNull(g.metas && g.metas[i.id], 0, 1e9);
  if(g.instalaciones) clean.instalaciones = g.instalaciones;

function miSolicitudPath(){ if(!validId(S.me.id)) throw new Error('Sin identidad: no se puede enviar la solicitud'); return 'solicitudes/' + S.me.id; }
function solicitudPendienteMia(){
  const sol = S.mine.solicitud && S.mine.solicitud.rotacion;
  if(!sol) return null;
  const e = S.mine.expediente;
  if(e && e.rotacion && e.rotacion.id === sol.id) return null; // ya tiene respuesta
  return sol;
}
async function enviarSolicitudRotacion(motivo, preferencia){
  return conCandado('rotacion:' + S.me.id, async () => {
    const e = S.mine.expediente;
    if(!e || !e.duo) throw new Error('Necesitas estar en un duo activo para pedir rotación');
    const chk = puedePedirRotacion(e.duo.desde, params(), S.hoy);
    if(!chk.ok) throw new Error(chk.motivo);
    if(solicitudPendienteMia()) throw new Error('Ya tienes una solicitud pendiente');
    const m = txt(motivo, 600);
    if(!motivoRotacionValido(m)) throw new Error('Explica por qué quieres rotar (al menos ' + MIN_MOTIVO_ROTACION + ' caracteres)');
    const doc = { rotacion: { id: nid('rot'), motivo: m, preferencia: txt(preferencia, 200), fecha: S.hoy, enviada: nowISO(), duoDesde: e.duo.desde } };
    await W.set(miSolicitudPath(), doc);
    S.mine.solicitud = doc;
  });
}
async function retirarSolicitudRotacion(){
  if(!solicitudPendienteMia()) throw new Error('No tienes una solicitud pendiente');
  await W.set(miSolicitudPath(), { rotacion: null, retirada: nowISO() });
  S.mine.solicitud = { rotacion: null };
}
async function enviarMarcas(sid, items, obs){
  return conCandado('envio:' + sid, () => enviarMarcas_(sid, items, obs));
}
async function enviarMarcas_(sid, items, obs){
  mustId(sid);
  if(!validId(S.me.id)) throw new Error('Sin identidad');
  const ag = S.mine.agenda && S.mine.agenda.sesiones && S.mine.agenda.sesiones[sid];
  if(!ag || ag.estado !== 'pendiente') throw new Error('Esa evaluación ya no está pendiente');
  const clean = {};

  if(Object.keys(clean).length !== Object.keys(ag.items || {}).length) throw new Error('Marca todos los ítems');
  await W.upsert('marcas/' + S.me.id, { sesiones: { [sid]: { items: clean, obs: txt(obs, 300), enviado: nowISO() } } }, !!S.mine.marcas);

/* ---------- respaldo: exportar y restaurar con prueba en seco ---------- */
const BK_COLS = ['personas','sesiones','duos','registros','avance','marcas','agenda','expedientes','bitacora','solicitudes'];
const BK_DOCS = ['config/parametros','config/contenido','ajustes/gestion'];
function armarRespaldo(){
  requireAdmin();
  const col = {};
  for(const c of BK_COLS) col[c] = JSON.parse(JSON.stringify(S.D[c] || {}));
  return { app:'lumine-habilita', v:1, modo: S.build, exportado: nowISO(), por: S.me.id,
    colecciones: col, documentos: { 'config/parametros': S.D.params ? JSON.parse(JSON.stringify(S.D.params)) : null, 'config/contenido': S.D.contenido ? JSON.parse(JSON.stringify(S.D.contenido)) : null, 'ajustes/gestion': S.D.gestion ? JSON.parse(JSON.stringify(S.D.gestion)) : null } };
}
async function exportarRespaldo(){
  const data = JSON.stringify(armarRespaldo(), null, 1);
  const nombre = 'lumine-habilita-respaldo-' + S.hoy + '.json';
  await logEvento('Respaldo exportado', null, Math.round(data.length / 1024) + ' KB');
  if(S.dl){
    try { await S.dl.save({ filename: nombre, data }); toast('Respaldo guardado'); return true; }
    catch(e){ if(e && e.code === 'declined') { toast('Descarga cancelada', 'info'); return false; } }
  }
  return data; // respaldo en texto si no hay descargas en esta vista
}
function depth(o, d){ if(d > 12) return d; if(o && typeof o === 'object') return Math.max(d, ...Object.values(o).map(v => depth(v, d + 1))); return d; }
function validarRespaldo(texto){
  if(typeof texto !== 'string' || texto.length > 2 * 1024 * 1024) throw new Error('El archivo supera 2 MB');
  let o; try { o = JSON.parse(texto); } catch(e){ throw new Error('No es un JSON válido'); }
  if(!o || o.app !== 'lumine-habilita' || o.v !== 1) throw new Error('No es un respaldo de Lumine Habilita');
  if(!isPlainObj(o.colecciones)) throw new Error('Respaldo sin colecciones');
  if(depth(o, 0) > 12) throw new Error('Estructura demasiado profunda');
  const writes = [];
  for(const c of Object.keys(o.colecciones)){
    if(!BK_COLS.includes(c)) throw new Error('Colección desconocida: ' + c);
    const m = o.colecciones[c];
    if(!isPlainObj(m)) throw new Error('Colección mal formada: ' + c);
    for(const id of Object.keys(m)){
      if(!validId(id)) throw new Error('Identificador inválido en ' + c + ': ' + id.slice(0, 40));
      if(!isPlainObj(m[id])) throw new Error('Documento mal formado: ' + c + '/' + id);
      if(c === 'personas'){
        const p = m[id];
        if(typeof p.nombre !== 'string' || p.nombre.length > 160) throw new Error('Persona sin nombre válido: ' + id);
        if(!['postulante','tecnico','salio','descartado'].includes(p.etapa)) throw new Error('Etapa inválida: ' + id);
        if(!(Number.isInteger(p.nivel) && p.nivel >= 0 && p.nivel <= 4)) throw new Error('Nivel inválido: ' + id);
      }
      writes.push({ path: c + '/' + id, data: m[id] });
    }
  }
  for(const d of BK_DOCS){ const v = o.documentos && o.documentos[d]; if(v !== null && v !== undefined){ if(!isPlainObj(v)) throw new Error('Documento mal formado: ' + d); writes.push({ path:d, data:v }); } }
  if(writes.length > DB_CAPACIDAD - 200) throw new Error('El respaldo tiene ' + writes.length + ' documentos y supera la capacidad de la base (' + DB_CAPACIDAD.toLocaleString('es-CL') + ')');
  for(const w of writes) if(JSON.stringify(w.data).length > 262144) throw new Error('Documento sobre 256 KiB: ' + w.path);
  return { o, writes };
}
function pruebaEnSeco(writes, reemplazar){
  const actual = {};
  for(const c of BK_COLS) for(const id of Object.keys(S.D[c] || {})) actual[c + '/' + id] = S.D[c][id];
  if(S.D.params) actual['config/parametros'] = S.D.params;
  if(S.D.gestion) actual['ajustes/gestion'] = S.D.gestion;
  if(S.D.contenido) actual['config/contenido'] = S.D.contenido;
  const nuevos = [], cambian = [], iguales = [], borrar = [];
  const inBk = new Set(writes.map(w => w.path));
  for(const w of writes){ if(!(w.path in actual)) nuevos.push(w.path); else if(stableStr(actual[w.path]) !== stableStr(w.data)) cambian.push(w.path); else iguales.push(w.path); }
  if(reemplazar) for(const p of Object.keys(actual)) if(!inBk.has(p)) borrar.push(p);
  return { nuevos, cambian, iguales, borrar };
}
async function aplicarRespaldo(writes, plan){
  requireAdmin();
  let n = 0;
  for(const w of writes){ if(plan.iguales.includes(w.path)) continue; await W.set(w.path, w.data); n++; }
  for(const p of plan.borrar){ await W.del(p); n++; }
  await logEvento('Respaldo restaurado', null, n + ' documentos escritos');
  return n;
}

/* ---------- contenido editable de los módulos (config/contenido) ----------
   El Responsable Técnico ajusta textos, cápsulas y preguntas sin programar.
   La estructura (competencias, niveles, reglas) sigue en el código a propósito:
   de ella dependen las 80+ pruebas y las reglas de evaluación. */
function limpiarContenido(mid, c){
  if(!MOD[mid]) throw new Error('Módulo inválido');
  const capsulas = (c.capsulas || []).slice(0, 12).map(k => ({ t: txt(k.t, 120), c: k.c && C[k.c] ? k.c : null, oficio: !!k.oficio, puntos: (k.puntos || []).map(x => txt(x, 400)).filter(Boolean).slice(0, 10) })).filter(k => k.t && k.puntos.length);
  const practica = (c.practica || []).slice(0, 40).map((q, i) => {
    const o = (q.o || []).map(x => txt(x, 240)).filter(Boolean).slice(0, 5);
    const a = Number(q.a);
    if(txt(q.q, 400).length < 8) throw new Error('Pregunta ' + (i + 1) + ': falta el enunciado');
    if(o.length < 2) throw new Error('Pregunta ' + (i + 1) + ': necesita al menos dos alternativas');
    if(!(Number.isInteger(a) && a >= 0 && a < o.length)) throw new Error('Pregunta ' + (i + 1) + ': marca la alternativa correcta');
    return { c: q.c && C[q.c] ? q.c : null, q: txt(q.q, 400), o, a, x: txt(q.x, 400) };
  });
  const out = { capsulas, practica, editado: nowISO(), por: S.me.id };
  if(c.mostrar) out.mostrar = clamp(Math.round(Number(c.mostrar) || 0), 1, 40);
  if(c.resumen) out.resumen = txt(c.resumen, 300);
  return out;
}
async function guardarContenido(mid, c){
  requireAdmin();
  const clean = limpiarContenido(mid, c);
  const base = CONTENIDO[mid] || {};
  if(base.reglas) clean.reglas = base.reglas;           // el simulador y los escenarios siguen siendo del código
  if(base.escenarios) clean.escenarios = base.escenarios;
  await W.upsert('config/contenido', { modulos: { [mid]: clean } }, !!S.D.contenido);
  await logEvento('Contenido de módulo editado', mid, MOD[mid].nombre + ' · ' + clean.capsulas.length + ' cápsulas, ' + clean.practica.length + ' preguntas');
}
async function restaurarContenido(mid){
  requireAdmin();
  if(!(S.D.contenido && S.D.contenido.modulos && S.D.contenido.modulos[mid])) return;
  await W.update('config/contenido', { modulos: { [mid]: null } });
  await logEvento('Contenido de módulo restaurado al original', mid, MOD[mid].nombre);
}

/* ---------- consistencia: reparar lo que dejó una operación cortada ---------- */
async function repararConsistencia(fix){
  requireAdmin();
  if(!fix) throw new Error('Este caso se revisa a mano');
  if(fix.tipo === 'cerrarDuo'){ await W.update('duos/' + mustId(fix.did), { activo:false, hasta:S.hoy, motivoFin:'Reparación de consistencia' }); }
  else if(fix.tipo === 'agenda'){ await W.update('agenda/' + mustId(fix.uid), { sesiones: { [mustId(fix.sid)]: { estado: fix.estado } } }); }
  else if(fix.tipo === 'sync'){ await syncExpediente(mustId(fix.pid)); }
  else if(fix.tipo === 'reabrirSesion'){ await W.update('sesiones/' + mustId(fix.sid), { estado:'abierta', resultado:null, cerrado:null, cerradoPor:null }); }
  else throw new Error('Reparación desconocida');
  await logEvento('Consistencia reparada', fix.did || fix.sid || fix.pid || null, fix.tipo);
}
function usoBase(){
  let n = 0;
  for(const c of BK_COLS) n += Object.keys(S.D[c] || {}).length;
  n += BK_DOCS.filter(d => d === 'config/parametros' ? S.D.params : d === 'config/contenido' ? S.D.contenido : S.D.gestion).length;
  return { docs: n, cap: DB_CAPACIDAD, pct: Math.round(1000 * n / DB_CAPACIDAD) / 10, aviso: n >= DB_CAPACIDAD * DB_AVISO };
}

let HERO_TIMER = null;
function heroMock(){
  let idx = 0, manual = false;
  const title = h('div', { class:'h4', style:'color:var(--lw-ink)' });
  const subt = h('div', { class:'lw-note' });
  const statCursar = h('b'), statOficio = h('b'), statNiv = h('b');

  const rows = [1,2,3,4].map(n => h('div', { class:'cmap-row' }, h('span', { class:'cmap-lv' }, 'N' + n),

  const chips = h('div', { class:'lw-chips', 'aria-live':'polite' });
  const seg = segmented(HERO_PERFILES.map((p, i) => ({ v:i, l:p.l })), 0, v => { manual = true; stop(); pintar(Number(v)); }, { label:'Perfil tipo' });
  function tween(el, to){
    const from = Number(el.dataset.v || to);
    el.dataset.v = to;
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if(reduce || from === to){ el.textContent = String(to); return; }
    const t0 = performance.now(), dur = 420;
    const step = t => { const k = Math.min(1, (t - t0) / dur); el.textContent = String(Math.round(from + (to - from) * (1 - Math.pow(1 - k, 3)))); if(k < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  }
  function pintar(i){
    idx = i;
    const p = HERO_PERFILES[i];
    title.textContent = p.nombre;
    subt.textContent = 'Perfil tipo del informe 4 · ' + p.nota;
    const skip = new Set(p.skip);
    for(const c of Object.keys(tiles)){ tiles[c].classList.toggle('skip', skip.has(c)); }
    tween(statCursar, 39 - p.skip.length); tween(statOficio, p.skip.length); tween(statNiv, p.niv.length);
    noteCursar.textContent = 'de 39 competencias por cursar';
    clear(chips);
    if(!p.niv.length) chips.appendChild(h('span', { class:'lw-chip' }, icon('check', 's14'), 'Sin nivelación prevista'));
    for(const id of ['NIV-E','NIV-M','NIV-X']){ const on = p.niv.includes(id); if(on) chips.appendChild(h('span', { class:'lw-chip on' }, icon('plus', 's14'), MOD[id].nombre)); }

    h('div', { class:'mock-bar' }, h('i'), h('i'), h('i'), h('span', { class:'mt' }, 'lumine-habilita · plan personal')),
    h('div', { class:'lw mock-body' },
      h('div', { class:'row sb', style:'gap:12px' }, h('span', { class:'lw-eyebrow' }, 'Plan personal'), seg),
      h('div', { class:'stack', style:'--g:2px' }, title, subt),
      h('div', { class:'lw-stats' },
        h('div', { class:'lw-stat' }, statCursar, noteCursar),
        h('div', { class:'lw-stat' }, statOficio, h('span', null, 'de 11 de oficio que podría saltar')),
        h('div', { class:'lw-stat' }, statNiv, h('span', null, 'módulos de nivelación'))),
      h('div', { class:'cmap', 'data-stagger':'22', 'data-rv':'' }, rows),
      h('div', { class:'cmap-legend' },
        h('span', null, h('i', { class:'tile core' }), 'Core Lumine'), h('span', null, h('i', { class:'tile oficio' }), 'Oficio'),
        h('span', null, h('i', { class:'tile desarrollo' }), 'Desarrollo'), h('span', null, h('i', { class:'tile oficio skip' }), 'Demostrada en la jornada')),
      chips));
  pintar(0);
  stop();
  const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  if(!reduce){
    HERO_TIMER = setInterval(() => { if(manual || !document.body.contains(box)){ stop(); return; } pintar((idx + 1) % HERO_PERFILES.length); }, 4200);
    box.addEventListener('pointerenter', () => { manual = true; stop(); });
    box.addEventListener('focusin', () => { manual = true; stop(); });
  }
  return box;
}

/* recorrido: el kit se arma en 3D mientras se baja por la página */
const HISTORIA = [
  { k:'El punto de partida', t:'El auto llega tal como es.', d:'Motor a combustión y tracción delantera, sin cambios. El kit se suma: no reemplaza nada del auto original.', piezas:[], foco:'combustion', vista:[-1.2, 0.3, 7.4] },

  { k:'Energía', t:'El banco de baterías.', d:'Se monta con elevador, sin golpes. Una batería golpeada se aísla y se vigila, aunque se vea normal.', piezas:['bateria'], foco:'bateria' },
  { k:'Alta tensión', t:'El cableado naranja.', d:'Rutas, fijaciones y protecciones antes de conectar. Se mide la aislación con megóhmetro y se revisa con termografía al energizar.', piezas:['cables'], foco:'cables' },
  { k:'El cerebro', t:'La unidad de control con IA.', d:'Decide cuándo asiste el motor eléctrico y corta el torque ante patinaje, falla o sobretemperatura.', piezas:['ecu'], foco:'ecu' },
  { k:'Sabe o no sabe', t:'Cada paso se aprende y se valida.', d:'39 competencias, cuatro niveles y una validación presencial por nivel. Lo online enseña; el nivel se gana en el taller.', piezas:[], foco:null, xray:true }
];
function secHistoria(){
  const stage = h('div', { class:'lab-stage hist-stage' });
  const pasos = HISTORIA.map((p, i) => h('div', { class:'hist-paso' + (i === 0 ? ' on' : ''), dataset:{ i:String(i) } },
    h('div', { class:'hist-txt' }, h('span', { class:'hist-n' }, String(i + 1).padStart(2, '0') + ' · ' + p.k), h('h3', { class:'hist-t' }, p.t), h('p', { class:'body ink2' }, p.d))));
  const dots = h('div', { class:'hist-dots', 'aria-hidden':'true' }, HISTORIA.map((_, i) => h('i', { class: i === 0 ? 'on' : '' })));
  const sticky = h('div', { class:'hist-sticky' }, h('div', { class:'lab-frame' }, stage, dots));
  let api = null, actual = -1;
  const activar = i => {
    if(i === actual || !api) return;
    actual = i;
    pasos.forEach((el, j) => el.classList.toggle('on', j === i));
    Array.from(dots.children).forEach((el, j) => el.classList.toggle('on', j <= i));
    const vis = HISTORIA.slice(0, i + 1).flatMap(x => x.piezas);
    api.mostrar(vis);
    HISTORIA[i].piezas.forEach((pz, k) => setTimeout(() => api.aparecer(pz), k * 300));
    api.modo({ xray: !!HISTORIA[i].xray || i > 0 && i < 5 });
    if(HISTORIA[i].foco){ api.enfocar(HISTORIA[i].foco); } else { api.soltar(); api.vista(-0.75, 0.32, 7.6); }
    if(HISTORIA[i].vista) api.vista(...HISTORIA[i].vista);
  };
  setTimeout(() => {
    if(!document.body.contains(stage)) return;
    api = Lab3D.crear(stage, { auto:false, hotspots:false, interactivo:true, visibles:[], etiqueta:'Recorrido 3D: el kit Lumine se arma pieza por pieza en el eje trasero de un auto genérico' });
    activar(0);
    // paso activo = el texto cuyo centro está más cerca del centro de la zona libre de lectura
    // (bajo el visor en teléfono, toda la pantalla en PC): no se apaga un texto que se está leyendo
    let raf = 0;
    const medir = () => {
      raf = 0;
      if(!document.body.contains(stage)){ window.removeEventListener('scroll', pedir); window.removeEventListener('resize', pedir); return; }
      const movil = window.innerWidth <= 860;
      const arriba = movil ? sticky.getBoundingClientRect().bottom : 0;
      const centro = arriba + (window.innerHeight - arriba) * (movil ? 0.42 : 0.5);
      // PC: el más cercano al centro. Teléfono: el más visible bajo el visor (empate: el de más arriba)
      let mejor = 0, puntaje = -Infinity;
      pasos.forEach((el, i) => {
        const r = el.querySelector('.hist-txt').getBoundingClientRect();
        const p = movil ? Math.round(Math.max(0, Math.min(r.bottom, window.innerHeight) - Math.max(r.top, arriba)) / r.height * 20) / 20 : -Math.abs((r.top + r.bottom) / 2 - centro);
        if(p > puntaje){ puntaje = p; mejor = i; }
      });
      activar(mejor);
    };
    const pedir = () => { if(!raf) raf = requestAnimationFrame(medir); };
    window.addEventListener('scroll', pedir, { passive:true }); window.addEventListener('resize', pedir);
    medir();
  }, 0);
  return h('section', { class:'wrap lsec hist', id:'historia' },
    h('div', { class:'center-h', 'data-rv':'' }, eyebrow('El kit, pieza por pieza', 'cube'), h('h2', { class:'h1 xl' }, 'Baja y míralo armarse.'),
      h('p', { class:'lead' }, 'Esto es lo que aprende a instalar un técnico de Lumine, en el mismo orden en que se hace en el taller.')),
    h('div', { class:'hist-grid' },
      sticky,
      h('div', { class:'hist-pasos' }, pasos)));
}

/* ---------- próximo paso de una persona (vista de administración) ---------- */
function proximoPaso(p){
  const pr = params();
  if(p.etapa === 'postulante'){
    const d = estadoDiagnostico(p);
    const jt = sesionAbiertaDe(p.id, 'JT');
    if(!d.fundamentos) return { s:'info', t:'Falta la prueba de fundamentos', d:'Se rinde online. También se puede registrar aquí si la hizo en papel.', a:'fund' };
    if(!d.jornada && jt) return { s:'info', t:'Jornada técnica en curso', d: resumenSesion(jt).marcados + ' de ' + resumenSesion(jt).total + ' ítems marcados.', a:'sesion', sid: jt.id };
    if(!d.jornada) return { s:'info', t:'Programar la jornada técnica', d: mapaPreliminar(p.antecedentes).length + ' estaciones de oficio marcadas por su mapa preliminar.', a:'JT' };
    const r = resumenRuta(p, pr);
    return { s:'ok', t:'Diagnóstico completo: decidir ingreso', d:'Ruta de ' + r.cursar + ' competencias, ' + r.oficio + ' de oficio demostradas y ' + r.nivelacion + ' módulos de nivelación.', a:'ingreso' };
  }
  if(p.etapa !== 'tecnico') return null;
  if(p.suspendidoAT) return { s:'crit', t:'Suspendido de alta tensión', d:'Tuvo un incidente grave. Programa la revalidación del core de seguridad.', a:'REV' };
  const rv = revalidacion(p, pr, S.hoy);
  if(rv.estado === 'vencida') return { s:'crit', t:'Revalidación vencida', d:'Venció el ' + fechaLarga(rv.vence) + '.', a:'REV' };
  const sig = siguienteNivel(p);
  if(!sig) return { s:'ok', t:'Formador habilitado', d:'Puede enseñar, validar a otros y firmar revisiones cruzadas.', a:null };
  const abierta = sesionAbiertaDe(p.id, 'N' + sig);
  if(abierta) return { s:'info', t:'Validación del nivel ' + sig + ' en curso', d: resumenSesion(abierta).marcados + ' de ' + resumenSesion(abierta).total + ' ítems marcados.', a:'sesion', sid: abierta.id };
  const rep = repetir(p);
  if(rep.length) return { s:'warn', t:'Repetir: ' + rep.join(', '), d:'Se repite solo lo reprobado, no la validación completa.', a:'N' + sig };
  const lp = listoAdmin(p, sig);
  if(rv.estado === 'pronto') return { s:'warn', t:'Revalidación por vencer', d:'Vence el ' + fechaLarga(rv.vence) + '. Siguiente nivel: ' + sig + '.', a:'REV' };
  return { s: lp.listo === false ? 'info' : 'ok', t:'Siguiente: validación del nivel ' + sig, d: lp.txt, a:'N' + sig };
}
function listoAdmin(p, n){
  if(!p.uid) return { listo:null, txt:'Sin cuenta vinculada: la práctica online no se puede verificar.' };
  const plan = planPersonal(p, params());
  const r = listoParaPresentarse(n, plan, S.D.avance[p.uid]);
  return { listo:r.listo, txt: r.listo ? 'Completó la práctica online del nivel: tiene derecho a presentarse.' : 'Práctica online: faltan ' + r.faltan.length + ' de ' + r.total + ' módulos (' + r.faltan.join(', ') + ').', faltan:r.faltan };
}

/* ---------- hoja: programar validación ---------- */
function evaluadoresInternos(){
  const g = gestion();
  const out = [];
  for(const uid of Object.keys(g.equipo)){ const r = g.equipo[uid].rol; if(r === 'rt' || r === 'admin' || r === 'formador') out.push({ uid, rol:r }); }
  if(S.me.id && !out.some(x => x.uid === S.me.id) && S.role === 'admin') out.unshift({ uid:S.me.id, rol: miRol() || 'admin' });
  return out;
}
function hojaNuevaSesion(pidFijo, tipoFijo){
  const cand = personas().filter(p => tiposPosibles(p).length);
  if(!cand.length){ toast('No hay personas con una validación pendiente', 'info'); return; }
  const st = { pid: pidFijo && persona(pidFijo) ? pidFijo : cand[0].id, tipo: tipoFijo || null, fecha: S.hoy, asig:{}, override:'' };
  openSheet('Programar validación', close => {
    const box = h('div', { class:'stack', style:'--g:16px' });
    const pintar = () => {
      clear(box);
      const p = persona(st.pid);
      const tipos = tiposPosibles(p).filter(t => !sesionAbiertaDe(p.id, t));
      if(!tipos.includes(st.tipo)) st.tipo = tipos[0] || null;
      const selP = selectEl(cand.map(x => [x.id, x.nombre + ' · ' + (x.etapa === 'postulante' ? 'postulante' : nivelNombre(x.nivel || 0))]), st.pid);
      selP.addEventListener('change', () => { st.pid = selP.value; st.tipo = null; st.asig = {}; pintar(); });
      box.appendChild(field('Persona', selP));
      if(!st.tipo){ box.appendChild(notice('info', 'info', p.nombre + ' ya tiene abiertas todas las validaciones que le corresponden.')); return; }
      const selT = selectEl(tipos.map(t => [t, TIPOS_SESION[t].l + ' · ' + TIPOS_SESION[t].c]), st.tipo);
      selT.addEventListener('change', () => { st.tipo = selT.value; st.asig = {}; pintar(); });
      const fecha = inputEl({ type:'date', value: st.fecha, min: S.hoy });
      fecha.addEventListener('change', () => { if(parseISO(fecha.value)) st.fecha = fecha.value; });
      box.appendChild(h('div', { class:'grid g2', style:'--g:12px' }, field('Validación', selT), field('Fecha', fecha)));
      const codes = itemsParaNueva(p, st.tipo);
      const pre = preaprobadas(st.tipo, p);
      if(st.tipo !== 'JT' && !codes.length){ box.appendChild(notice('ok', 'check', 'No quedan competencias pendientes en este nivel.')); return; }
      // D8: la práctica online da derecho a presentarse
      let necesitaMotivo = false;
      if(/^N[1-4]$/.test(st.tipo)){
        const lp = listoAdmin(p, Number(st.tipo.slice(1)));
        if(lp.listo === false){ necesitaMotivo = true; box.appendChild(notice('warn', 'alert', h('b', null, 'Sin derecho a presentarse todavía. '), lp.txt + ' La práctica online da derecho a presentarse (D8).')); }
        else if(lp.listo === null) box.appendChild(notice('', 'info', lp.txt));
        else box.appendChild(notice('ok', 'check', lp.txt));
        if(Object.values(p.historial || {}).some(x => x.tipo === st.tipo)) box.appendChild(notice('info', 'refresh', 'Segundo intento o posterior: entra solo lo reprobado (regla de avance 1).'));
      }
      if(st.tipo === 'JT') box.appendChild(notice('info', 'info', 'Entran las estaciones que marcó su mapa preliminar, más la revisión de base en herramientas e instrumentos.'));
      const evs = evaluadoresInternos();
      const filas = codes.map(c => {
        const ev = evaluadorDe(c);
        let quien;
        if(ev === 'ext') quien = h('span', { class:'evtag ext' }, icon('shieldCheck', 's14'), 'Externa · banco genérico');
        else if(ev === 'ic') quien = h('span', { class:'evtag' }, icon('bolt', 's14'), 'Ingeniería de Calibración');
        else {
          const opts = [['', 'Quien valide (RT o administración)']].concat(evs.map(x => [x.uid, nombreUid(x.uid) + ' · ' + ROL_L[x.rol]]));
          quien = selectEl(opts, st.asig[c] || '', { 'aria-label':'Evaluador de ' + c, style:'min-height:34px;padding:5px 30px 5px 10px;font-size:13px;max-width:260px' });
          quien.addEventListener('change', () => {
            const v = quien.value;
            if(v){ const chk = puedeValidar(v, rolEquipo(v), p, Pmap(), duos(), personas(), c); if(!chk.ok){ toast(chk.motivo, 'warn'); quien.value = st.asig[c] || ''; return; } st.asig[c] = v; } else delete st.asig[c];
          });
        }
        return h('div', { class:'crow' }, codeTag(c), h('span', { class:'ct' }, C[c].t), quien);
      });
      box.appendChild(h('div', { class:'stack', style:'--g:6px' }, h('span', { class:'label' }, codes.length + (st.tipo === 'JT' ? ' estaciones' : ' competencias a evaluar') + (pre.length ? ' · ' + pre.length + ' ya aprobadas o demostradas' : '')), filas));
      let motivo = null;
      if(necesitaMotivo){ motivo = h('textarea', { class:'textarea', maxlength:'300', placeholder:'Por qué se programa sin práctica completa' }); box.appendChild(field('Motivo (obligatorio para programar igual)', motivo)); }
      const ok = btn('Programar', { kind:'action', icon:'calendar' });
      ok.addEventListener('click', () => busy(ok, async () => {
        const ov = motivo ? motivo.value.trim() : '';
        if(necesitaMotivo && !motivoValido(ov)) throw new Error('Escribe el motivo para programar sin práctica completa (mínimo 5 caracteres)');
        const id = await crearSesion({ pid: st.pid, tipo: st.tipo, fecha: st.fecha, codes, asig: st.asig, override: ov || null });
        toast('Validación programada'); close(); go('sesion-' + id);
      }));
      box.appendChild(h('div', { class:'row end' }, btn('Cancelar', { kind:'ghost', onClick: close }), ok));
    };
    pintar();
    return box;
  }, { wide:true });
}

VIEWS.taller = function(){
  const g = ui('taller', nuevoJuego());
  const stage = h('div', { class:'lab-stage taller-stage' });
  const mano = h('div', { class:'t-hand', role:'group', 'aria-label':'Cartas de tarea disponibles' });
  const feed = h('div', { class:'t-feed', 'aria-live':'polite' });
  const bita = h('ol', { class:'t-log', 'aria-label':'Bitácora de la instalación' });
  const reloj = h('b', { class:'num' }, '0:00');
  const cont = h('b', { class:'num' }, '0');
  const errs = h('b', { class:'num' }, '0');
  const seg = h('b', { class:'num' }, '0');
  const segBox = h('div', { class:'t-segc' }, h('small', null, 'Seguridad'), seg);
  const barra = h('i');
  const res = h('div');
  let api, tic = 0;

  const disponibles = () => TALLER_PASOS.filter(p => !g.hecho.includes(p.id) && p.req.every(r => g.hecho.includes(r)));
  const frontera = () => TALLER_PASOS.filter(p => !g.hecho.includes(p.id) && !p.req.every(r => g.hecho.includes(r)) && p.req.every(r => g.hecho.includes(r) || disponibles().some(d => d.id === r)));
  function repartir(){
    const disp = barajar(disponibles().map(p => p.id), nuevaSemilla());
    const cartas = disp.slice(0, Math.min(2, disp.length));
    const relleno = barajar(frontera().map(p => p.id).concat(TALLER_PASOS.filter(p => !g.hecho.includes(p.id) && !cartas.includes(p.id)).map(p => p.id).slice(0, 6)), nuevaSemilla());
    for(const id of relleno){ if(cartas.length >= 4) break; if(!cartas.includes(id)) cartas.push(id); }
    const trampas = TALLER_TRAMPAS.filter(x => !g.trampasUsadas.includes(x.id));
    if(trampas.length && g.hecho.length > 0 && Math.random() < 0.55) cartas.push(trampas[Math.floor(Math.random() * trampas.length)].id);
    else if(cartas.length < 5 && disp.length > cartas.filter(id => disp.includes(id)).length) cartas.push(disp.find(id => !cartas.includes(id)));
    g.mano = barajar(cartas.filter(Boolean), nuevaSemilla());
    g.intentadas = [];
  }
  function carta(id){
    const p = TPASO[id], x = p ? null : TALLER_TRAMPAS.find(t => t.id === id);
    const tried = g.intentadas.includes(id);
    const b = h('button', { type:'button', class:'t-card' + (tried ? ' tried' : '') + (x ? ' trap' : ''), 'data-k':'tc-' + id, disabled: tried || null },
      h('span', { class:'t-ta mono' }, p ? 'Tarea ' + p.ta : 'Atajo'),
      h('span', { class:'t-tt' }, p ? p.t : x.t),
      h('span', { class:'t-go' }, icon(tried ? 'x' : 'arrowRight', 's14')));
    b.addEventListener('click', () => jugar(id, b));
    return b;
  }
  function pintar(){
    const n = g.hecho.length, total = TALLER_PASOS.length;
    cont.textContent = String(n); errs.textContent = String(g.errores); seg.textContent = String(g.fallasSeg);
    segBox.classList.toggle('bad', g.fallasSeg > 0);
    barra.style.width = (n / total * 100).toFixed(1) + '%';
    clear(mano);
    if(n === total){ fin(); return; }
    if(!g.mano.length) repartir();
    g.mano.forEach(id => mano.appendChild(carta(id)));
    clear(feed);
    if(g.msg) feed.appendChild(h('div', { class:'t-msg ' + g.msg.k }, icon(g.msg.k === 'ok' ? 'checkCircle' : g.msg.k === 'seg' ? 'shieldX' : 'alert', 's16'), h('span', null, g.msg.t)));
    else feed.appendChild(h('div', { class:'t-msg' }, icon('info', 's16'), h('span', null, n ? 'Elige la siguiente tarea.' : 'El auto acaba de llegar al taller. ¿Por dónde parte el duo?')));
    clear(bita);
    g.log.slice(-6).forEach(l => bita.appendChild(h('li', null, h('span', { class:'mono xs' }, l.ta), h('span', null, l.t))));
    if(!g.log.length) bita.appendChild(h('li', { class:'muted' }, h('span', { class:'mono xs' }, '—'), h('span', null, 'Sin tareas todavía')));
  }
  function jugar(id, b){

    res = resultadosBusqueda(input.value);
    sel = Math.min(sel, Math.max(0, res.length - 1));
    clear(lista);
    if(!res.length){ lista.appendChild(h('p', { class:'hint', style:'padding:14px' }, 'Sin resultados para “' + input.value + '”.')); input.removeAttribute('aria-activedescendant'); return; }
    let grupo = null;
    res.forEach((r, i) => {
      if(r.grupo !== grupo){ grupo = r.grupo; lista.appendChild(h('div', { class:'cmdk-g', role:'presentation' }, grupo)); }
      const it = h('div', { class:'cmdk-it' + (i === sel ? ' on' : '') + (r.fn ? '' : ' muda'), id:'cmdk-' + i, role:'option', 'aria-selected': i === sel ? 'true' : 'false' },
        h('span', { class:'cmdk-ic' }, icon(r.ic || 'arrowRight', 's16')), h('span', { class:'cmdk-t' }, h('b', null, r.t), r.sub ? h('span', { class:'hint' }, r.sub) : null), r.fn ? icon('arrowRight', 's14') : null);
      it.addEventListener('click', () => elegir(i));
      it.addEventListener('mousemove', () => { if(sel !== i){ sel = i; marcar(); } });
      lista.appendChild(it);
    });
    marcar();
  };
  const marcar = () => { lista.querySelectorAll('.cmdk-it').forEach(el => { const on = el.id === 'cmdk-' + sel; el.classList.toggle('on', on); el.setAttribute('aria-selected', on ? 'true' : 'false'); }); const el = document.getElementById('cmdk-' + sel); if(el){ input.setAttribute('aria-activedescendant', el.id); el.scrollIntoView({ block:'nearest' }); } };
  input.addEventListener('input', () => { sel = 0; pintar(); });
  input.addEventListener('keydown', e => {
    if(e.key === 'ArrowDown'){ e.preventDefault(); sel = Math.min(res.length - 1, sel + 1); marcar(); }
    else if(e.key === 'ArrowUp'){ e.preventDefault(); sel = Math.max(0, sel - 1); marcar(); }
    else if(e.key === 'Enter'){ e.preventDefault(); elegir(sel); }
  });
  const box = h('div', { class:'cmdk', role:'dialog', 'aria-modal':'true', 'aria-label':'Búsqueda rápida' },
    h('div', { class:'cmdk-top' }, icon('search', 's20'), input, h('kbd', { class:'cmdk-kbd' }, 'Esc')), lista,
    h('div', { class:'cmdk-pie hint' }, '↑ ↓ para moverte · Enter para abrir' + (S.role === 'admin' ? ' · pega un código de credencial para verificarlo' : '')));
  const scrim = h('div', { class:'scrim' });
  const wrap = h('div', { class:'cmdk-wrap' }, box);
  const cerrar = () => { if(!CMDK) return; untrap(); wrap.remove(); scrim.remove(); document.body.style.overflow = ''; CMDK = null; if(prev && prev.focus && document.contains(prev)) prev.focus(); };
  wrap.addEventListener('click', e => { if(e.target === wrap) cerrar(); });
  scrim.addEventListener('click', cerrar);
  document.body.appendChild(scrim); document.body.appendChild(wrap); document.body.style.overflow = 'hidden';
  const untrap = trapFocus(box, cerrar);
  CMDK = { cerrar };
  pintar();
  setTimeout(() => input.focus(), 20);
}
function botonBuscar(){
  if(S.kiosk || (S.role !== 'admin' && S.role !== 'tecnico')) return null;
  const b = h('button', { type:'button', class:'btn btn-quiet icon nav-buscar', 'aria-label':'Buscar (Ctrl+K)', title:'Buscar (Ctrl+K)' }, icon('search', 's20'));
  b.addEventListener('click', abrirBusqueda);
  return b;
}
document.addEventListener('keydown', e => {
  const escribiendo = /^(INPUT|TEXTAREA|SELECT)$/.test((document.activeElement || {}).tagName || '') || (document.activeElement && document.activeElement.isContentEditable);
  if(((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') || (e.key === '/' && !escribiendo && !SHEET && !document.querySelector('.dialog-wrap'))){
    if(S.role !== 'admin' && S.role !== 'tecnico') return;
    e.preventDefault();
    if(CMDK) CMDK.cerrar(); else abrirBusqueda();
  }
});
