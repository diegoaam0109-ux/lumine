  --ice:#e8f6fd; --ice-line:#bfe4f5;
  --ok:#1F7A4D; --ok-bg:#e7f4ec; --warn:#A15C07; --warn-bg:#fcf1df; --crit:#B91C1C; --crit-bg:#fcebeb;
  --on-status:#ffffff;
  --chart:#0A7AAD; --chart-muted:#c9d0d4; --grid:#e8ecee;
  --ring:rgba(10,122,173,.38);
  --shadow-btn: 0 4px 10px rgba(0,0,0,.05);
  --shadow-cta: 0 20px 25px -5px rgba(0,0,0,.05), 0 8px 10px -6px rgba(0,0,0,.05);
  --shadow-float: 0 10px 15px -3px rgba(0,0,0,.10), 0 4px 6px -4px rgba(0,0,0,.10);
  --shadow-pop: 0 18px 40px -12px rgba(16,24,28,.28), 0 2px 6px rgba(16,24,28,.08);
  --glass: none;
  --nav-bg: rgba(252,252,252,.84);
  --inset: inset 0 1.5px 0 rgba(255,255,255,.7);
  --scrim: rgba(12,16,18,.42);
  --amb-a: rgba(18,170,233,.07); --amb-b: rgba(18,170,233,.0); --gridline: rgba(31,35,38,.035);
}

/* ============ base ============ */
*,*::before,*::after{ box-sizing:border-box; }
html{ -webkit-text-size-adjust:100%; text-size-adjust:100%; scroll-padding-top:96px; }
body{
  margin:0; background:var(--paper); color:var(--ink);
  font-family:var(--font); font-size:15px; line-height:1.55;
  -webkit-font-smoothing:antialiased; -moz-osx-font-smoothing:grayscale;
  overflow-x:hidden; min-height:100vh;
}
img,svg{ max-width:100%; }
svg{ flex-shrink:0; }
button,input,select,textarea{ font:inherit; color:inherit; }
button{ cursor:pointer; }
a{ color:var(--action); text-decoration-thickness:1px; text-underline-offset:3px; }
a:hover{ color:var(--action-hover); }
h1,h2,h3,h4{ margin:0; font-weight:700; letter-spacing:-0.01em; text-wrap:balance; }
p{ margin:0; }
ul,ol{ margin:0; padding:0; }
:focus-visible{ outline:2px solid var(--action); outline-offset:2px; border-radius:6px; }
::selection{ background:var(--ice-line); color:var(--ink); }
.sr{ position:absolute!important; width:1px; height:1px; padding:0; margin:-1px; overflow:hidden; clip:rect(0 0 0 0); white-space:nowrap; border:0; }
.skiplink{ position:fixed; left:12px; top:-60px; z-index:200; background:var(--owner); color:var(--on-owner); padding:10px 16px; border-radius:var(--r-pill); text-decoration:none; transition:top .2s; }
.skiplink:focus{ top:calc(env(safe-area-inset-top,0px) + 12px); color:var(--on-owner); }
.mono{ font-family:var(--mono); font-size:.92em; letter-spacing:0; }
.num{ font-variant-numeric:tabular-nums; }
.muted{ color:var(--muted); }
.ink2{ color:var(--ink-2); }
.small{ font-size:13px; }
.xs{ font-size:12px; }
.nowrap{ white-space:nowrap; }
.wrap{ max-width:var(--max); margin-inline:auto; padding-inline:var(--gutter); }
.stack{ display:flex; flex-direction:column; gap:var(--g,12px); }
.row{ display:flex; align-items:center; gap:var(--g,8px); flex-wrap:wrap; }
.row.nw{ flex-wrap:nowrap; }
.row.sb{ justify-content:space-between; }
.row.end{ justify-content:flex-end; }
.grow{ flex:1 1 auto; min-width:0; }
.grid{ display:grid; gap:var(--g,16px); }
.g2{ grid-template-columns:repeat(2,minmax(0,1fr)); }
.g3{ grid-template-columns:repeat(3,minmax(0,1fr)); }
.g4{ grid-template-columns:repeat(4,minmax(0,1fr)); }
@media (max-width:1023px){ .g4{ grid-template-columns:repeat(2,minmax(0,1fr)); } .g3{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
@media (max-width:719px){ .g2,.g3,.g4{ grid-template-columns:minmax(0,1fr); } .g4.keep2{ grid-template-columns:repeat(2,minmax(0,1fr)); } }

/* ============ tipografía ============ */
.eyebrow{ display:inline-flex; align-items:center; gap:8px; font-size:12px; font-weight:600; letter-spacing:.2em; text-transform:uppercase; color:var(--ink-2); }
.eyebrow .ic{ color:var(--spark); }
.eyebrow.spark{ color:var(--action); }
.display{ font-size:clamp(38px,5.4vw,60px); line-height:1.05; font-weight:700; letter-spacing:-0.025em; }
.h1{ font-size:clamp(28px,3.4vw,36px); line-height:1.15; letter-spacing:-0.02em; }
.h2{ font-size:clamp(24px,2.6vw,30px); line-height:1.2; letter-spacing:-0.015em; }
.h3{ font-size:20px; line-height:1.35; font-weight:600; letter-spacing:-0.005em; }
.h4{ font-size:16px; line-height:1.4; font-weight:600; letter-spacing:0; }
.lead{ font-size:clamp(16px,1.35vw,18px); line-height:1.6; color:var(--ink-2); max-width:62ch; }
.body{ font-size:16px; line-height:1.63; color:var(--ink-2); }
.prose{ max-width:68ch; color:var(--ink-2); }
.prose p+p{ margin-top:10px; }
.label{ font-size:13px; font-weight:600; color:var(--ink); }
.hint{ font-size:12.5px; color:var(--muted); line-height:1.45; }

/* ============ íconos ============ */
.ic{ width:18px; height:18px; display:inline-block; vertical-align:-3px; }
.ic.s14{ width:14px; height:14px; vertical-align:-2px; }
.ic.s16{ width:16px; height:16px; }
.ic.s20{ width:20px; height:20px; }
.ic.s24{ width:24px; height:24px; }

/* ============ marca (máscaras del logo) ============ */
.brand{ display:inline-flex; align-items:center; gap:10px; color:var(--ink); text-decoration:none; }
.brand:hover{ color:var(--ink); }
.emblem{ width:26px; height:26px; background:currentColor; -webkit-mask:var(--logo-emblem) center/contain no-repeat; mask:var(--logo-emblem) center/contain no-repeat; flex:none; }
.wordmark{ position:relative; height:15px; aspect-ratio:var(--logo-wm-ratio); flex:none; }
.wordmark::before,.wordmark::after{ content:""; position:absolute; inset:0; }
.wordmark::before{ background:currentColor; -webkit-mask:var(--logo-wm) center/contain no-repeat; mask:var(--logo-wm) center/contain no-repeat; }
.wordmark::after{ background:var(--spark); -webkit-mask:var(--logo-wm-acc) center/contain no-repeat; mask:var(--logo-wm-acc) center/contain no-repeat; }
.lockup{ position:relative; width:200px; aspect-ratio:var(--logo-lk-ratio); }
.lockup::before,.lockup::after{ content:""; position:absolute; inset:0; }
.lockup::before{ background:currentColor; -webkit-mask:var(--logo-lk) center/contain no-repeat; mask:var(--logo-lk) center/contain no-repeat; }
.lockup::after{ background:var(--spark); -webkit-mask:var(--logo-lk-acc) center/contain no-repeat; mask:var(--logo-lk-acc) center/contain no-repeat; }
.brand-sub{ font-size:12px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); padding-left:10px; border-left:1px solid var(--line-2); line-height:1; }

/* ============ botones ============ */
.btn{
  --bh:40px;
  display:inline-flex; align-items:center; justify-content:center; gap:8px;
  height:var(--bh); padding:0 18px; border-radius:var(--r-pill); border:1px solid transparent;
  font-size:14px; font-weight:600; line-height:1; white-space:nowrap; text-decoration:none;
  transition:background-color .15s var(--ease), color .15s, border-color .15s, box-shadow .15s, transform .12s;
  user-select:none; -webkit-tap-highlight-color:transparent; position:relative;
}
.btn:active:not(:disabled){ transform:translateY(1px); }
.btn:disabled,.btn[aria-disabled="true"]{ opacity:.45; cursor:not-allowed; }
.btn-owner{ background:var(--owner); color:var(--on-owner); box-shadow:var(--shadow-btn); }
.btn-owner:hover:not(:disabled){ background:var(--owner-hover); color:var(--on-owner); }
.btn-action{ background:var(--action); color:var(--on-action); box-shadow:var(--shadow-btn); }
.btn-action:hover:not(:disabled){ background:var(--action-hover); color:var(--on-action); }
.btn-ghost{ background:transparent; color:var(--ink); border-color:var(--line-2); }
.btn-ghost:hover:not(:disabled){ background:var(--mist); color:var(--ink); }
.btn-quiet{ background:transparent; color:var(--ink-2); padding:0 12px; }
.btn-quiet:hover:not(:disabled){ background:var(--mist); color:var(--ink); }
.btn-danger{ background:transparent; color:var(--crit); border-color:color-mix(in srgb, var(--crit) 40%, transparent); }
.btn-danger:hover:not(:disabled){ background:var(--crit-bg); color:var(--crit); }
.btn-danger.solid{ background:var(--crit); color:var(--on-status); border-color:var(--crit); }
.btn.sm{ --bh:32px; padding:0 13px; font-size:13px; gap:6px; }
.btn.lg{ --bh:48px; padding:0 24px; font-size:15px; }
.btn.icon{ width:var(--bh); padding:0; }
.btn.busy{ color:transparent!important; pointer-events:none; }
.btn.busy::after{ content:""; position:absolute; width:16px; height:16px; border-radius:50%; border:2px solid currentColor; border-color:var(--on-action) transparent var(--on-action) transparent; animation:spin .7s linear infinite; }
.btn-ghost.busy::after,.btn-quiet.busy::after{ border-color:var(--ink) transparent var(--ink) transparent; }
.btn-owner.busy::after{ border-color:var(--on-owner) transparent var(--on-owner) transparent; }
@keyframes spin{ to{ transform:rotate(360deg); } }
.linkbtn{ background:none; border:0; padding:0; color:var(--action); font-weight:600; text-decoration:underline; text-decoration-thickness:1px; text-underline-offset:3px; }
.linkbtn:hover{ color:var(--action-hover); }

/* ============ formularios ============ */
.field{ display:flex; flex-direction:column; gap:6px; min-width:0; }
.input,.select,.textarea{
  width:100%; min-height:40px; padding:9px 12px; border-radius:var(--r-input);
  background:var(--raised); border:1px solid var(--line-2); color:var(--ink);
  transition:border-color .15s, box-shadow .15s;
}
.textarea{ min-height:84px; resize:vertical; line-height:1.5; }
.select{ appearance:none; padding-right:34px; background-image:linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position:calc(100% - 17px) 17px, calc(100% - 12px) 17px; background-size:5px 5px; background-repeat:no-repeat; }
.input:focus,.select:focus,.textarea:focus{ outline:none; border-color:var(--action); box-shadow:0 0 0 3px var(--ring); }
.input::placeholder,.textarea::placeholder{ color:var(--muted); opacity:.85; }
.input[aria-invalid="true"]{ border-color:var(--crit); }
.check{ display:flex; align-items:flex-start; gap:10px; padding:10px 12px; border:1px solid var(--line); border-radius:10px; background:var(--card); cursor:pointer; transition:border-color .15s, background-color .15s; }
.check:hover{ border-color:var(--line-2); }
.check input{ margin:3px 0 0; width:16px; height:16px; accent-color:var(--action); flex:none; }
.check.on{ border-color:var(--ice-line); background:var(--ice); }
.switch{ position:relative; width:40px; height:24px; flex:none; }
.switch input{ position:absolute; inset:0; opacity:0; margin:0; cursor:pointer; }
.switch span{ position:absolute; inset:0; border-radius:99px; background:var(--line-2); transition:background-color .15s; pointer-events:none; }
.switch span::after{ content:""; position:absolute; top:3px; left:3px; width:18px; height:18px; border-radius:50%; background:#fff; box-shadow:0 1px 2px rgba(0,0,0,.25); transition:transform .18s var(--ease); }
.switch input:checked+span{ background:var(--action); }
.switch input:checked+span::after{ transform:translateX(16px); }
.switch input:focus-visible+span{ box-shadow:0 0 0 3px var(--ring); }

/* ============ tarjetas y superficies ============ */
.card{ background:var(--card); border:1px solid var(--line); border-radius:var(--r-card); padding:var(--pad,20px); min-width:0; }
.card.flat{ background:transparent; }
.card.mist{ background:var(--mist); border-color:transparent; }
.card.ice{ background:var(--ice); border-color:var(--ice-line); }
.card.lift{ box-shadow:var(--shadow-cta); }
.card.link{ transition:border-color .15s, box-shadow .2s var(--ease), transform .2s var(--ease); cursor:pointer; text-align:left; width:100%; display:block; color:inherit; font:inherit; }
.card.link:hover{ border-color:var(--line-2); box-shadow:var(--shadow-btn); }
.card-h{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin-bottom:12px; flex-wrap:wrap; }
.divider{ height:1px; background:var(--line); border:0; margin:16px 0; }
.kv{ display:grid; grid-template-columns:minmax(120px,max-content) 1fr; gap:8px 16px; font-size:14px; }
.kv dt{ color:var(--muted); }
.kv dd{ margin:0; color:var(--ink); min-width:0; overflow-wrap:anywhere; }
@media (max-width:480px){ .kv{ grid-template-columns:1fr; gap:2px; } .kv dd{ margin-bottom:8px; } }

/* ============ insignias y chips ============ */
.badge{ display:inline-flex; align-items:center; gap:5px; height:24px; padding:0 10px; border-radius:var(--r-pill); font-size:12px; font-weight:600; background:var(--mist); color:var(--ink-2); white-space:nowrap; border:1px solid transparent; }
.badge .ic{ width:13px; height:13px; vertical-align:0; }
.badge.ok{ background:var(--ok-bg); color:var(--ok); }
.badge.warn{ background:var(--warn-bg); color:var(--warn); }
.badge.crit{ background:var(--crit-bg); color:var(--crit); }
.badge.info{ background:var(--ice); color:var(--action); }
.badge.line{ background:transparent; border-color:var(--line-2); }
.badge.ink{ background:var(--owner); color:var(--on-owner); }
.badge.demo{ background:transparent; border:1px dashed var(--line-2); color:var(--muted); }
.chip{ display:inline-flex; align-items:center; gap:6px; min-height:32px; padding:0 13px; border-radius:var(--r-pill); border:1px solid var(--line-2); background:var(--card); color:var(--ink-2); font-size:13px; font-weight:500; transition:all .15s; }
.chip:hover{ border-color:var(--ink-2); color:var(--ink); }
.chip[aria-pressed="true"],.chip.on{ background:var(--owner); color:var(--on-owner); border-color:var(--owner); }
.chip .n{ font-variant-numeric:tabular-nums; opacity:.7; font-size:12px; }
.code{ font-family:var(--mono); font-size:12px; font-weight:500; padding:2px 7px; border-radius:6px; background:var(--mist); color:var(--ink); letter-spacing:0; white-space:nowrap; }
.dot{ width:8px; height:8px; border-radius:50%; display:inline-block; background:var(--muted); flex:none; }
.dot.ok{ background:var(--ok); } .dot.warn{ background:var(--warn); } .dot.crit{ background:var(--crit); } .dot.spark{ background:var(--spark); }

/* ============ segmentado y pestañas ============ */
.seg{ display:inline-flex; padding:3px; gap:2px; background:var(--mist); border-radius:var(--r-pill); border:1px solid var(--line); max-width:100%; overflow-x:auto; scrollbar-width:none; }
.seg::-webkit-scrollbar{ display:none; }
.seg button{ border:1px solid transparent; background:transparent; color:var(--muted); height:34px; padding:0 14px; border-radius:var(--r-pill); font-size:13.5px; font-weight:600; display:inline-flex; align-items:center; gap:7px; white-space:nowrap; transition:all .15s; }
.seg button:hover{ color:var(--ink); }
.seg button[aria-selected="true"],.seg button[aria-pressed="true"]{ background:var(--raised); color:var(--ink); border-color:var(--line); box-shadow:var(--shadow-btn); }
.tabs{ display:flex; gap:4px; border-bottom:1px solid var(--line); overflow-x:auto; scrollbar-width:none; margin-bottom:20px; }
.tabs::-webkit-scrollbar{ display:none; }
.tabs button{ background:none; border:0; padding:10px 12px 12px; font-size:14px; font-weight:600; color:var(--muted); border-bottom:2px solid transparent; margin-bottom:-1px; white-space:nowrap; display:inline-flex; gap:7px; align-items:center; }
.tabs button:hover{ color:var(--ink); }
.tabs button[aria-selected="true"]{ color:var(--ink); border-bottom-color:var(--spark); }
.tabs .count{ font-size:11.5px; background:var(--mist); border-radius:99px; padding:1px 7px; color:var(--ink-2); }

/* ============ tablas ============ */
.tscroll{ overflow-x:auto; border:1px solid var(--line); border-radius:var(--r-card); background:var(--card); }
table.t{ width:100%; border-collapse:collapse; font-size:14px; }
.t th{ text-align:left; font-size:12px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--muted); padding:11px 14px; border-bottom:1px solid var(--line); background:var(--mist); white-space:nowrap; }
.t td{ padding:12px 14px; border-bottom:1px solid var(--line); vertical-align:middle; }
.t tr:last-child td{ border-bottom:0; }
.t tbody tr.click{ cursor:pointer; transition:background-color .12s; }
.t tbody tr.click:hover{ background:var(--mist); }
.t td.r,.t th.r{ text-align:right; }
.t .num{ font-variant-numeric:tabular-nums; }

/* ============ estados vacíos, avisos ============ */
.empty{ display:flex; flex-direction:column; align-items:center; text-align:center; gap:10px; padding:36px 20px; border:1px dashed var(--line-2); border-radius:var(--r-card); color:var(--muted); }
.empty .ic{ width:28px; height:28px; color:var(--line-2); }
.notice{ display:flex; gap:12px; align-items:flex-start; padding:12px 14px; border-radius:10px; font-size:14px; line-height:1.5; border:1px solid var(--line); background:var(--mist); color:var(--ink-2); }
.notice>.ic{ margin-top:2px; flex:none; }
.notice.info{ background:var(--ice); border-color:var(--ice-line); color:var(--ink); }
.notice.info>.ic{ color:var(--action); }
.notice.warn{ background:var(--warn-bg); border-color:color-mix(in srgb, var(--warn) 30%, transparent); color:var(--ink); }
.notice.warn>.ic{ color:var(--warn); }
.notice.crit{ background:var(--crit-bg); border-color:color-mix(in srgb, var(--crit) 30%, transparent); color:var(--ink); }
.notice.crit>.ic{ color:var(--crit); }
.notice.ok{ background:var(--ok-bg); border-color:color-mix(in srgb, var(--ok) 30%, transparent); color:var(--ink); }
.notice.ok>.ic{ color:var(--ok); }
.notice b{ color:var(--ink); }

/* ============ animaciones ============ */
@keyframes rise{ from{ opacity:0; transform:translateY(8px); } to{ opacity:1; transform:none; } }
@keyframes fade{ from{ opacity:0; } to{ opacity:1; } }
@keyframes pop{ from{ opacity:0; transform:scale(.96); } to{ opacity:1; transform:none; } }
@keyframes pulse{ 0%,100%{ box-shadow:0 0 0 0 rgba(34,184,240,.45); } 50%{ box-shadow:0 0 0 8px rgba(34,184,240,0); } }
.view-enter{ animation:rise .35s var(--ease) both; }
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{ animation-duration:.001ms!important; animation-iteration-count:1!important; transition-duration:.001ms!important; scroll-behavior:auto!important; }
}

/* ============ barra de demostración ============ */
.demobar{ display:flex; justify-content:center; align-items:center; gap:10px; flex-wrap:wrap; padding:10px var(--gutter) 0; font-size:12.5px; color:var(--muted); }
.demobar .badge{ letter-spacing:.14em; text-transform:uppercase; font-size:10.5px; height:22px; }
.demobar .linkbtn{ font-size:12.5px; }

/* ============ navegación flotante (Cap) ============ */
.topnav{ position:sticky; top:calc(env(safe-area-inset-top,0px) + 10px); z-index:50; padding-inline:var(--gutter); margin-top:10px; }
.topnav .pill{
  max-width:var(--max); margin-inline:auto; display:flex; align-items:center; gap:6px;
  height:56px; padding:0 8px 0 16px; border-radius:var(--r-pill);
  background:var(--nav-bg); -webkit-backdrop-filter:saturate(1.6) blur(14px); backdrop-filter:saturate(1.6) blur(14px);
  border:1px solid var(--line); box-shadow:var(--inset), 0 1px 2px rgba(0,0,0,.03);
}
.topnav .brand{ padding-right:6px; }
.navlinks{ display:flex; gap:2px; margin-inline:auto; min-width:0; }
.navlinks a{ position:relative; height:38px; padding:0 12px; border-radius:var(--r-pill); display:inline-flex; align-items:center; gap:7px; color:var(--ink-2); font-weight:500; font-size:14px; text-decoration:none; white-space:nowrap; transition:background-color .15s, color .15s; }
.navlinks a .ic{ width:16px; height:16px; opacity:.75; }
.navlinks a:hover{ background:var(--mist); color:var(--ink); }
.navlinks a[aria-current="page"]{ color:var(--ink); background:var(--mist); font-weight:600; }
.navlinks a[aria-current="page"] .ic{ color:var(--action); opacity:1; }
.navlinks a[aria-current="page"]::after{ content:""; position:absolute; left:50%; bottom:3px; width:4px; height:4px; margin-left:-2px; border-radius:50%; background:var(--spark); }
.nav-right{ display:flex; align-items:center; gap:6px; flex:none; }
.nav-title{ display:none; font-weight:600; font-size:14px; color:var(--ink); margin-inline:auto; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; min-width:0; }
.rolechip{ display:inline-flex; align-items:center; gap:8px; height:40px; padding:0 12px 0 5px; border-radius:var(--r-pill); border:1px solid var(--line); background:var(--raised); color:var(--ink); font-size:13px; font-weight:600; max-width:230px; }
.rolechip:hover{ border-color:var(--line-2); }
.rolechip .av{ width:30px; height:30px; }
.rolechip .rl{ display:flex; flex-direction:column; align-items:flex-start; line-height:1.15; min-width:0; }
.rolechip .rl small{ font-size:10.5px; font-weight:600; letter-spacing:.08em; text-transform:uppercase; color:var(--muted); }
.rolechip .rl span{ white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:150px; }
.av{ width:32px; height:32px; border-radius:50%; display:inline-grid; place-items:center; font-size:12px; font-weight:700; color:#fff; background:var(--ink-2); flex:none; overflow:hidden; letter-spacing:.02em; }
.av img{ width:100%; height:100%; object-fit:cover; }
.av.lg{ width:52px; height:52px; font-size:17px; }
.av.xl{ width:64px; height:64px; font-size:20px; }

/* tablet: menú en hoja */
@media (max-width:1180px){ .navlinks a{ padding:0 10px; font-size:13.5px; } .navlinks a .ic{ display:none; } }
@media (max-width:1023px){
  .navlinks{ display:none; }
  .nav-title{ display:block; }

/* ============ hoja lateral / inferior ============ */
.scrim{ position:fixed; inset:0; background:var(--scrim); z-index:90; animation:fade .2s both; }
.sheet{ position:fixed; z-index:91; background:var(--raised); border:1px solid var(--line); box-shadow:var(--shadow-pop); display:flex; flex-direction:column; overflow:hidden; }

}

}
@keyframes sheetUp{ from{ transform:translateY(40px); opacity:0; } to{ transform:none; opacity:1; } }

.menu-list{ display:flex; flex-direction:column; gap:2px; }

.menu-list .ic{ color:var(--muted); }
.menu-sep{ height:1px; background:var(--line); margin:10px 4px; }
.menu-cap{ font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--muted); padding:8px 12px 4px; }
.role-opt{ display:flex; align-items:center; gap:12px; width:100%; padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:var(--card); text-align:left; }

.dialog{ width:min(520px,100%); max-height:calc(100vh - 32px); overflow:auto; background:var(--raised); border:1px solid var(--line); border-radius:18px; box-shadow:var(--shadow-pop); padding:22px; animation:pop .22s var(--ease) both; }

.verdict.ok{ background:var(--ok-bg); border-color:color-mix(in srgb, var(--ok) 35%, transparent); }
.verdict.crit{ background:var(--crit-bg); border-color:color-mix(in srgb, var(--crit) 35%, transparent); }
.verdict .vi{ width:38px; height:38px; border-radius:50%; display:grid; place-items:center; background:var(--card); flex:none; }
.verdict.ok .vi{ color:var(--ok); } .verdict.crit .vi{ color:var(--crit); }
.verdict b{ font-size:16px; }
.rules3{ display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:10px; }
@media (max-width:719px){ .rules3{ grid-template-columns:minmax(0,1fr); } }
.rule{ border:1px solid var(--line); border-radius:12px; padding:12px 14px; background:var(--card); }
.rule b{ font-size:22px; display:block; line-height:1.1; }

/* roles */
.rolecard{ display:flex; flex-direction:column; gap:12px; }
.rolecard .ri{ width:40px; height:40px; border-radius:12px; display:grid; place-items:center; background:var(--mist); }
.rolecard .ri .ic{ width:20px; height:20px; }
.rolecard .nv{ font-size:13px; color:var(--muted); border-top:1px solid var(--line); padding-top:10px; margin-top:auto; display:flex; gap:8px; }
.rolecard .nv .ic{ color:var(--crit); margin-top:2px; }

/* tarjeta final (mundo Lumine, como las plantillas sociales) */
.ctacard{ position:relative; overflow:hidden; border-radius:var(--r-lg); padding:clamp(32px,6vw,64px); display:flex; flex-direction:column; align-items:flex-start; gap:18px; box-shadow:var(--shadow-cta); border:1px solid var(--lw-line); }
.ctacard h2{ color:var(--lw-ink); font-size:clamp(28px,3.6vw,44px); line-height:1.1; max-width:18ch; letter-spacing:-.02em; }
.ctacard p{ color:var(--lw-ink-2); max-width:56ch; font-size:16px; }
.ctacard .em{ position:absolute; right:clamp(18px,3vw,36px); bottom:clamp(18px,3vw,36px); width:52px; height:52px; color:#f2f6f7; }
.ctacard .btn-owner{ background:#f2f6f7; color:#0b0f11; }
.ctacard .btn-owner:hover{ background:#fff; color:#0b0f11; }
.ctacard .btn-action{ background:var(--lw-spark); color:#061015; }
.ctacard .btn-action:hover{ background:#55cbf6; color:#061015; }
.ctacard .linkbtn{ color:var(--lw-spark); }
.ctawash{ background:var(--wash); border-radius:24px; padding:clamp(10px,2vw,18px); }

/* ============ APLICACIÓN ============ */
.stat{ display:flex; flex-direction:column; gap:6px; min-width:0; }
.stat .sl{ font-size:13px; color:var(--muted); font-weight:500; display:flex; align-items:center; gap:6px; }
.stat .sv{ font-size:30px; font-weight:700; line-height:1.1; letter-spacing:-.015em; }
.stat .sv small{ font-size:15px; font-weight:600; color:var(--muted); margin-left:4px; letter-spacing:0; }
.stat .sd{ font-size:12.5px; color:var(--muted); }
.hero-num{ font-size:clamp(40px,5vw,56px); font-weight:700; line-height:1; letter-spacing:-.02em; }

/* alertas */
.alerts{ display:flex; flex-direction:column; gap:8px; }
.alert{ display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:12px; align-items:center; padding:12px 14px; border-radius:12px; border:1px solid var(--line); background:var(--card); }
.alert .ai{ width:34px; height:34px; border-radius:10px; display:grid; place-items:center; background:var(--mist); color:var(--ink-2); }
.alert.crit .ai{ background:var(--crit-bg); color:var(--crit); }
.alert.warn .ai{ background:var(--warn-bg); color:var(--warn); }
.alert.info .ai{ background:var(--ice); color:var(--action); }
.alert.ok .ai{ background:var(--ok-bg); color:var(--ok); }
.alert .at{ font-size:14px; font-weight:600; line-height:1.35; }
.alert .ad{ font-size:13px; color:var(--muted); line-height:1.4; margin-top:2px; }
@media (max-width:560px){ .alert{ grid-template-columns:auto minmax(0,1fr); } .alert .aa{ grid-column:1 / -1; } .alert .aa .btn{ width:100%; } }

/* pista de niveles */
.track{ display:flex; align-items:center; gap:0; width:100%; }
.track .tn{ display:flex; flex-direction:column; align-items:center; gap:6px; flex:none; width:44px; }
.track .tc{ width:30px; height:30px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:700; border:1.5px solid var(--line-2); color:var(--muted); background:var(--card); position:relative; }
.track .tn.done .tc{ background:var(--owner); border-color:var(--owner); color:var(--on-owner); }
.track .tn.now .tc{ border-color:var(--action); color:var(--action); background:var(--ice); animation:pulse 2.4s infinite; }
.track .tn.skip .tc{ border-style:dashed; }
.track .tl{ font-size:11px; color:var(--muted); font-weight:600; white-space:nowrap; }
.track .tn.done .tl,.track .tn.now .tl{ color:var(--ink); }
.track .tb{ flex:1 1 auto; height:2px; background:var(--line-2); margin-bottom:20px; min-width:8px; }
.track .tb.done{ background:var(--owner); }
.pips{ display:inline-flex; gap:3px; vertical-align:middle; }
.pips i{ width:14px; height:6px; border-radius:3px; background:var(--line-2); display:block; }
.pips i.on{ background:var(--ink); }
.pips i.now{ background:var(--spark); }

/* persona */
.phero{ display:flex; gap:16px; align-items:center; flex-wrap:wrap; }
.phero .pm{ display:flex; flex-direction:column; gap:6px; min-width:0; }
.tag-row{ display:flex; gap:6px; flex-wrap:wrap; }
.plan-f{ display:grid; grid-template-columns:repeat(5,minmax(0,1fr)); gap:8px; }
.plan-f .pf{ border:1px solid var(--line); border-radius:12px; padding:12px; background:var(--card); display:flex; flex-direction:column; gap:4px; min-width:0; }
.plan-f .pf b{ font-size:24px; line-height:1.1; }
.plan-f .pf span{ font-size:12.5px; color:var(--muted); line-height:1.3; }
.plan-f .pf.hl{ background:var(--ice); border-color:var(--ice-line); }
@media (max-width:900px){ .plan-f{ grid-template-columns:repeat(2,minmax(0,1fr)); } }
.cgroup{ display:flex; flex-direction:column; gap:6px; }
.crow{ display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; align-items:center; padding:9px 12px; border:1px solid var(--line); border-radius:10px; background:var(--card); }
.crow .ct{ font-size:13.5px; line-height:1.4; min-width:0; }
.crow.skip{ background:transparent; border-style:dashed; }
.crow.skip .ct{ color:var(--muted); }
@media (max-width:560px){ .crow{ grid-template-columns:auto minmax(0,1fr); } .crow>:last-child{ grid-column:2; justify-self:start; } }

/* sesiones */
.sess{ display:grid; grid-template-columns:minmax(0,1fr) auto; gap:14px; align-items:center; }
.progress{ height:6px; border-radius:6px; background:var(--mist); overflow:hidden; }
.progress i{ display:block; height:100%; background:var(--action); border-radius:6px; transition:width .4s var(--ease); }
.evtag{ display:inline-flex; align-items:center; gap:6px; font-size:12px; color:var(--ink-2); padding:3px 9px; border-radius:99px; background:var(--mist); white-space:nowrap; }
.evtag.ext{ background:transparent; border:1px solid var(--line-2); }

/* duos */
.duo{ display:flex; flex-direction:column; gap:14px; }
.duo .dm{ display:grid; grid-template-columns:minmax(0,1fr) auto minmax(0,1fr); gap:10px; align-items:center; }
.duo .mem{ display:flex; gap:10px; align-items:center; min-width:0; }
.duo .mem .mt{ display:flex; flex-direction:column; min-width:0; }
.duo .mem .mt b{ font-size:14px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.duo .mem.r{ flex-direction:row-reverse; text-align:right; }
.duo .link{ width:30px; height:30px; border-radius:50%; display:grid; place-items:center; background:var(--mist); color:var(--muted); }
.duo.okd .link{ background:var(--ice); color:var(--action); }
@media (max-width:420px){ .duo .dm{ grid-template-columns:minmax(0,1fr); } .duo .mem.r{ flex-direction:row; text-align:left; } .duo .link{ display:none; } }

/* gráficos */
.chart{ position:relative; width:100%; }
.chart svg{ display:block; width:100%; height:auto; overflow:visible; }
.chart .ax{ fill:var(--muted); font-size:11px; font-family:var(--font); }
.chart .axl{ fill:var(--ink-2); font-size:12px; font-family:var(--font); font-weight:500; }
.chart .val{ fill:var(--ink); font-size:12px; font-weight:600; font-family:var(--font); }
.chart .gl{ stroke:var(--grid); stroke-width:1; shape-rendering:crispEdges; }
.chart .base{ stroke:var(--line-2); stroke-width:1; shape-rendering:crispEdges; }
.chart .bar{ fill:var(--chart); transition:opacity .15s; }
.chart .bar.mut{ fill:var(--chart-muted); }
.chart .hit{ fill:transparent; cursor:default; }
.chart .hit:focus{ outline:none; }
.chart g.b:hover .bar,.chart g.b:focus-within .bar{ opacity:.8; }
.chart .meta-line{ stroke:var(--ink-2); stroke-width:1.5; stroke-dasharray:0; }
.ind-card{ display:flex; flex-direction:column; gap:14px; }
.ind-card .iq{ font-size:13px; color:var(--muted); }
.ind-card .ifoot{ margin-top:auto; border-top:1px solid var(--line); padding-top:10px; display:flex; flex-direction:column; gap:4px; font-size:12.5px; color:var(--muted); }
.ind-card .ifoot b{ color:var(--ink-2); font-weight:600; }
.ind-miss{ display:flex; flex-direction:column; gap:8px; padding:12px; border-radius:10px; background:var(--mist); font-size:13px; color:var(--ink-2); }

/* kiosco evaluador externo */
/* z-index 80: sobre la navegación (50/60) y BAJO el fondo de diálogos (90), los diálogos (110) y los avisos (130).
   Con 120 los diálogos de salir y entregar quedaban detrás del kiosco, invisibles: era la falla reportada. */
.kiosk{ position:fixed; inset:0; z-index:80; overflow-y:auto; overscroll-behavior:contain; padding:calc(env(safe-area-inset-top,0px) + 16px) var(--gutter) calc(env(safe-area-inset-bottom,0px) + 32px); }
.kiosk .kin{ max-width:760px; margin-inline:auto; display:flex; flex-direction:column; gap:18px; }
.kiosk .kh{ display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; }
.kiosk .kbrand{ display:flex; align-items:center; gap:10px; color:var(--lw-ink); }
.kiosk .kbrand .emblem{ width:30px; height:30px; }
.kiosk h1{ color:var(--lw-ink); font-size:clamp(24px,3vw,32px); line-height:1.15; }
.kiosk .kcard{ background:rgba(16,22,26,.85); border:1px solid var(--lw-line); border-radius:14px; padding:16px; }
.kiosk .kitem{ display:flex; flex-direction:column; gap:12px; padding:16px; border-radius:14px; border:1px solid var(--lw-line); background:rgba(16,22,26,.85); }
.kiosk .kitem .kt{ font-size:16px; line-height:1.45; color:var(--lw-ink); }
.kiosk .kbtns{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }
.kiosk .kbtns button{ height:52px; border-radius:12px; border:1.5px solid var(--lw-line); background:transparent; color:var(--lw-ink-2); font-size:15px; font-weight:700; display:inline-flex; align-items:center; justify-content:center; gap:8px; }
.kiosk .kbtns button.s[aria-pressed="true"]{ background:#4ADE80; border-color:#4ADE80; color:#06140c; }
.kiosk .kbtns button.n[aria-pressed="true"]{ background:#F87171; border-color:#F87171; color:#1d0707; }
.kiosk .kbtns button:hover{ border-color:#56666d; color:var(--lw-ink); }
.kiosk .input{ background:#0e1417; border-color:var(--lw-line); color:var(--lw-ink); }
.kiosk .label,.kiosk .hint{ color:var(--lw-ink-2); }
.kiosk .code{ background:rgba(255,255,255,.08); color:var(--lw-ink); }
.kiosk .badge{ background:rgba(255,255,255,.06); color:var(--lw-ink-2); }
.kiosk .btn-ghost{ color:var(--lw-ink); border-color:var(--lw-line); }
.kiosk .btn-ghost:hover{ background:rgba(255,255,255,.06); color:var(--lw-ink); }
.kiosk .btn-action{ background:var(--lw-spark); color:#061015; }
.kiosk .notice{ background:rgba(34,184,240,.08); border-color:rgba(34,184,240,.35); color:var(--lw-ink-2); }
.kiosk .notice .ic{ color:var(--lw-spark); }
.ic.s32{ width:32px; height:32px; }
.kiosk .ksteps{ list-style:none; display:flex; gap:6px; flex-wrap:wrap; margin:0; padding:0; }
.kiosk .ksteps li{ display:inline-flex; border-radius:999px; border:1px solid var(--lw-line); }
.kiosk .kstep{ display:inline-flex; align-items:center; gap:8px; padding:6px 12px 6px 6px; border:0; border-radius:999px; background:transparent; color:var(--lw-muted); font:inherit; font-size:13px; font-weight:600; cursor:pointer; }
.kiosk .kstep[disabled]{ cursor:default; }
.kiosk .kstep:not([disabled]):hover{ color:var(--lw-ink); }
.kiosk .ksteps li.on .kstep{ color:var(--lw-ink); }
.kiosk .kback{ display:inline-flex; align-items:center; gap:6px; color:var(--lw-spark); align-self:flex-start; font-weight:600; }
.kiosk .ksteps li i{ font-style:normal; width:22px; height:22px; border-radius:50%; display:grid; place-items:center; background:rgba(255,255,255,.06); font-size:12px; }
.kiosk .ksteps li.on{ color:var(--lw-ink); border-color:var(--lw-spark); }
.kiosk .ksteps li.on i{ background:var(--lw-spark); color:#061015; }
.kiosk .ksteps li.done i{ background:#4ADE80; color:#06140c; }
.kiosk .kpick{ text-align:left; color:var(--lw-ink); width:100%; cursor:pointer; transition:border-color .15s; }
.kiosk .kpick:hover:not([disabled]){ border-color:var(--lw-spark); }
.kiosk .kpick[disabled]{ opacity:.6; cursor:default; }
.kiosk .badge.ok{ background:rgba(74,222,128,.14); color:#4ADE80; }
.kiosk .badge.crit{ background:rgba(248,113,113,.14); color:#F87171; }
.kiosk .knum{ font-family:var(--mono); font-size:12px; color:var(--lw-muted); }
.kiosk .kitem.marcado{ border-color:#2b4a3a; }
.kiosk .kitem > .row > svg{ color:#4ADE80; }
.kiosk .kprog{ position:sticky; top:calc(-16px - env(safe-area-inset-top,0px)); z-index:2; background:rgba(11,15,17,.92); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); border:1px solid var(--lw-line); border-radius:12px; padding:12px 14px; display:flex; flex-direction:column; gap:8px; color:var(--lw-ink-2); }
.kiosk .kprog .progress{ background:rgba(255,255,255,.08); }
.kiosk .ksum{ display:grid; grid-template-columns:auto 1fr auto; gap:10px; align-items:center; padding:8px 0; border-top:1px solid var(--lw-line); color:var(--lw-ink); }
.kiosk .kdone{ text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px; padding:40px 0 10px; }
.kiosk .kdone-ic{ width:64px; height:64px; border-radius:50%; display:grid; place-items:center; background:rgba(74,222,128,.14); color:#4ADE80; }
.kiosk .check{ background:#0e1417; border-color:var(--lw-line); color:var(--lw-ink-2); }
.kiosk .btn-ghost[disabled], .kiosk .btn-action[disabled]{ opacity:.5; }

/* módulos online */
.modcard{ display:flex; flex-direction:column; gap:10px; }
.modcard .mh{ display:flex; justify-content:space-between; gap:10px; align-items:flex-start; }
.modcard.locked{ opacity:.62; }
.capsule{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:14px; }
.capsule .cn{ width:32px; height:32px; border-radius:10px; display:grid; place-items:center; background:var(--ice); color:var(--action); font-weight:700; font-size:14px; }
.capsule ul{ padding-left:18px; display:flex; flex-direction:column; gap:6px; color:var(--ink-2); }
.sim{ display:flex; flex-direction:column; gap:8px; }
.simrow{ display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:10px; align-items:center; padding:10px 12px; border-radius:12px; border:1px solid var(--line); background:var(--card); transition:transform .2s var(--ease), border-color .2s, background-color .2s; touch-action:none; }
.simrow .sp{ width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-size:12px; font-weight:700; background:var(--mist); color:var(--ink-2); }
.simrow.ok{ border-color:color-mix(in srgb, var(--ok) 45%, transparent); background:var(--ok-bg); }
.simrow.bad{ border-color:color-mix(in srgb, var(--crit) 45%, transparent); background:var(--crit-bg); }
.simrow.drag{ box-shadow:var(--shadow-float); z-index:3; position:relative; }
.simrow .mv{ display:flex; gap:4px; }
.q{ display:flex; flex-direction:column; gap:10px; }
.q .opts{ display:flex; flex-direction:column; gap:8px; }
.opt{ display:flex; gap:10px; align-items:flex-start; padding:11px 13px; border:1px solid var(--line); border-radius:12px; background:var(--card); text-align:left; width:100%; font-size:14px; line-height:1.45; color:var(--ink); transition:border-color .15s, background-color .15s; }
.opt:hover:not(:disabled){ border-color:var(--line-2); background:var(--mist); }
.opt .ol{ width:24px; height:24px; border-radius:50%; border:1.5px solid var(--line-2); display:grid; place-items:center; font-size:11.5px; font-weight:700; color:var(--muted); flex:none; }
.opt[aria-pressed="true"]{ border-color:var(--action); background:var(--ice); }
.opt[aria-pressed="true"] .ol{ background:var(--action); border-color:var(--action); color:var(--on-action); }
.opt.right{ border-color:color-mix(in srgb, var(--ok) 55%, transparent); background:var(--ok-bg); }
.opt.right .ol{ background:var(--ok); border-color:var(--ok); color:var(--on-status); }
.opt.wrong{ border-color:color-mix(in srgb, var(--crit) 55%, transparent); background:var(--crit-bg); }
.opt.wrong .ol{ background:var(--crit); border-color:var(--crit); color:var(--on-status); }
.opt:disabled{ cursor:default; }
.stepper{ display:flex; gap:6px; align-items:center; flex-wrap:wrap; }
.stepper .sd{ display:flex; align-items:center; gap:8px; font-size:13px; font-weight:600; color:var(--muted); }
.stepper .sd i{ width:26px; height:26px; border-radius:50%; display:grid; place-items:center; font-style:normal; font-size:12px; border:1.5px solid var(--line-2); }
.stepper .sd.on{ color:var(--ink); }
.stepper .sd.on i{ border-color:var(--action); color:var(--action); background:var(--ice); }
.stepper .sd.done i{ background:var(--owner); border-color:var(--owner); color:var(--on-owner); }
.stepper .sl{ width:24px; height:2px; background:var(--line-2); }

/* seguridad: 20 controles */
.secgrid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:10px; }
@media (max-width:900px){ .secgrid{ grid-template-columns:minmax(0,1fr); } }
.secitem{ display:grid; grid-template-columns:auto minmax(0,1fr); gap:12px; padding:14px; border:1px solid var(--line); border-radius:12px; background:var(--card); }
.secitem .sn{ width:30px; height:30px; border-radius:9px; display:grid; place-items:center; font-weight:700; font-size:13px; background:var(--mist); color:var(--ink-2); font-variant-numeric:tabular-nums; }
.secitem.ok .sn{ background:var(--ok-bg); color:var(--ok); }
.secitem.plat .sn{ background:var(--ice); color:var(--action); }
.secitem.na .sn{ background:var(--mist); color:var(--muted); }
.secitem.pend .sn{ background:var(--warn-bg); color:var(--warn); }
.secitem .st{ display:flex; justify-content:space-between; gap:8px; align-items:flex-start; flex-wrap:wrap; }
.secitem p{ font-size:13.5px; color:var(--ink-2); margin-top:6px; line-height:1.5; }

/* diccionario */
.dmatrix td,.dmatrix th{ text-align:center; }
.dmatrix td:first-child,.dmatrix th:first-child{ text-align:left; }
.clist{ display:flex; flex-direction:column; gap:8px; }
.citem{ display:grid; grid-template-columns:auto minmax(0,1fr) auto; gap:12px; align-items:center; padding:12px 14px; border:1px solid var(--line); border-radius:12px; background:var(--card); width:100%; text-align:left; color:inherit; font:inherit; }
.citem:hover{ border-color:var(--line-2); }
.citem .cb{ display:flex; gap:6px; flex-wrap:wrap; justify-content:flex-end; }
@media (max-width:719px){ .citem{ grid-template-columns:auto minmax(0,1fr); } .citem .cb{ grid-column:2; justify-content:flex-start; } }
.filters{ display:flex; gap:8px; flex-wrap:wrap; align-items:center; margin-bottom:16px; }
.filters .input{ max-width:280px; min-height:36px; padding:7px 12px; border-radius:99px; }
.filters .select{ width:auto; min-height:36px; padding:6px 32px 6px 12px; border-radius:99px; font-size:13.5px; background-position:calc(100% - 17px) 15px, calc(100% - 12px) 15px; }
@media (max-width:560px){ .filters .input{ max-width:none; flex:1 1 100%; } }
.searchbox{ position:relative; flex:1 1 220px; max-width:320px; }
.searchbox .ic{ position:absolute; left:12px; top:50%; transform:translateY(-50%); color:var(--muted); width:16px; height:16px; pointer-events:none; }
.searchbox .input{ padding-left:36px; max-width:none; }
@media (max-width:560px){ .searchbox{ max-width:none; flex-basis:100%; } }

/* barra de tabla/vista */
.viewtoggle{ display:flex; justify-content:flex-end; margin-top:-4px; }
details.disc{ border:1px solid var(--line); border-radius:12px; background:var(--card); }
details.disc>summary{ list-style:none; cursor:pointer; padding:14px 16px; display:flex; align-items:center; justify-content:space-between; gap:12px; font-weight:600; }
details.disc>summary::-webkit-details-marker{ display:none; }
details.disc>summary .ic{ transition:transform .2s; color:var(--muted); }
details.disc[open]>summary .ic{ transform:rotate(180deg); }
details.disc>.dbody{ padding:0 16px 16px; }
ol.rules{ list-style:none; counter-reset:r; display:flex; flex-direction:column; gap:10px; }
ol.rules li{ counter-increment:r; display:grid; grid-template-columns:28px minmax(0,1fr); gap:10px; font-size:14px; color:var(--ink-2); line-height:1.5; }
ol.rules li::before{ content:counter(r); width:24px; height:24px; border-radius:50%; background:var(--mist); display:grid; place-items:center; font-size:12px; font-weight:700; color:var(--ink); }
ol.rules li b{ color:var(--ink); }

/* responsive auxiliares */
.only-mob{ display:none; }
@media (max-width:719px){ .only-desk{ display:none!important; } .only-mob{ display:flex; } }
@media (max-width:1023px){ #panel-cols{ grid-template-columns:minmax(0,1fr)!important; } }
.lsec .card.step{ --pad:20px; }
.badge{ max-width:100%; }
.duo .badge,.alert .badge,.secitem .badge{ white-space:normal; height:auto; min-height:24px; padding-block:3px; line-height:1.3; }
a.card,a.card:hover{ color:inherit; text-decoration:none; }
@media (max-width:1320px){ .navlinks a .ic{ display:none; } .topnav .brand-sub{ display:none; } .rolechip{ max-width:190px; } .rolechip .rl span{ max-width:110px; } }
.track .tl{ display:flex; flex-direction:column; align-items:center; line-height:1.25; }
.track .td{ font-weight:500; color:var(--muted); font-size:10.5px; }
.track .tn{ width:56px; }
@media (max-width:560px){ .track .td{ display:none; } .track .tn{ width:40px; } }

/* ============ MÓDULO: pasos, práctica de a una y navegación entre módulos ============ */
.modsteps{ display:flex; gap:6px; flex-wrap:wrap; margin:0 0 20px; padding:4px; border:1px solid var(--line); border-radius:999px; background:var(--mist); width:fit-content; max-width:100%; }
.modstep{ display:inline-flex; align-items:center; gap:7px; padding:8px 14px 8px 8px; border-radius:999px; border:0; background:transparent; color:var(--ink-2); font-weight:600; font-size:14px; cursor:pointer; }
.modstep i{ font-style:normal; width:22px; height:22px; border-radius:50%; display:grid; place-items:center; background:var(--card); border:1px solid var(--line-2); font-size:12px; }
.modstep.on{ background:var(--card); color:var(--ink); box-shadow:0 1px 2px rgba(0,0,0,.08); }
.modstep.on i{ background:var(--action); border-color:var(--action); color:var(--on-action); }
.modnav{ display:grid; grid-template-columns:1fr 1fr; gap:12px; margin-top:28px; padding-top:18px; border-top:1px solid var(--line); }
.modnav-a{ display:flex; align-items:center; gap:10px; padding:12px 14px; border:1px solid var(--line); border-radius:14px; text-decoration:none; color:var(--ink); background:var(--card); font-weight:600; font-size:14px; transition:border-color .15s; }
.modnav-a:hover{ border-color:var(--action); }
.modnav-a small{ display:block; font-weight:500; font-size:12px; color:var(--muted); }
.modnav-a.next{ justify-content:flex-end; text-align:right; grid-column:2; }
.prac .pdots{ display:flex; gap:6px; flex-wrap:wrap; }
.pdot{ width:32px; height:32px; border-radius:50%; border:1.5px solid var(--line-2); background:var(--card); color:var(--muted); font-size:13px; font-weight:700; cursor:pointer; }
.pdot.done{ background:var(--ice); border-color:var(--action); color:var(--action); }
.pdot.on{ background:var(--action); border-color:var(--action); color:var(--on-action); }
.opt[aria-checked="true"]{ border-color:var(--action); background:var(--ice); }
.prevq{ border:1px solid var(--line); border-radius:12px; padding:12px 14px; display:flex; flex-direction:column; gap:6px; }
.prevq.ok{ border-color:color-mix(in srgb, var(--ok) 40%, var(--line)); }
.prevq.bad{ border-color:color-mix(in srgb, var(--crit) 45%, var(--line)); background:var(--crit-bg); }
.prevq .pn{ width:22px; height:22px; border-radius:50%; display:grid; place-items:center; background:var(--ok-bg); color:var(--ok); }
.prevq.bad .pn{ background:var(--card); color:var(--crit); }
@media (max-width:600px){ .modnav{ grid-template-columns:1fr; } .modnav-a.next{ grid-column:1; }
  .modsteps{ display:grid; grid-auto-flow:column; grid-auto-columns:minmax(0,1fr); width:100%; border-radius:14px; }
  .modstep{ flex-direction:column; justify-content:center; gap:4px; padding:8px 4px; font-size:12px; border-radius:10px; text-align:center; line-height:1.2; }
  .modstep .ic{ display:none; } }

/* ============ ENTRADA, EDITOR DE CONTENIDO Y CALCULADORA ============ */
.entry-card{ min-height:220px; }
.entry-ic{ width:40px; height:40px; border-radius:12px; display:grid; place-items:center; background:var(--ice); color:var(--action); }
.steps-ol{ padding-left:20px; display:flex; flex-direction:column; gap:8px; font-size:14px; color:var(--ink-2); }
.edit-card{ background:var(--mist); }
.opt-edit{ display:grid; grid-template-columns:auto auto minmax(0,1fr); gap:8px; align-items:center; }
.opt-edit .ol{ width:24px; height:24px; border-radius:50%; border:1.5px solid var(--line-2); display:grid; place-items:center; font-size:11.5px; font-weight:700; color:var(--muted); }
.opt-edit input[type=radio]:checked + .ol{ background:var(--ok); border-color:var(--ok); color:var(--on-status); }
details.calc{ border:1px solid var(--line); border-radius:12px; padding:12px 14px; background:var(--mist); }
details.calc summary{ cursor:pointer; font-weight:600; font-size:14px; display:flex; align-items:center; gap:8px; }
.progress.warn i{ background:var(--warn); }

/* ============ Lumine Habilita · capa de experiencia ============
   Ambiente (grilla de plano + foco), tipografía de exhibición,
   precarga, apariciones, inclinación, cursor, franja, laboratorio 3D,
   taller y postulación por pantallas. */

[hidden]{ display:none!important; }

/* ---------- ambiente ---------- */
body::before{
  content:""; position:fixed; inset:0; z-index:-1; pointer-events:none;
  background:
    radial-gradient(1100px 520px at 50% -140px, var(--amb-a), transparent 70%),
    radial-gradient(700px 400px at 100% 0%, var(--amb-b), transparent 70%),
    linear-gradient(var(--gridline) 1px, transparent 1px) 0 0/56px 56px,
    linear-gradient(90deg, var(--gridline) 1px, transparent 1px) 0 0/56px 56px;
  -webkit-mask:linear-gradient(#000 0, #000 55%, rgba(0,0,0,.35) 100%);
  mask:linear-gradient(#000 0, #000 55%, rgba(0,0,0,.35) 100%);
}
/* en pantallas táctiles la capa fija es solo el foco de luz: sin máscara ni grilla que repintar al hacer scroll */
@media (hover:none), (pointer:coarse){
  body::before{ background:radial-gradient(900px 420px at 50% -120px, var(--amb-a), transparent 70%); -webkit-mask:none; mask:none; }
}
.card{ box-shadow:var(--glass); }
.card.lift{ box-shadow:var(--glass), var(--shadow-cta); }

/* tipografía de exhibición (Archivo ancho, mayúsculas industriales) */
.display,.mega,.h1.xl,.onb-h,.lab-big,.fin-s b,.rv-n{ font-family:var(--display); }
.h1.xl{ font-size:clamp(30px,4vw,48px); line-height:1.02; letter-spacing:-.02em; font-weight:800; font-stretch:112%; text-transform:uppercase; }
.mega{ font-size:clamp(44px,7.2vw,96px); line-height:.9; font-weight:850; letter-spacing:-.035em; font-stretch:118%; text-transform:uppercase; display:flex; flex-direction:column; }
.mega .mg-l{ display:block; }
.mega .sp{ color:var(--action); text-shadow:0 0 42px color-mix(in srgb, var(--action) 45%, transparent); }
:root[data-lh="light"] .mega .sp{ text-shadow:none; }

/* ---------- precarga ---------- */
.pre{ position:fixed; inset:0; z-index:500; display:grid; place-items:center; background:var(--paper); color:var(--ink); pointer-events:none;
  animation:preAuto .35s ease 1.4s forwards; }
.pre-in{ display:flex; flex-direction:column; align-items:center; gap:14px; }
.pre-em{ width:46px; height:46px; color:var(--spark); }
.pre-wm{ height:22px; }
.pre-cap{ font-size:11px; letter-spacing:.24em; text-transform:uppercase; color:var(--muted); }
.pre-bar{ width:160px; height:2px; background:var(--line); border-radius:2px; overflow:hidden; }
.pre-bar i{ display:block; height:100%; width:100%; background:var(--action); transform:scaleX(0); transform-origin:left; }
.pre.run .pre-bar i{ animation:preBar .72s var(--ease) forwards; }
.pre.run .pre-em{ animation:preEm .7s var(--ease) both; }
.pre.out{ animation:preOut .34s ease forwards; }
@keyframes preBar{ to{ transform:scaleX(1); } }
@keyframes preEm{ from{ opacity:0; transform:scale(.7) rotate(-20deg); } to{ opacity:1; transform:none; } }
@keyframes preOut{ to{ opacity:0; visibility:hidden; } }
@keyframes preAuto{ to{ opacity:0; visibility:hidden; } }

/* columna fija de la pauta: solo cuando hay dos columnas (en teléfono se superponía al hacer scroll) */
@media (min-width:720px){ .pauta-l{ position:sticky; top:96px; } }

/* ---------- apariciones ---------- */
[data-rv].rv-in{ animation:rvIn .7s var(--ease) both; animation-delay:var(--rv-d, 0ms); }
@keyframes rvIn{ from{ opacity:0; transform:translateY(18px); } to{ opacity:1; transform:none; } }
[data-stagger].rv-in [data-st]{ animation:stIn .5s var(--ease) both; animation-delay:calc(var(--st-d, 0ms) + 200ms); }
@keyframes stIn{ from{ opacity:0; transform:scale(.4); } to{ opacity:1; transform:none; } }

/* ---------- inclinación ---------- */
[data-tilt-on]{ position:relative; transform:perspective(900px) rotateX(var(--rx,0deg)) rotateY(var(--ry,0deg)); transition:transform .5s var(--ease), border-color .2s, box-shadow .3s; transform-style:preserve-3d; }
[data-tilt-on].tilting{ transition:transform .08s linear, border-color .2s, box-shadow .3s; }
[data-tilt-on]::after{ content:""; position:absolute; inset:0; border-radius:inherit; pointer-events:none; opacity:0; transition:opacity .3s;
  background:radial-gradient(420px circle at var(--mx,50%) var(--my,50%), color-mix(in srgb, var(--action) 14%, transparent), transparent 60%); }
[data-tilt-on].tilting::after{ opacity:1; }
[data-mag]{ display:inline-flex; transition:transform .35s var(--ease); }
[data-mag-on]:hover{ transition:transform .12s linear; }

/* ---------- barra de lectura y cursor ---------- */
.scrollbar-fx{ position:fixed; left:0; right:0; top:0; height:2px; z-index:300; pointer-events:none; transform-origin:left; transform:scaleX(0);
  background:linear-gradient(90deg, transparent, var(--action) 40%, var(--action)); box-shadow:0 0 12px var(--action); }
.cursor-fx{ display:none; }
body.fx-cursor .cursor-fx{ display:block; position:fixed; left:-16px; top:-16px; width:32px; height:32px; border-radius:50%; z-index:400; pointer-events:none;
  border:1.5px solid color-mix(in srgb, var(--action) 70%, transparent); transition:width .25s var(--ease), height .25s var(--ease), left .25s var(--ease), top .25s var(--ease), background .25s, border-color .25s, opacity .3s; opacity:0; }
body.fx-cursor .cursor-fx.vis{ opacity:1; }
body.fx-cursor .cursor-fx.on{ width:52px; height:52px; left:-26px; top:-26px; background:color-mix(in srgb, var(--action) 10%, transparent); }
body.fx-cursor .cursor-fx.drag{ width:64px; height:64px; left:-32px; top:-32px; border-style:dashed; }
body.fx-cursor .cursor-fx.down{ width:24px; height:24px; left:-12px; top:-12px; }

/* ---------- franja en movimiento ---------- */
.mq{ position:relative; overflow:hidden; border-block:1px solid var(--line); padding-block:16px; margin-top:8px;
  -webkit-mask:linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); mask:linear-gradient(90deg, transparent, #000 8%, #000 92%, transparent); }
.mq-track{ display:flex; width:max-content; animation:mq 48s linear infinite; }
.mq:hover .mq-track{ animation-play-state:paused; }
.mq-row{ display:flex; gap:34px; padding-right:34px; }
.mq-i{ display:inline-flex; align-items:center; gap:14px; font-family:var(--display); font-weight:700; font-stretch:115%; font-size:clamp(16px,1.6vw,22px); letter-spacing:.02em; text-transform:uppercase; color:var(--ink-2); white-space:nowrap; }
.mq-dot{ width:7px; height:7px; border-radius:2px; background:var(--action); transform:rotate(45deg); box-shadow:0 0 10px var(--action); }
@keyframes mq{ to{ transform:translateX(-50%); } }
@media (prefers-reduced-motion: reduce){ .mq-track{ animation:none; width:auto; } .mq-row{ flex-wrap:wrap; justify-content:center; padding:0 var(--gutter); } .mq-row + .mq-row{ display:none; } }

/* ---------- portada ---------- */
.hero2{ grid-template-columns:minmax(0,1fr) minmax(0,1.08fr); gap:40px; padding-block:48px 36px; }
.hero2 .lead{ max-width:52ch; }
.hero-vis{ position:relative; min-width:0; }
.hero-frame{ aspect-ratio:1/1; max-height:600px; }
.hero-frame .lab-stage{ aspect-ratio:auto; height:100%; min-height:0; }
.float-ui{ position:absolute; z-index:3; display:flex; flex-direction:column; gap:3px; padding:12px 14px; border-radius:14px; min-width:150px; max-width:230px;
  background:color-mix(in srgb, var(--card-solid) 70%, transparent); border:1px solid var(--line-2); box-shadow:var(--glass), var(--shadow-float);
  -webkit-backdrop-filter:blur(14px) saturate(1.4); backdrop-filter:blur(14px) saturate(1.4); transform:translateY(var(--py,0px)); pointer-events:none; }
.float-ui small{ font-size:10.5px; letter-spacing:.2em; text-transform:uppercase; color:var(--action); font-weight:600; }
.float-ui b{ font-family:var(--display); font-size:17px; font-stretch:110%; letter-spacing:-.01em; }
.float-ui span{ font-size:12px; color:var(--ink-2); }
.float-ui.f1{ top:7%; left:-4%; }
.float-ui.f2{ top:38%; right:-3%; }
.float-ui.f3{ bottom:9%; left:4%; }
.f-yn{ display:flex; gap:6px; margin-top:4px; }
.f-yn i{ font-style:normal; display:inline-flex; align-items:center; gap:4px; font-size:11.5px; height:24px; padding:0 9px; border-radius:99px; border:1px solid var(--line-2); color:var(--ink-2); }
.f-yn i.s{ background:var(--ok-bg); color:var(--ok); border-color:color-mix(in srgb, var(--ok) 40%, transparent); }
.f-lv{ display:flex; gap:3px; margin-top:6px; align-items:flex-end; height:30px; }
.f-lv i{ font-style:normal; font-size:9.5px; font-family:var(--mono); color:var(--on-action); background:var(--action); border-radius:4px 4px 2px 2px; flex:var(--w) 1 0; min-width:18px; display:grid; place-items:center; height:calc(10px + var(--w) * .8px); opacity:.92; }
.hero-3d{ position:absolute; z-index:3; right:14px; bottom:14px; display:inline-flex; align-items:center; gap:8px; height:36px; padding:0 14px; border-radius:99px; font-size:13px; font-weight:600; text-decoration:none;
  color:var(--ink); background:color-mix(in srgb, var(--card-solid) 72%, transparent); border:1px solid var(--line-2); -webkit-backdrop-filter:blur(10px); backdrop-filter:blur(10px); }
.hero-3d:hover{ color:var(--ink); border-color:var(--action); }
.hero-3d .ic{ color:var(--action); }
@media (max-width:1023px){ .hero2{ grid-template-columns:minmax(0,1fr); } .hero-frame{ aspect-ratio:4/3; max-height:none; } .float-ui.f1{ left:10px; } .float-ui.f2{ right:10px; } }
@media (max-width:560px){ .hero-frame{ aspect-ratio:1/1.05; } .float-ui{ min-width:0; max-width:170px; padding:9px 11px; } .float-ui b{ font-size:14px; } .float-ui.f2{ top:auto; bottom:64px; right:10px; } .float-ui.f3{ display:none; } }

.plan2 [data-tilt-on]{ border-radius:var(--r-lg); }

/* aprender con las manos */
.xp-grid{ display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:18px; }
.xp-card{ display:flex; flex-direction:column; border-radius:var(--r-lg); border:1px solid var(--line); background:var(--card); box-shadow:var(--glass); overflow:hidden; text-decoration:none; color:inherit; }
.xp-card:hover{ color:inherit; border-color:var(--ice-line); box-shadow:var(--glass), var(--shadow-float); }
.xp-art{ position:relative; height:200px; border-bottom:1px solid var(--line); overflow:hidden;
  background:radial-gradient(500px 220px at 50% 120%, color-mix(in srgb, var(--action) 22%, transparent), transparent 70%), linear-gradient(var(--gridline) 1px, transparent 1px) 0 0/28px 28px, linear-gradient(90deg, var(--gridline) 1px, transparent 1px) 0 0/28px 28px, var(--wash); }
.xp-t{ display:flex; flex-direction:column; gap:10px; padding:22px; }
.xp-t .h2{ font-family:var(--display); font-stretch:110%; text-transform:uppercase; letter-spacing:-.015em; font-size:clamp(22px,2.4vw,30px); line-height:1.05; }
.xp-k{ display:inline-flex; align-items:center; gap:8px; font-size:12px; font-weight:600; letter-spacing:.18em; text-transform:uppercase; color:var(--action); }
.xp-go{ display:inline-flex; align-items:center; gap:8px; font-weight:600; font-size:14px; color:var(--action); margin-top:4px; }
.xp-card:hover .xp-go .ic{ transform:translateX(4px); }
.xp-go .ic{ transition:transform .25s var(--ease); }
.xp-nodes{ position:absolute; inset:0; }
.xp-node{ position:absolute; display:inline-flex; align-items:center; gap:8px; font-size:12px; font-weight:600; color:var(--ink); max-width:46%; line-height:1.2;
  animation:float 6s ease-in-out infinite; animation-delay:calc(var(--i) * -1.1s); }
.xp-node i{ width:12px; height:12px; border-radius:50%; background:var(--action); box-shadow:0 0 0 5px color-mix(in srgb, var(--action) 22%, transparent), 0 0 18px var(--action); flex:none; }
.xp-mini{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; }
.xp-mini span{ position:absolute; width:128px; padding:12px; border-radius:12px; display:flex; flex-direction:column; gap:4px; font-size:12.5px; font-weight:600; line-height:1.3;
  background:var(--card-solid); border:1px solid var(--line-2); box-shadow:var(--shadow-float);
  transform:translateX(calc((var(--i) - 1.5) * 96px)) rotate(calc((var(--i) - 1.5) * 7deg)) translateY(calc(var(--i) * var(--i) * 3px - 6px)); transition:transform .5s var(--ease); }
.xp-mini span b{ font-size:11px; color:var(--action); font-weight:500; }
.xp-card:hover .xp-mini span{ transform:translateX(calc((var(--i) - 1.5) * 112px)) rotate(calc((var(--i) - 1.5) * 9deg)) translateY(calc(var(--i) * var(--i) * 2px - 14px)); }
@keyframes float{ 0%,100%{ transform:translateY(0); } 50%{ transform:translateY(-8px); } }
@media (max-width:860px){ .xp-grid{ grid-template-columns:minmax(0,1fr); } }
@media (max-width:480px){ .xp-mini span{ width:104px; font-size:11.5px; transform:translateX(calc((var(--i) - 1.5) * 66px)) rotate(calc((var(--i) - 1.5) * 7deg)); } .xp-node{ font-size:11px; } }

/* ---------- laboratorio 3D ---------- */
.lab-frame{ position:relative; border-radius:var(--r-lg); overflow:hidden; border:1px solid var(--line);
  background:radial-gradient(70% 60% at 50% 38%, color-mix(in srgb, var(--action) 14%, transparent), transparent 70%), radial-gradient(120% 90% at 50% 120%, rgba(0,0,0,.35), transparent 60%), var(--wash);
  box-shadow:var(--glass), var(--shadow-cta); }
:root[data-lh="light"] .lab-frame{ background:radial-gradient(70% 60% at 50% 38%, rgba(18,170,233,.10), transparent 70%), linear-gradient(#f6f8f9, #e7ecee); }
.lab-stage{ position:relative; width:100%; aspect-ratio:16/10.5; min-height:320px; }
.lab-canvas{ position:absolute; inset:0; width:100%; height:100%; display:block; touch-action:pan-y; cursor:grab; outline:none; }
.lab-canvas:active{ cursor:grabbing; }
.lab-canvas:focus-visible{ box-shadow:inset 0 0 0 2px var(--action); }
.lab-hots{ position:absolute; inset:0; pointer-events:none; }
.lab-hot{ position:absolute; left:0; top:0; pointer-events:auto; display:flex; align-items:center; gap:8px; padding:0; border:0; background:none; color:var(--ink); font:inherit; transition:opacity .3s; }
.lab-hot .lh-dot{ width:18px; height:18px; margin:-9px 0 0 -9px; border-radius:50%; background:var(--action); border:3px solid color-mix(in srgb, var(--paper) 70%, transparent); flex:none;
  box-shadow:0 0 0 0 color-mix(in srgb, var(--action) 50%, transparent); animation:hotPulse 2.4s ease-out infinite; }
.lab-hot .lh-l{ margin-top:-9px; height:26px; padding:0 10px; border-radius:99px; display:inline-flex; align-items:center; font-size:12px; font-weight:600; white-space:nowrap;
  background:color-mix(in srgb, var(--card-solid) 78%, transparent); border:1px solid var(--line-2); -webkit-backdrop-filter:blur(8px); backdrop-filter:blur(8px); opacity:0; transform:translateX(-4px); transition:opacity .2s, transform .2s; }
.lab-hot:hover .lh-l,.lab-hot:focus-visible .lh-l,.lab-hot.on .lh-l{ opacity:1; transform:none; }
.lab-hot.on .lh-dot{ background:var(--ink); border-color:var(--action); }
.lab-hot.lejos{ opacity:.45; }
.lab-hot:focus-visible{ outline:none; }
.lab-hot:focus-visible .lh-dot{ box-shadow:0 0 0 3px var(--ring); }
.lab-stage.quiz .lh-l{ display:none; }
.lab-stage.quiz .lab-hot .lh-dot{ background:var(--ink-2); }
.lab-stage.nope{ animation:nope .4s; }
@keyframes nope{ 20%{ transform:translateX(-6px); } 40%{ transform:translateX(6px); } 60%{ transform:translateX(-3px); } 80%{ transform:translateX(3px); } }
@keyframes hotPulse{ 0%{ box-shadow:0 0 0 0 color-mix(in srgb, var(--action) 55%, transparent); } 70%,100%{ box-shadow:0 0 0 12px transparent; } }
@media (hover:none){ .lab-hot .lh-l{ opacity:.92; transform:none; } }
