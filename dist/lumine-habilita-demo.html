/* =====================================================================
   Lumine Habilita · reglas del sistema (funciones puras, sin DOM)
   ===================================================================== */
'use strict';

/* ---------- fechas (siempre locales, formato AAAA-MM-DD) ---------- */
const pad2 = n => String(n).padStart(2, '0');
function isoDate(d){ return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
function hoyISO(){ return isoDate(new Date()); }
/* Fecha ISO estricta: rechaza fechas que JavaScript normalizaría (2026-02-31 no pasa a marzo). */
function parseISO(s){
  if(!s || typeof s !== 'string') return null;
  const m = /^(\d{4})-(\d{2})-(\d{2})/.exec(s); if(!m) return null;
  const y = +m[1], mo = +m[2], d = +m[3];
  if(mo < 1 || mo > 12 || d < 1 || d > 31) return null;
  const dt = new Date(y, mo - 1, d);
  return (dt.getFullYear() === y && dt.getMonth() === mo - 1 && dt.getDate() === d) ? dt : null;
}
function fechaValida(s){ return typeof s === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s) && !!parseISO(s); }
function addDays(s, n){ const d = parseISO(s); if(!d) return null; d.setDate(d.getDate() + n); return isoDate(d); }
function addMonths(s, n){ const d = parseISO(s); if(!d) return null; const day = d.getDate(); d.setDate(1); d.setMonth(d.getMonth() + n); const last = new Date(d.getFullYear(), d.getMonth()+1, 0).getDate(); d.setDate(Math.min(day, last)); return isoDate(d); }
function diffDays(a, b){ const A = parseISO(a), B = parseISO(b); if(!A || !B) return null; return Math.round((B - A) / 86400000); }
function monthsBetween(a, b){ const A = parseISO(a), B = parseISO(b); if(!A || !B) return null; let m = (B.getFullYear()-A.getFullYear())*12 + (B.getMonth()-A.getMonth()); if(B.getDate() < A.getDate()) m -= 1; return m; }

/* ---------- identificadores seguros para rutas de la base ---------- */
const ID_RE = /^[A-Za-z0-9_-]{1,64}$/;
function validId(s){ return typeof s === 'string' && ID_RE.test(s); }
function nid(prefix){
  const a = new Uint8Array(9);
  globalThis.crypto.getRandomValues(a);
  let s = ''; for(const b of a) s += (b % 36).toString(36);
  return (prefix ? prefix + '_' : '') + Date.now().toString(36) + s;
}

/* ---------- utilidades ---------- */
const uniq = arr => Array.from(new Set(arr));
const byCode = (a, b) => (a < b ? -1 : a > b ? 1 : 0);
function sortCodes(arr){ return uniq(arr).sort(byCode); }
function reqComp(total, umbral){ return total <= 0 ? 0 : Math.ceil(total * (umbral / 100) - 1e-9); }
function clamp(n, a, b){ return Math.min(b, Math.max(a, n)); }

/* ---------- diagnóstico ---------- */
function mapaPreliminar(ant){
  if(!ant) return [];
  const out = [];
  const pf = PERFILES[ant.perfil]; if(pf) out.push(...pf.marca);
  const certs = ant.certificados || {};
  for(const c of CERTIFICADOS) if(certs[c.id]) out.push(...c.marca);
  const exps = ant.experiencias || {};
  for(const e of EXPERIENCIAS) if(exps[e.c]) out.push(e.c);
  return sortCodes(out.filter(c => ESTACIONES.includes(c)));
}
function puntajeFundamentos(resp){
  const out = { electrica:{ok:0,total:0}, mecanica:{ok:0,total:0}, electronica:{ok:0,total:0} };
  if(!resp) return out;
  for(const q of FUNDAMENTOS){
    out[q.area].total++;
    if(resp[q.id] === q.a) out[q.area].ok++;
  }
  return out;
}
/* Solo agrega: un área queda para nivelación si no alcanza el umbral. */
function nivelacionPorFundamentos(fund, umbral){
  if(!fund || !fund.respuestas) return [];
  const p = puntajeFundamentos(fund.respuestas);
  return Object.keys(p).filter(a => p[a].ok < umbral);
}
function nivelacionPorJornada(jornada){
  if(!jornada || !jornada.basico) return [];
  return Object.keys(jornada.basico).filter(a => jornada.basico[a] === 'nivelar');
}
function nivelacionFinal(persona, params){
  const u = (params && params.umbralFund) || PARAMS_DEF.umbralFund;
  const areas = uniq([...nivelacionPorFundamentos(persona.fundamentos, u), ...nivelacionPorJornada(persona.jornada)]);
  return ['electrica','mecanica','electronica'].filter(a => areas.includes(a)).map(a => AREA_NIV[a]);
}
function saltadas(persona){
  const est = (persona.jornada && persona.jornada.estaciones) || {};
  return sortCodes(Object.keys(est).filter(c => est[c] === 's' && C[c] && C[c].p === 'oficio'));
}
function estadoDiagnostico(persona){
  return {
    antecedentes: !!persona.antecedentes,
    fundamentos: !!(persona.fundamentos && persona.fundamentos.fecha),
    jornada: !!(persona.jornada && persona.jornada.fecha),
    plan: !!(persona.jornada && persona.jornada.fecha)
  };
}

/* ---------- plan personal ----------
   nivelación + core completo + oficio no demostrado + desarrollo por nivel + refuerzo */
function refuerzo(persona){
  const p = persona.pauta || {};
  return sortCodes(Object.keys(p).filter(c => p[c] && p[c].r === 'n'));
}
function moduloAplica(m, cursarSet, nivelacion){
  if(m.nivel === 0) return nivelacion.includes(m.id);
  return m.cod.some(c => cursarSet.has(c));
}
function planPersonal(persona, params){
  const skip = saltadas(persona);
  const skipSet = new Set(skip);
  const core = COMP.filter(x => x.p === 'core').map(x => x.c);
  const oficio = COMP.filter(x => x.p === 'oficio' && !skipSet.has(x.c)).map(x => x.c);
  const desarrollo = COMP.filter(x => x.p === 'desarrollo').map(x => x.c);
  const cursar = [...core, ...oficio, ...desarrollo];
  const cursarSet = new Set(cursar);
  const nivelacion = nivelacionFinal(persona, params);
  const porNivel = {};
  for(const n of [1,2,3,4]) porNivel[n] = {
    cursar: COMP.filter(x => x.n === n && cursarSet.has(x.c)).map(x => x.c),
    saltadas: COMP.filter(x => x.n === n && skipSet.has(x.c)).map(x => x.c)
  };
  const modulos = MODULOS.filter(m => moduloAplica(m, cursarSet, nivelacion)).map(m => m.id);
  const hm = (params && params.horasModulo) || {};
  let horas = 0, faltanHoras = [];
  for(const id of modulos){ const h = Number(hm[id]); if(hm[id] === null || hm[id] === undefined || hm[id] === '' || !isFinite(h)) faltanHoras.push(id); else horas += h; }
  return {
    nivelacion, saltadas: skip, core, oficio, desarrollo, cursar, total: cursar.length,
    refuerzo: refuerzo(persona), porNivel, modulos,
    horas: faltanHoras.length ? null : horas, faltanHoras
  };
}

/* ---------- validaciones ---------- */
function evaluadorDe(code){
  if(code === 'C25' || code === 'C26') return 'ic';
  return C[code] && C[code].v === 'ext' ? 'ext' : 'int';
}
/* Ítems que entran a una validación. En un segundo intento solo entra lo que no está aprobado (regla de avance 1). */
function itemsValidacion(tipo, persona){
  const pauta = persona.pauta || {};
  if(tipo === 'REV'){
    return CORE_SEG.filter(c => C[c].n <= Math.max(1, persona.nivel || 0));
  }
  const n = Number(tipo.slice(1));
  if(!(n >= 1 && n <= 4)) return [];
  const skip = new Set(saltadas(persona));
  return COMP.filter(x => x.n === n && !skip.has(x.c) && !(pauta[x.c] && (pauta[x.c].r === 's' || pauta[x.c].r === 'j'))).map(x => x.c);
}
function preaprobadas(tipo, persona){
  if(!/^N[1-4]$/.test(tipo)) return [];
  const n = Number(tipo.slice(1));
  const pauta = persona.pauta || {};
  return COMP.filter(x => x.n === n && pauta[x.c] && (pauta[x.c].r === 's' || pauta[x.c].r === 'j')).map(x => x.c);
}
/* items: [{c, r}] donde r es 's' | 'n' | null. Se evalúa sobre el nivel completo (incluye lo ya aprobado). */
function evaluar(items, umbral){
  const u = umbral || PARAMS_DEF.umbralComp;
  let completo = true;
  const crit = { total:0, ok:0 }, comp = { total:0, ok:0 };
  const fallCrit = [], fallComp = [];
  for(const it of items){
    const k = C[it.c] ? C[it.c].k : 'seg';
    const r = it.r;
    if(r !== 's' && r !== 'n' && r !== 'j') completo = false;
    const ok = r === 's' || r === 'j';
    if(k === 'comp'){ comp.total++; if(ok) comp.ok++; else if(r === 'n') fallComp.push(it.c); }
    else { crit.total++; if(ok) crit.ok++; else if(r === 'n') fallCrit.push(it.c); }
  }
  comp.req = reqComp(comp.total, u);
  const aprobado = completo && fallCrit.length === 0 && comp.ok >= comp.req;
  return { completo, crit, comp, fallidas: sortCodes([...fallCrit, ...fallComp]), fallCrit, fallComp, aprobado };
}
/* Exigencia real del 85% en cada validación: con pocas complementarias equivale a 100%. */
function exigenciaEfectiva(umbral){
  return [1,2,3,4].map(n => {
    const tot = COMP.filter(x => x.n === n && x.k === 'comp').length;
    const req = reqComp(tot, umbral);
    return { n, total: tot, req, equivale100: tot === req };
  });
}
function minimoParaQueImporte(umbral){
  for(let t = 1; t <= 60; t++) if(reqComp(t, umbral) < t) return t;
  return null;
}

/* ---------- avance ---------- */
function nivelNombre(n){ return n >= 1 ? NIVEL[n].nombre : 'En formación'; }
function siguienteNivel(persona){ const n = persona.nivel || 0; return n >= 4 ? null : n + 1; }
function repetir(persona){
  const sig = siguienteNivel(persona); if(!sig) return [];
  const p = persona.pauta || {};
  return COMP.filter(x => x.n === sig && p[x.c] && p[x.c].r === 'n').map(x => x.c);
}
function modulosDelNivel(n, plan){
  const lista = MODULOS.filter(m => m.nivel === n && plan.modulos.includes(m.id)).map(m => m.id);
  const niv = NIVELACION.filter(x => x.antes === n && plan.nivelacion.includes(x.id)).map(x => x.id);
  return [...niv, ...lista];
}
function moduloCompleto(id, av){
  const m = av && av.modulos && av.modulos[id];
  if(!m) return false;
  return !!(m.aprobado || m.revisado);
}
/* D8: la práctica online da derecho a presentarse. */
function listoParaPresentarse(n, plan, avance){
  const mods = modulosDelNivel(n, plan);
  const faltan = mods.filter(id => !moduloCompleto(id, avance));
  return { listo: faltan.length === 0, faltan, total: mods.length };
}
function moduloDesbloqueado(m, persona){
  if(m.nivel === 0) return true;
  const n = persona.nivel || 0;
  return m.nivel <= n + 1;
}

/* ---------- revalidación del core de seguridad ---------- */
function revalidacion(persona, params, hoy){
  const meses = Number((params && params.revalidacionMeses) || PARAMS_DEF.revalidacionMeses);
  if(!persona || (persona.nivel || 0) < 1 || persona.etapa !== 'tecnico') return { estado:'na', vence:null, dias:null };
  const p = persona.pauta || {};
  const fechas = CORE_SEG.filter(c => C[c].n <= persona.nivel && p[c] && p[c].r === 's' && p[c].t).map(c => p[c].t).sort();
  if(!fechas.length) return { estado:'na', vence:null, dias:null };
  const vence = addMonths(fechas[0], meses);
  const dias = diffDays(hoy || hoyISO(), vence);
  return { estado: dias < 0 ? 'vencida' : dias <= 30 ? 'pronto' : 'ok', vence, dias, base: fechas[0] };
}

/* ---------- duos ---------- */
function activos(personas){ return personas.filter(p => p.etapa === 'tecnico'); }
function hayNivel3(personas){ return activos(personas).some(p => (p.nivel || 0) >= 3); }
function hayNivel2(personas){ return activos(personas).some(p => (p.nivel || 0) >= 2); }
/* El nivel 1 solo habilita a ser el segundo integrante (encargado de seguridad): dos de nivel 1 no tienen
   quien ejecute. Solo al arrancar, cuando nadie llegó al nivel 2, trabajan así bajo el Responsable Técnico. */
const DUO_N1_MOTIVO = 'Dos técnicos de nivel 1 no forman duo: el nivel 1 solo habilita a ser el segundo integrante, encargado de seguridad';
function duoActivoDe(pid, duos){ return duos.find(d => d.activo && (d.a === pid || d.b === pid)) || null; }
function companero(pid, duos){ const d = duoActivoDe(pid, duos); return d ? (d.a === pid ? d.b : d.a) : null; }
function estadoDuo(duo, P, personas, hoy, params){
  const a = P[duo.a], b = P[duo.b];
  const out = { valido:true, supervisionRT:false, alertas:[], max:0 };
  if(!a || !b){ out.valido = false; out.alertas.push({s:'crit', t:'Integrante no encontrado'}); return out; }
  out.max = Math.max(a.nivel || 0, b.nivel || 0);
  if((a.nivel || 0) < 1 || (b.nivel || 0) < 1){ out.valido = false; out.alertas.push({s:'crit', t:'Un integrante aún no valida el nivel 1'}); }
  if(out.max < 2 && hayNivel2(personas)){ out.valido = false; out.alertas.push({s:'crit', t:'Duo de dos técnicos de nivel 1'}); }
  if(out.max < 3){
    if(hayNivel3(personas)){ out.valido = false; out.alertas.push({s:'crit', t:'Duo sin técnico de nivel 3 o 4'}); }
    else { out.supervisionRT = true; out.alertas.push({s:'info', t:'Primera generación: supervisión directa del Responsable Técnico'}); }
  }
  for(const x of [a, b]) if(x.suspendidoAT) out.alertas.push({s:'crit', k:'susp', t: x.nombre + ' está suspendido de alta tensión hasta revalidar'});
  const meses = rotacionMeses(params);
  out.rotacionLibre = addMonths(duo.desde, meses);
  out.puedeRotar = diffDays(hoy || hoyISO(), out.rotacionLibre) <= 0;
  return out;
}
function puedeFormarDuo(aId, bId, P, duos, personas){
  const a = P[aId], b = P[bId];
  if(!a || !b) return { ok:false, motivo:'Elige a dos técnicos' };
  if(aId === bId) return { ok:false, motivo:'Elige a dos personas distintas' };
  for(const x of [a, b]){
    if(x.etapa !== 'tecnico') return { ok:false, motivo: x.nombre + ' no es técnico activo' };
    if((x.nivel || 0) < 1) return { ok:false, motivo: x.nombre + ' aún no valida el nivel 1' };
    if(duoActivoDe(x.id, duos)) return { ok:false, motivo: x.nombre + ' ya está en un duo activo' };
  }
  const max = Math.max(a.nivel, b.nivel);
  if(max < 2 && hayNivel2(personas)) return { ok:false, motivo: DUO_N1_MOTIVO };
  if(max < 3 && hayNivel3(personas)) return { ok:false, motivo:'Todo duo lleva al menos un técnico de nivel 3 o 4' };
  if(max < 3) return { ok:true, aviso:'Primera generación: el duo trabaja con supervisión directa del Responsable Técnico' };
  return { ok:true };
}

/* ---------- quién puede validar ---------- */
function puedeValidar(uid, rol, persona, P, duos, personas, code){
  if(!uid) return { ok:false, motivo:'Sin identidad de evaluador' };
  const evalPersona = personas.find(p => p.uid && p.uid === uid);
  if(evalPersona && evalPersona.id === persona.id) return { ok:false, motivo:'Nadie se valida a sí mismo' };
  if(evalPersona){
    const comp = companero(persona.id, duos);
    if(comp && comp === evalPersona.id) return { ok:false, motivo:'Es su compañero de duo. Nadie valida a su compañero de duo.' };
  }
  if(code && evaluadorDe(code) === 'ic' && rol !== 'ic') return { ok:false, motivo:'C25 y C26 los valida Ingeniería de Calibración' };
  if(rol === 'formador' && !(evalPersona && evalPersona.nivel >= 4)) return { ok:false, motivo:'Solo un formador de nivel 4 valida a otros' };
  return { ok:true };
}

/* ---------- bono por avance (D11) ---------- */
function bono(persona, params){
  const b = (params && params.bonoNivel) || {};
  const fn = persona.fechasNivel || {};
  return [1,2,3,4].filter(n => fn[n]).map(n => ({ n, fecha: fn[n], monto: (b[n] === null || b[n] === undefined || b[n] === '') ? null : Number(b[n]) }));
}

/* ---------- selección: comparar postulantes ---------- */
function resumenRuta(persona, params){
  const plan = planPersonal(persona, params);
  return { nivelacion: plan.nivelacion.length, oficio: plan.saltadas.length, cursar: plan.total, horas: plan.horas, plan };
}

/* ---------- alertas automáticas (informe 6) ---------- */
function alertas(ctx){
  const { personas, duos, sesiones, params, hoy, marcas, agenda, postulaciones } = ctx;
  const P = Object.fromEntries(personas.map(p => [p.id, p]));
  const out = [];
  for(const d of duos.filter(x => x.activo)){
    const e = estadoDuo(d, P, personas, hoy, params);
    for(const a of e.alertas){
      if(a.s === 'info' || a.k === 'susp') continue;
      out.push({ s:a.s, t:a.t, d:'Duo ' + ((P[d.a]||{}).nombre || '?') + ' y ' + ((P[d.b]||{}).nombre || '?'), ref:{ tipo:'duo', id:d.id } });
    }
  }
  for(const p of activos(personas)){
    if(!duoActivoDe(p.id, duos) && (p.nivel || 0) >= 1) out.push({ s:'warn', t: p.nombre + ' no tiene duo', d:'Todo el trabajo técnico se hace en duos fijos (D12).', ref:{ tipo:'persona', id:p.id } });
    const rv = revalidacion(p, params, hoy);
    if(rv.estado === 'vencida') out.push({ s:'crit', t:'Revalidación de seguridad vencida: ' + p.nombre, d:'Venció el ' + fechaLarga(rv.vence) + '. Solo el core de seguridad se revalida.', ref:{ tipo:'persona', id:p.id }, accion:'REV' });
    else if(rv.estado === 'pronto') out.push({ s:'warn', t:'Revalidación de seguridad por vencer: ' + p.nombre, d:'Vence el ' + fechaLarga(rv.vence) + ' (en ' + rv.dias + ' días).', ref:{ tipo:'persona', id:p.id }, accion:'REV' });
    if(p.suspendidoAT) out.push({ s:'crit', t: p.nombre + ' suspendido de alta tensión', d:'Tuvo un incidente grave. Vuelve a trabajar con alta tensión cuando apruebe la revalidación del core de seguridad.', ref:{ tipo:'persona', id:p.id }, accion:'REV' });
  }
  const abiertas = (sesiones || []).filter(s => s.estado === 'abierta');
  for(const s of abiertas){
    const pend = recibidasSinAceptar(s, marcas || {}, agenda || {});
    if(pend.length) out.push({ s:'info', t:'Resultados recibidos por aceptar', d: TIPOS_SESION[s.tipo].l + ' de ' + ((P[s.pid]||{}).nombre || '?'), ref:{ tipo:'sesion', id:s.id } });
  }
  for(const po of (postulaciones || [])) out.push({ s:'info', t:'Nueva postulación: ' + (po.nombre || 'sin nombre'), d:'Llegó por la plataforma. Crea su expediente para seguir con la jornada técnica.', ref:{ tipo:'postulacion', id:po.uid } });
  const rank = { crit:0, warn:1, info:2 };
  return out.sort((a, b) => rank[a.s] - rank[b.s]);
}
function recibidasSinAceptar(sesion, marcas, agenda){
  const out = [];
  const items = sesion.items || {};
  const porUid = {};
  for(const c of Object.keys(items)){ const it = items[c]; if(it.asig && !it.r) (porUid[it.asig] = porUid[it.asig] || []).push(c); }
  for(const uid of Object.keys(porUid)){
    const m = marcas[uid] && marcas[uid].sesiones && marcas[uid].sesiones[sesion.id];
    if(m && m.enviado){
      const cods = porUid[uid].filter(c => m.items && (m.items[c] === 's' || m.items[c] === 'n'));
      if(cods.length) out.push({ uid, cods, enviado: m.enviado, obs: m.obs || '' });
    }
  }
  return out;
}

/* ---------- indicadores (informe 6) ---------- */
/* Ventana [desde, hasta] cerrada en ambos extremos. Sin 'desde' = desde siempre;
   sin 'hasta' = sin tope (el llamador pasa hoy para excluir fechas futuras). Una fecha vacía no entra. */
function enPeriodo(fecha, desde, hasta){
  if(!fecha) return false;
  if(desde && fecha < desde) return false;
  if(hasta && fecha > hasta) return false;
  return true;
}
function indicadores(ctx){
  const { personas, duos, registros, params, gestion, hoy, desde } = ctx;
  const hasta = ctx.hasta || hoy || null;
  const inP = f => enPeriodo(f, desde, hasta);
  const P = Object.fromEntries(personas.map(p => [p.id, p]));
  const perfiles = Object.keys(PERFILES);
  const tecnicos = personas.filter(p => p.etapa === 'tecnico' || p.etapa === 'salio');
  const res = {};

  // 1. Tiempo hasta la autonomía
  const aut = {};
  for(const p of tecnicos){
    const f3 = p.fechasNivel && p.fechasNivel[3];
    if(p.ingreso && f3 && inP(f3)){ (aut[p.perfil] = aut[p.perfil] || []).push(diffDays(p.ingreso, f3)); }
  }
  res.autonomia = {
    porPerfil: perfiles.map(k => ({ k, l: PERFILES[k].l, n: (aut[k]||[]).length, dias: (aut[k]||[]).length ? Math.round((aut[k]).reduce((a,b)=>a+b,0) / aut[k].length) : null })),
    n: Object.values(aut).reduce((a, v) => a + v.length, 0)
  };
  const todos = Object.values(aut).flat();
  res.autonomia.promedio = todos.length ? Math.round(todos.reduce((a,b)=>a+b,0) / todos.length) : null;

  // 2. Aprobación al primer intento
  const prim = {};
  for(const p of personas){
    for(const h of Object.values(p.historial || {})){
      if(h.intento !== 1 || !inP(h.fecha)) continue;
      const k = h.tipo; prim[k] = prim[k] || { ok:0, total:0 }; prim[k].total++; if(h.aprobado) prim[k].ok++;
    }
  }
  res.primer = { porTipo: ['N1','N2','N3','N4','REV'].map(k => ({ k, l: k === 'REV' ? 'Revalidación' : 'Nivel ' + k.slice(1), ok:(prim[k]||{}).ok || 0, total:(prim[k]||{}).total || 0, pct: (prim[k] && prim[k].total) ? Math.round(100 * prim[k].ok / prim[k].total) : null })) };
  const pt = Object.values(prim).reduce((a, v) => ({ ok:a.ok+v.ok, total:a.total+v.total }), { ok:0, total:0 });
  res.primer.global = pt.total ? Math.round(100 * pt.ok / pt.total) : null;
  res.primer.total = pt.total;

  // 3. Oficio demostrado
  const ofi = {};
  for(const p of personas){
    if(!(p.jornada && p.jornada.fecha) || !inP(p.jornada.fecha)) continue;
    (ofi[p.perfil] = ofi[p.perfil] || []).push(saltadas(p).length);
  }
  const allOf = Object.values(ofi).flat();
  res.oficio = {
    porPerfil: perfiles.map(k => ({ k, l: PERFILES[k].l, n:(ofi[k]||[]).length, prom: (ofi[k]||[]).length ? +(ofi[k].reduce((a,b)=>a+b,0) / ofi[k].length).toFixed(1) : null })),
    promedio: allOf.length ? +(allOf.reduce((a,b)=>a+b,0) / allOf.length).toFixed(1) : null, n: allOf.length
  };

  // 4. Costo por técnico habilitado
  const costos = (gestion && gestion.costos) || {};
  const faltan = [];
  const hm = params.horasModulo || {}, hv = params.horasValidacion || {};
  const llegan3 = tecnicos.filter(p => p.fechasNivel && p.fechasNivel[3] && inP(p.fechasNivel[3]));
  /* Numerador y denominador usan la misma cohorte: quienes llegaron a nivel 3 dentro del período.
     Se suma lo que costó habilitar a esas personas (su plan completo y sus validaciones hasta el nivel 3). */
  let horasForm = 0, horasVal = 0, extCount = 0, faltaHm = false, faltaHv = false;
  const todosHab = tecnicos.filter(p => p.fechasNivel && p.fechasNivel[3]).length;
  for(const p of llegan3){
    const plan = planPersonal(p, params);
    if(plan.horas === null) faltaHm = true; else horasForm += plan.horas;
    for(const h of Object.values(p.historial || {})){
      if(h.fecha && p.fechasNivel[3] && h.fecha > p.fechasNivel[3]) continue; // lo posterior a habilitarse no es costo de habilitación
      const v = Number(hv[h.tipo]); if(hv[h.tipo] === null || hv[h.tipo] === undefined || hv[h.tipo] === '' || !isFinite(v)) faltaHv = true; else horasVal += v;
      if(h.externa) extCount++;
    }
  }
  const isNum = x => x !== null && x !== undefined && x !== '' && isFinite(Number(x));
  if(faltaHm) faltan.push('Horas de cada módulo');
  if(faltaHv) faltan.push('Horas de cada validación');
  if(!isNum(costos.horaFormacion)) faltan.push('Costo por hora de formación');
  if(!isNum(costos.horaValidacionInterna)) faltan.push('Costo por hora de validación interna');
  if(!isNum(costos.validacionExterna)) faltan.push('Costo de cada validación externa');
  let total = null;
  if(!faltan.length){
    const otros = isNum(costos.otros) && todosHab ? Number(costos.otros) * (llegan3.length / todosHab) : 0; // se reparte en proporción a la cohorte
    total = horasForm * Number(costos.horaFormacion) + horasVal * Number(costos.horaValidacionInterna) + extCount * Number(costos.validacionExterna) + otros;
  }

/* ---------- bono por avance según presupuesto (D11) ----------
   presupuesto: monto total disponible para bonos en el horizonte.
   esperados: cuántas personas se espera que validen cada nivel en ese horizonte.
   pesos: cuánto vale cada nivel respecto de los otros.
   Monto(n) = presupuesto × peso(n) / Σ(peso × esperados). Redondea hacia abajo a 'paso'. */
function calcularBonos(o){
  const pres = Number(o && o.presupuesto);
  const out = { montos:{1:null,2:null,3:null,4:null}, comprometido:0, sobra:0, error:null };
  if(!(pres > 0)){ out.error = 'Ingresa el presupuesto'; return out; }

  for(const n of [1,2,3,4]){ const e = Math.max(0, Number((o.esperados || {})[n]) || 0), w = Math.max(0, Number((o.pesos || {})[n]) || 0); den += e * w; }

/* =====================================================================

class MemDB {

    }
  }
  _notifyAll(){ for(const s of this.subs) s.fire(); }
  doc(path){
    checkPath(path, 'doc');
    const db = this;
    const ref = {
      id: splitPath(path).pop(), path,
      get(){ return Promise.resolve(db._snap(path)); },
      set(data){ if(!isPlainObj(data)) return Promise.reject({ code:'invalid_argument', message:'El cuerpo debe ser un objeto' }); return db._write(path, () => clone(data)); },
      update(data){
        if(!isPlainObj(data)) return Promise.reject({ code:'invalid_argument', message:'El cuerpo debe ser un objeto' });
        return db._write(path, cur => { if(cur === undefined) throw { code:'invalid_argument', message:'update requiere que el documento exista' }; return deepMerge(cur, data); });
      },
      delete(){ return db._write(path, () => null); },
      onSnapshot(next, err){
        const s = { kind:'doc', path, dead:false, fire(){ if(this.dead) return; const snap = db._snap(path); setTimeout(() => { if(!s.dead) next(snap); }, 0); } };
        db.subs.add(s); s.fire();
        return () => { s.dead = true; db.subs.delete(s); };
      },
      collection(sub){ return db.collection(path + '/' + sub); }
    };
    return ref;
  }
  collection(path){
    const segs = checkPath(path, 'col');
    const db = this;
    const list = () => {
      const docs = [];
      for(const [p] of db.store){
        const s = splitPath(p);
        if(s.length === segs.length + 1 && segs.every((x, i) => x === s[i])){ const sn = db._snap(p); if(sn.exists) docs.push(sn); }
      }
      docs.sort((a, b) => a.id < b.id ? -1 : a.id > b.id ? 1 : 0);
      return docs;
    };
    const mk = docs => ({ docs, size: docs.length, empty: !docs.length, docChanges: () => docs.map((d, i) => ({ type:'added', doc:d, oldIndex:-1, newIndex:i })), metadata:{ fromCache:false, hasPendingWrites:false } });
    return {
      path,
      doc(id){ return db.doc(path + '/' + (id || nid('d'))); },
      add(data){ const r = db.doc(path + '/' + nid('d')); return r.set(data).then(() => r); },
      get(){ return Promise.resolve(mk(list())); },
      onSnapshot(next, err){
        const s = { kind:'col', segs, dead:false, fire(){ if(this.dead) return; const docs = list(); setTimeout(() => { if(!s.dead) next(mk(docs)); }, 0); } };
        db.subs.add(s); s.fire();
        return () => { s.dead = true; db.subs.delete(s); };
      },
      where(){ return this; }, orderBy(){ return this; }, limit(){ return this; }
    };
  }
  dump(){ const o = {}; for(const [p, r] of this.store) o[p] = r.data; return o; }
  load(obj){ this.store.clear(); for(const p of Object.keys(obj)){ const data = obj[p]; this.store.set(p, { data: clone(data), frozen: deepFreeze(clone(data)), v:1 }); } this._notifyAll(); }
}

class MemUser {
  constructor(dir, viewer){ this.dir = dir; this.viewer = viewer; }

  async canEdit(){ return LEVEL[this.viewer.level] >= LEVEL.admin; }
  async can(n){ return n === 'data.write' ? LEVEL[this.viewer.level] >= LEVEL.interact : false; }

  async me(){ const p = this.dir[this.viewer.id] || {}; return { id:this.viewer.id || null, name:p.name || '', avatarUrl:'', color:p.color || '#52595e', email:null, isOwner:this.viewer.level === 'owner', canEdit:LEVEL[this.viewer.level] >= LEVEL.admin }; }
  async profiles(ids){ const out = {}; for(const id of [].concat(ids)){ const p = this.dir[id]; out[id] = { id, name: p ? p.name : '', avatarUrl:'', color: p ? p.color : '#52595e', email:null, isMe: id === this.viewer.id, guest:false }; } return out; }
  async search(q){ q = String(q || '').toLowerCase().trim(); const all = Object.keys(this.dir).map(id => ({ id, name:this.dir[id].name, avatarUrl:'', color:this.dir[id].color, email:null, isMe:id === this.viewer.id, guest:false })); return (q ? all.filter(p => p.name.toLowerCase().includes(q)) : all).slice(0, 8); }
}

const W = {
  q: new Map(),
  pending: 0,
  _run(path, fn){
    const prev = this.q.get(path) || Promise.resolve();
    this.pending++;
    const run = async () => {
      try { return await fn(); }
      catch(e){
        if(e && e.code === 'unavailable'){ await new Promise(r => setTimeout(r, 400 + Math.random() * 600)); return await fn(); }
        throw e;
      }
    };
    const p = prev.catch(() => {}).then(run).finally(() => { this.pending--; if(this.q.get(path) === p) this.q.delete(path); });
    this.q.set(path, p);
    return p;
  },
  set(path, data){ return this._run(path, () => S.db.doc(path).set(data)); },
  update(path, data){ return this._run(path, () => S.db.doc(path).update(data)); },
  /* crea si no existe, mezcla si existe */
  upsert(path, data, exists){
    return this._run(path, async () => {
      if(exists) { try { return await S.db.doc(path).update(data); } catch(e){ if(!(e && e.code === 'invalid_argument')) throw e; } }
      const snap = await S.db.doc(path).get();
      if(snap.exists) return await S.db.doc(path).update(data);
      return await S.db.doc(path).set(data);
    });
  },
  del(path){ return this._run(path, () => S.db.doc(path).delete()); }
};

/* ---------- foco atrapado para diálogos y hojas ---------- */
function trapFocus(container, onEsc){
  const sel = 'a[href],button:not([disabled]),input:not([disabled]),select:not([disabled]),textarea:not([disabled]),[tabindex]:not([tabindex="-1"])';
  const key = e => {
    if(e.key === 'Escape'){ e.preventDefault(); onEsc(); return; }
    if(e.key !== 'Tab') return;
    const f = Array.from(container.querySelectorAll(sel)).filter(x => x.offsetParent !== null);
    if(!f.length) return;
    const first = f[0], last = f[f.length - 1];
    if(e.shiftKey && document.activeElement === first){ e.preventDefault(); last.focus(); }
    else if(!e.shiftKey && document.activeElement === last){ e.preventDefault(); first.focus(); }
  };
  container.addEventListener('keydown', key);
  return () => container.removeEventListener('keydown', key);
}

/* ---------- diálogo de confirmación (reemplaza confirm/prompt) ---------- */
function dialog(o){
  return new Promise(resolve => {
    const prev = document.activeElement;
    const wrap = h('div', { class:'dialog-wrap' });
    const scrim = h('div', { class:'scrim' });
    let motivoEl = null, extra = null;
    const close = (val) => { untrap(); wrap.remove(); scrim.remove(); document.body.style.overflow = ''; if(prev && prev.focus) prev.focus(); resolve(val); };
    if(o.motivo){
      motivoEl = h('textarea', { class:'textarea', id:'dlg-motivo', maxlength:'400', placeholder:o.motivo.placeholder || '' });
      extra = h('div', { class:'field', style:'margin-top:14px' }, h('label', { class:'label', for:'dlg-motivo' }, o.motivo.label || 'Motivo'), motivoEl, o.motivo.hint ? h('span', { class:'hint' }, o.motivo.hint) : null);
    }
    const ok = btn(o.confirm || 'Confirmar', { kind: o.danger ? 'danger' : (o.kind || 'owner'), cls: o.danger ? 'solid' : '' });
    const cancel = btn(o.cancel || 'Cancelar', { kind:'ghost' });
    const err = h('p', { class:'hint', style:'color:var(--crit);margin-top:8px', role:'alert' });
    ok.addEventListener('click', () => {
      const m = motivoEl ? motivoEl.value.trim() : '';
      if(o.motivo && o.motivo.required && m.length < (o.motivo.min || 5)){ err.textContent = 'Escribe el motivo (mínimo ' + (o.motivo.min || 5) + ' caracteres).'; motivoEl.focus(); return; }
      close({ ok:true, motivo:m });
    });
    cancel.addEventListener('click', () => close(null));
    scrim.addEventListener('click', () => close(null));
    const box = h('div', { class:'dialog' + (o.wide ? ' wide' : ''), role:'dialog', 'aria-modal':'true', 'aria-labelledby':'dlg-t' },
      o.icon ? h('div', { class:'dlg-ic ' + (o.danger ? 'crit' : o.iconKind || 'info') }, icon(o.icon, 's20')) : null,
      h('h2', { id:'dlg-t' }, o.title),
      o.body ? (o.body instanceof Node ? o.body : h('p', { class:'body', style:'font-size:15px' }, o.body)) : null,
      extra, err,
      h('div', { class:'dlg-actions' }, o.noCancel ? null : cancel, ok));
    wrap.appendChild(box);
    wrap.addEventListener('click', e => { if(e.target === wrap) close(null); });
    document.body.appendChild(scrim); document.body.appendChild(wrap);
    document.body.style.overflow = 'hidden';
    const untrap = trapFocus(box, () => close(null));
    setTimeout(() => (motivoEl || ok).focus(), 30);
  });
}

/* ---------- hoja lateral (tablet y PC) o inferior (teléfono) ---------- */
let SHEET = null;
function openSheet(title, build, opts){
  closeSheet();
  opts = opts || {};
  const prev = document.activeElement;
  const scrim = h('div', { class:'scrim' });
  const body = h('div', { class:'sheet-b' });
  const closeB = h('button', { type:'button', class:'btn btn-quiet icon sm', 'aria-label':'Cerrar' }, icon('x', 's20'));
  const panel = h('div', { class:'sheet' + (opts.wide ? ' wide' : ''), role:'dialog', 'aria-modal':'true', 'aria-label': title },
    h('div', { class:'sheet-grip' }),
    h('div', { class:'sheet-h' }, h('h2', { class:'h3' }, title), closeB), body);
  const close = () => { if(!SHEET) return; SHEET.untrap(); scrim.remove(); panel.remove(); document.body.style.overflow = ''; SHEET = null; if(prev && prev.focus && document.contains(prev)) prev.focus(); if(opts.onClose) opts.onClose(); };
  closeB.addEventListener('click', close); scrim.addEventListener('click', close);
  addKids(body, [build(close)]);
  document.body.appendChild(scrim); document.body.appendChild(panel);
  document.body.style.overflow = 'hidden';
  SHEET = { close, untrap: trapFocus(panel, close), body, rebuild: () => { clear(body); addKids(body, [build(close)]); } };
  setTimeout(() => { const f = panel.querySelector('[autofocus]') || closeB; f.focus(); }, 40);
  return close;
}
function closeSheet(){ if(SHEET) SHEET.close(); }

/* =====================================================================
   Lumine Habilita · generador de códigos QR propio (sin librerías)
   Modo byte, corrección de errores M, versiones 1 a 6 (hasta 106 bytes).
   Basado en la norma ISO/IEC 18004: Reed-Solomon sobre GF(256),
   intercalado de bloques, ocho máscaras y elección por penalización.
   ===================================================================== */
'use strict';

const QR = (() => {
  /* [datos por bloque, corrección por bloque, bloques] con nivel M */
  const BLOQUES = { 1:[16,10,1], 2:[28,16,1], 3:[44,26,1], 4:[32,18,2], 5:[43,24,2], 6:[27,16,4] };
  const ALINEA = { 1:[], 2:[6,18], 3:[6,22], 4:[6,26], 5:[6,30], 6:[6,34] };
  const EXP = new Array(512), LOG = new Array(256);
  { let x = 1; for(let i = 0; i < 255; i++){ EXP[i] = x; LOG[x] = i; x <<= 1; if(x & 0x100) x ^= 0x11d; } for(let i = 255; i < 512; i++) EXP[i] = EXP[i - 255]; }
  const mul = (a, b) => (a && b) ? EXP[LOG[a] + LOG[b]] : 0;
  function generador(n){
    let g = [1];
    for(let i = 0; i < n; i++){ const ng = new Array(g.length + 1).fill(0); for(let j = 0; j < g.length; j++){ ng[j] ^= g[j]; ng[j + 1] ^= mul(g[j], EXP[i]); } g = ng; }
    return g;
  }
  function correccion(datos, n){
    const g = generador(n), r = new Array(n).fill(0);
    for(const d of datos){ const f = d ^ r[0]; r.shift(); r.push(0); for(let j = 0; j < n; j++) r[j] ^= mul(g[j + 1], f); }
    return r;
  }
  function bytesDe(texto){ return Array.from(new TextEncoder().encode(String(texto))); }

  function codificar(texto){
    const bytes = bytesDe(texto);
    let v = 1;
    while(v <= 6 && 4 + 8 + 8 * bytes.length > 8 * BLOQUES[v][0] * BLOQUES[v][2]) v++;
    if(v > 6) throw new Error('Texto demasiado largo para el código QR');
    const [porBloque, ecBloque, nb] = BLOQUES[v];
    const cap = porBloque * nb;
    // flujo de bits: modo byte (0100), largo (8 bits), datos, terminador y relleno
    const bits = [];
    const poner = (val, n) => { for(let i = n - 1; i >= 0; i--) bits.push((val >>> i) & 1); };
    poner(4, 4); poner(bytes.length, 8); for(const b of bytes) poner(b, 8);
    poner(0, Math.min(4, cap * 8 - bits.length));
    while(bits.length % 8) bits.push(0);
    const datos = [];
    for(let i = 0; i < bits.length; i += 8){ let b = 0; for(let j = 0; j < 8; j++) b = (b << 1) | bits[i + j]; datos.push(b); }
    for(let k = 0; datos.length < cap; k++) datos.push(k % 2 ? 0x11 : 0xEC);
    // bloques, corrección e intercalado
    const bl = [], ec = [];
    for(let i = 0; i < nb; i++){ const d = datos.slice(i * porBloque, (i + 1) * porBloque); bl.push(d); ec.push(correccion(d, ecBloque)); }
    const final = [];
    for(let i = 0; i < porBloque; i++) for(const d of bl) final.push(d[i]);
    for(let i = 0; i < ecBloque; i++) for(const e of ec) final.push(e[i]);
    return dibujar(v, final);
  }

  function dibujar(v, cw){
    const n = 17 + 4 * v;
    const m = Array.from({ length:n }, () => new Array(n).fill(false));
    const fn = Array.from({ length:n }, () => new Array(n).fill(false));
    const set = (x, y, on) => { m[y][x] = on; fn[y][x] = true; };
    for(let i = 0; i < n; i++){ set(6, i, i % 2 === 0); set(i, 6, i % 2 === 0); }
    const buscador = (cx, cy) => { for(let dy = -4; dy <= 4; dy++) for(let dx = -4; dx <= 4; dx++){ const x = cx + dx, y = cy + dy; if(x < 0 || y < 0 || x >= n || y >= n) continue; const d = Math.max(Math.abs(dx), Math.abs(dy)); set(x, y, d !== 2 && d !== 4); } };
    buscador(3, 3); buscador(n - 4, 3); buscador(3, n - 4);
    const al = ALINEA[v], u = al.length - 1;
    for(let i = 0; i < al.length; i++) for(let j = 0; j < al.length; j++){
      if((i === 0 && j === 0) || (i === 0 && j === u) || (i === u && j === 0)) continue;
      for(let dy = -2; dy <= 2; dy++) for(let dx = -2; dx <= 2; dx++) set(al[i] + dx, al[j] + dy, Math.max(Math.abs(dx), Math.abs(dy)) !== 1);
    }
    formato(m, set, n, 0); // reserva las zonas de formato
    // datos en zigzag
    let k = 0;
    for(let der = n - 1; der >= 1; der -= 2){
      if(der === 6) der = 5;
      for(let vert = 0; vert < n; vert++) for(let j = 0; j < 2; j++){
        const x = der - j, arriba = ((der + 1) & 2) === 0, y = arriba ? n - 1 - vert : vert;
        if(!fn[y][x] && k < cw.length * 8){ m[y][x] = ((cw[k >>> 3] >>> (7 - (k & 7))) & 1) === 1; k++; }
      }
    }
    // elegir la máscara con menor penalización
    let mejor = null, mejorP = Infinity;
    for(let mk = 0; mk < 8; mk++){
      const c = m.map(r => r.slice());
      enmascarar(c, fn, mk, n);
      formato(c, (x, y, on) => { c[y][x] = on; }, n, mk);
      const p = penalizacion(c, n);
      if(p < mejorP){ mejorP = p; mejor = c; }
    }
    return mejor;
  }
  function formato(m, set, n, mascara){
    const datos = (0 << 3) | mascara; // nivel M = 00
    let r = datos;
    for(let i = 0; i < 10; i++) r = (r << 1) ^ ((r >>> 9) * 0x537);
    const b = ((datos << 10) | r) ^ 0x5412;
    const bit = i => ((b >>> i) & 1) === 1;
    for(let i = 0; i <= 5; i++) set(8, i, bit(i));
    set(8, 7, bit(6)); set(8, 8, bit(7)); set(7, 8, bit(8));
    for(let i = 9; i < 15; i++) set(14 - i, 8, bit(i));
    for(let i = 0; i < 8; i++) set(n - 1 - i, 8, bit(i));
    for(let i = 8; i < 15; i++) set(8, n - 15 + i, bit(i));
    set(8, n - 8, true);
  }
  function enmascarar(m, fn, k, n){
    for(let y = 0; y < n; y++) for(let x = 0; x < n; x++){
      if(fn[y][x]) continue;
      let inv;
      switch(k){
        case 0: inv = (x + y) % 2 === 0; break;
        case 1: inv = y % 2 === 0; break;
        case 2: inv = x % 3 === 0; break;
        case 3: inv = (x + y) % 3 === 0; break;
        case 4: inv = (Math.floor(x / 3) + Math.floor(y / 2)) % 2 === 0; break;
        case 5: inv = (x * y) % 2 + (x * y) % 3 === 0; break;
        case 6: inv = ((x * y) % 2 + (x * y) % 3) % 2 === 0; break;
        default: inv = ((x + y) % 2 + (x * y) % 3) % 2 === 0;
      }
      if(inv) m[y][x] = !m[y][x];
    }
  }
  function penalizacion(m, n){
    let p = 0, oscuros = 0;
    const corridas = get => { for(let a = 0; a < n; a++){ let run = 1; for(let b = 1; b < n; b++){ if(get(a, b) === get(a, b - 1)) run++; else { if(run >= 5) p += run - 2; run = 1; } } if(run >= 5) p += run - 2; } };
    corridas((a, b) => m[a][b]); corridas((a, b) => m[b][a]);
    for(let y = 0; y < n - 1; y++) for(let x = 0; x < n - 1; x++){ const c = m[y][x]; if(c === m[y][x + 1] && c === m[y + 1][x] && c === m[y + 1][x + 1]) p += 3; }
    const patron = [true, false, true, true, true, false, true];
    const esPatron = (get, a, b) => { for(let i = 0; i < 7; i++) if(get(a, b + i) !== patron[i]) return false; return true; };
    for(let a = 0; a < n; a++) for(let b = 0; b + 7 <= n; b++){ if(esPatron((r, c) => m[r][c], a, b)) p += 40; if(esPatron((r, c) => m[c][r], a, b)) p += 40; }
    for(const r of m) for(const c of r) if(c) oscuros++;
    p += Math.floor(Math.abs(oscuros * 20 - n * n * 10) / (n * n)) * 10;
    return p;
  }

  /* SVG listo para insertar: módulos oscuros sobre fondo claro, con margen de 4 módulos */
  function svg(texto, o){
    o = o || {};
    const m = codificar(texto), n = m.length, q = 4, t = n + 2 * q;
    let d = '';
    for(let y = 0; y < n; y++) for(let x = 0; x < n; x++) if(m[y][x]) d += 'M' + (x + q) + ' ' + (y + q) + 'h1v1h-1z';
    const el = document.createElementNS('http://www.w3.org/2000/svg', 'svg');
    el.setAttribute('viewBox', '0 0 ' + t + ' ' + t);
    el.setAttribute('role', 'img');
    el.setAttribute('aria-label', o.label || 'Código QR');
    el.setAttribute('shape-rendering', 'crispEdges');
    const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
    bg.setAttribute('width', t); bg.setAttribute('height', t); bg.setAttribute('fill', '#ffffff');
    const p = document.createElementNS('http://www.w3.org/2000/svg', 'path');
    p.setAttribute('d', d); p.setAttribute('fill', o.color || '#0b0f11');
    el.appendChild(bg); el.appendChild(p);
    return el;
  }
  return { codificar, svg };
})();
if(typeof module !== 'undefined') module.exports = { QR };

    parte('cabina', 'glass', [92,140,160], extrude([[-1.00,0.93],[1.60,1.00],[0.92,1.42],[-0.30,1.42]], -0.72, 0.72), { alpha:.42 });

    parte('eje', 'rear', [70,80,86], cylZ(1.36, 0.32, 0, 0.05, 1.44, 8), { ex:[0, 0.55, 0] });
    parte('motor', 'kit', [34,184,240], cylZ(1.36, 0.32, 0, 0.17, 0.42, 16), { pick:'motor', ex:[0, 0.95, 0] });
    parte('regen1', 'kit', [120,214,247], cylZ(1.36, 0.32, -0.66, 0.22, 0.05, 16), { pick:'regen', ex:[0, 0.75, -0.25] });
    parte('regen2', 'kit', [120,214,247], cylZ(1.36, 0.32, 0.66, 0.22, 0.05, 16), { pick:'regen', ex:[0, 0.75, 0.25] });
    parte('bateria', 'kit', [24,150,205], box(0.55, 1.05, 0.40, 0.62, -0.55, 0.55), { pick:'bateria', ex:[0, 1.55, 0] });
    parte('ecu', 'kit', [230,244,250], box(-0.78, -0.48, 0.70, 0.84, 0.12, 0.40), { pick:'ecu', ex:[0, 1.35, 0.3] });

  /* ---------- instancia ---------- */
  function crear(host, opts){

    const ctx = canvas.getContext('2d');

          const b = eje ? proyectar([i * 0.6, 0, 3.6]) : proyectar([3.6, 0, i * 0.6]);

        const cuerpo = p.grupo === 'body' || p.grupo === 'glass';

        if(cuerpo && (st.xray || st.ex > .01)){ ctx.strokeStyle = 'rgba(160,215,240,.22)'; ctx.lineWidth = 1; ctx.stroke(); }
        else if(it.elegido){ ctx.strokeStyle = 'rgba(120,225,255,.95)'; ctx.lineWidth = 1.4; ctx.stroke(); }
        else if(it.p.grupo === 'kit'){ ctx.strokeStyle = 'rgba(255,255,255,.10)'; ctx.lineWidth = .8; ctx.stroke(); }

    const api = {
      el: host,
      enfocar(id){ st.sel = id; st.idle = performance.now() + 4000; const v = VISTAS[id]; if(v && opts.interactivo){ st.tYaw = v[0]; st.tPitch = v[1]; st.tDist = v[2]; } pedir(); },

/* =====================================================================
   Lumine Habilita · movimiento
   Microinteracciones con propósito: aparecer al hacer scroll, tarjetas
   con inclinación, botones magnéticos, barra de avance de lectura,
   cursor de foco y precarga breve. Todo se apaga con
   prefers-reduced-motion, y lo que depende del mouse solo corre con
   un puntero fino (nunca en teléfonos ni tablets táctiles).

   a un observador.
   ===================================================================== */
'use strict';

const Motion = (() => {
  const mq = q => !!(window.matchMedia && matchMedia(q).matches);
  const quieto = () => mq('(prefers-reduced-motion: reduce)');
  const fino = () => mq('(hover: hover) and (pointer: fine)');

  /* ---------- aparecer al entrar en pantalla ----------
     El elemento parte visible. Al acercarse al viewport recibe una
     animación corta de entrada; si no hay observador, simplemente
     se queda como está. */
  let io = null;
  function observador(){
    if(io || !window.IntersectionObserver) return io;
    io = new IntersectionObserver(es => {
      for(const e of es){
        if(!e.isIntersecting) continue;
        const el = e.target; io.unobserve(el);
        el.classList.add('rv-in');
      }
    }, { rootMargin:'0px 0px 12% 0px', threshold:0 });
    return io;
  }
  function revelar(root, animar){
    const els = root.querySelectorAll('[data-rv]:not(.rv-in):not(.rv-done)');
    if(!els.length) return;
    if(!animar || quieto() || !fino() || !observador()){ els.forEach(el => el.classList.add('rv-done')); return; }
    const alto = window.innerHeight || 800;
    let k = 0;
    els.forEach(el => {
      const r = el.getBoundingClientRect();
      // lo que ya está en pantalla entra en cascada; lo de abajo, al llegar
      if(r.top < alto && r.bottom > 0){ el.style.setProperty('--rv-d', Math.min(k++, 8) * 70 + 'ms'); el.classList.add('rv-in'); }
      else io.observe(el);
    });
  }
  /* cascada dentro de un grupo: [data-stagger] reparte el retardo a sus hijos */
  function cascada(root){
    root.querySelectorAll('[data-stagger]').forEach(g => {
      const paso = Number(g.dataset.stagger) || 18;
      Array.from(g.querySelectorAll('[data-st]')).forEach((el, i) => el.style.setProperty('--st-d', Math.min(i * paso, 900) + 'ms'));
    });
  }

  /* ---------- inclinación de tarjetas ---------- */
  function inclinar(root){
    if(!fino() || quieto()) return;
    root.querySelectorAll('[data-tilt]:not([data-tilt-on])').forEach(el => {
      el.setAttribute('data-tilt-on', '');
      const max = Number(el.dataset.tilt) || 6;
      let raf = 0, px = 0, py = 0;
      const pintar = () => {
        raf = 0;
        const r = el.getBoundingClientRect();
        const x = (px - r.left) / r.width, y = (py - r.top) / r.height;
        el.style.setProperty('--rx', ((0.5 - y) * max).toFixed(2) + 'deg');
        el.style.setProperty('--ry', ((x - 0.5) * max).toFixed(2) + 'deg');
        el.style.setProperty('--mx', (x * 100).toFixed(1) + '%');
        el.style.setProperty('--my', (y * 100).toFixed(1) + '%');
      };
      el.addEventListener('pointermove', e => { px = e.clientX; py = e.clientY; el.classList.add('tilting'); if(!raf) raf = requestAnimationFrame(pintar); });
      el.addEventListener('pointerleave', () => { el.classList.remove('tilting'); el.style.setProperty('--rx', '0deg'); el.style.setProperty('--ry', '0deg'); });
    });
  }

  /* ---------- botones magnéticos ---------- */
  function magnetizar(root){
    if(!fino() || quieto()) return;
    root.querySelectorAll('[data-mag]:not([data-mag-on])').forEach(el => {
      el.setAttribute('data-mag-on', '');
      const f = Number(el.dataset.mag) || 0.22;
      el.addEventListener('pointermove', e => {
        const r = el.getBoundingClientRect();
        const dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
        el.style.transform = 'translate(' + (dx * f).toFixed(1) + 'px,' + (dy * f * 1.2).toFixed(1) + 'px)';
      });
      el.addEventListener('pointerleave', () => { el.style.transform = ''; });
    });
  }

  /* ---------- paralaje suave ([data-px] = factor) ---------- */
  const PX = new Set();
  function paralaje(root){
    if(quieto() || !fino()) return;
    root.querySelectorAll('[data-px]').forEach(el => PX.add(el));
    moverPx();
  }
  function moverPx(){
    for(const el of PX){
      if(!document.body.contains(el)){ PX.delete(el); continue; }
      const r = el.getBoundingClientRect();
      const c = (r.top + r.height / 2 - innerHeight / 2) / innerHeight;
      el.style.setProperty('--py', (c * -Number(el.dataset.px) * 60).toFixed(1) + 'px');
    }
  }

  /* ---------- barra de lectura ---------- */
  let barra = null;
  function progreso(){
    if(!barra){ barra = h('div', { class:'scrollbar-fx', 'aria-hidden':'true' }); document.body.appendChild(barra); }
    const max = document.documentElement.scrollHeight - innerHeight;
    barra.style.transform = 'scaleX(' + (max > 40 ? Math.min(1, scrollY / max) : 0).toFixed(4) + ')';
  }
  let rafS = 0;
  window.addEventListener('scroll', () => { if(rafS) return; rafS = requestAnimationFrame(() => { rafS = 0; progreso(); if(PX.size) moverPx(); }); }, { passive:true });
  window.addEventListener('resize', () => progreso(), { passive:true });

  /* ---------- cursor de foco (solo puntero fino, solo vistas públicas) ---------- */
  let cur = null, cx = -100, cy = -100, tx = -100, ty = -100, rafC = 0;
  function cursor(activo){
    document.body.classList.toggle('fx-cursor', !!activo && fino() && !quieto());
    if(!document.body.classList.contains('fx-cursor') || cur) return;
    cur = h('div', { class:'cursor-fx', 'aria-hidden':'true' });
    document.body.appendChild(cur);
    const mover = () => { rafC = 0; cx += (tx - cx) * 0.22; cy += (ty - cy) * 0.22; cur.style.transform = 'translate(' + cx.toFixed(1) + 'px,' + cy.toFixed(1) + 'px)'; if(Math.abs(tx - cx) + Math.abs(ty - cy) > 0.4) rafC = requestAnimationFrame(mover); };
    document.addEventListener('pointermove', e => {
      if(e.pointerType !== 'mouse'){ return; }
      tx = e.clientX; ty = e.clientY; cur.classList.add('vis');
      const t = e.target && e.target.closest ? e.target.closest('a,button,[role="button"],input,select,textarea,label,.lab-canvas') : null;
      cur.classList.toggle('on', !!t);
      cur.classList.toggle('drag', !!(t && t.classList && t.classList.contains('lab-canvas')));
      if(!rafC) rafC = requestAnimationFrame(mover);
    }, { passive:true });
    document.addEventListener('pointerdown', () => cur && cur.classList.add('down'), { passive:true });
    document.addEventListener('pointerup', () => cur && cur.classList.remove('down'), { passive:true });
    document.documentElement.addEventListener('pointerleave', () => { if(cur){ tx = ty = -100; cur.classList.remove('on'); } });
  }

  /* ---------- números que cuentan ---------- */
  function contar(el, a, dur){
    a = Number(a) || 0; dur = dur || 900;
    if(quieto()){ el.textContent = String(a); return; }
    const t0 = performance.now();
    const paso = t => { const k = Math.min(1, (t - t0) / dur); el.textContent = String(Math.round(a * (1 - Math.pow(1 - k, 3)))); if(k < 1) requestAnimationFrame(paso); };
    el.textContent = '0';
    requestAnimationFrame(paso);
  }

  /* ---------- precarga: una vez por sesión, menos de un segundo ---------- */
  function precarga(){
    const pre = document.getElementById('pre');
    if(!pre) return;
    let visto = false;
    try { visto = sessionStorage.getItem('lh-pre') === '1'; sessionStorage.setItem('lh-pre', '1'); } catch(e){ visto = true; }
    if(visto || quieto()){ pre.remove(); return; }
    pre.classList.add('run');
    setTimeout(() => { pre.classList.add('out'); setTimeout(() => pre.remove(), 360); }, 760);
  }

  /* se llama después de cada render */
  const PUBLICAS = new Set(['inicio', 'sistema', 'laboratorio', 'taller']);
  function tras(root, nav, ruta){
    cascada(root);
    revelar(root, nav);
    inclinar(root);
    magnetizar(root);
    paralaje(root);
    cursor(PUBLICAS.has(ruta));
    progreso();
  }
  return { tras, contar, precarga, quieto, fino };
})();

/* =====================================================================
   Lumine Habilita · estado, carga de datos y sesión
   ===================================================================== */
'use strict';

const S = {
  build: BUILD,                 // 'demo' | 'real'
  db: null, user: null, dl: null,
  mem: null, memUser: null,
  me: { id:null, name:'', level:'none', isOwner:false, canEdit:false },
  role: 'loading',              // admin | tecnico | postulante | anonimo | sindb | loading
  demoRole: (function(){ try { return sessionStorage.getItem('lh-demo-sesion') || 'visitante'; } catch(e){ return 'visitante'; } })(),
  kiosk: false,
  D: { personas:{}, sesiones:{}, duos:{}, registros:{}, params:null, gestion:null, contenido:null, avance:{}, marcas:{}, agenda:{}, expedientes:{}, bitacora:{}, solicitudes:{} },
  mine: { expediente:null, avance:null, agenda:null, marcas:null, solicitud:null },
  loaded: new Set(),
  unsub: [],
  readOnly: false,
  preview: null,                // vista previa de administración: { tipo, pid, nombre }
  salud: { perfiles:null },     // última falla de infraestructura que conviene mostrar
  hoy: hoyISO(),
  rev: 0
};
const UI = {};                  // estado de interfaz por vista (pestañas, filtros)
function ui(key, def){ if(!(key in UI)) UI[key] = def; return UI[key]; }

/* ---------- lecturas derivadas ---------- */
const arr = m => Object.values(m || {});
function params(){ return Object.assign({}, PARAMS_DEF, S.D.params || {}, { horasModulo: Object.assign({}, (S.D.params || {}).horasModulo || {}), horasValidacion: Object.assign({}, (S.D.params || {}).horasValidacion || {}), bonoNivel: Object.assign({}, (S.D.params || {}).bonoNivel || {}) }); }
function gestion(){ const g = S.D.gestion || {}; return Object.assign({}, GESTION_DEF, g, { costos: Object.assign({}, GESTION_DEF.costos, g.costos || {}), metas: Object.assign({}, g.metas || {}), instalaciones: Object.assign({}, g.instalaciones || {}), equipo: Object.assign({}, g.equipo || {}) }); }
function personas(){ return arr(S.D.personas).sort((a, b) => String(a.nombre).localeCompare(String(b.nombre), 'es')); }
function duos(){ return arr(S.D.duos); }
function sesiones(){ return arr(S.D.sesiones).sort((a, b) => String(b.fecha || '').localeCompare(String(a.fecha || '')) || String(b.creado || '').localeCompare(String(a.creado || ''))); }
function registros(){ return arr(S.D.registros).sort((a, b) => String(b.fecha).localeCompare(String(a.fecha))); }
function Pmap(){ return S.D.personas; }
function persona(id){ return S.D.personas[id] || null; }
function personaPorUid(uid){ return uid ? personas().find(p => p.uid === uid) || null : null; }
function postulaciones(){
  const linked = new Set(personas().map(p => p.uid).filter(Boolean));
  return Object.keys(S.D.avance).filter(uid => !linked.has(uid) && S.D.avance[uid] && S.D.avance[uid].postulacion && S.D.avance[uid].postulacion.enviada)
    .map(uid => Object.assign({ uid }, S.D.avance[uid].postulacion, { fundamentos: S.D.avance[uid].fundamentos || null }));
}
function ctx(extra){
  return Object.assign({ personas: personas(), duos: duos(), sesiones: sesiones(), registros: registros(), params: params(), gestion: gestion(), hoy: S.hoy, P: Pmap(), marcas: S.D.marcas, agenda: S.D.agenda, postulaciones: postulaciones() }, extra || {});
}
function rolEquipo(uid){
  const g = gestion();
  const r = g.equipo[uid] && g.equipo[uid].rol;
  if(r) return r;
  if(uid === S.me.id && S.me.isOwner) return 'rt';
  return S.me.canEdit && uid === S.me.id ? 'admin' : null;
}
function miRol(){ return rolEquipo(S.me.id); }
const ROL_L = { rt:'Responsable Técnico', ic:'Ingeniería de Calibración', formador:'Formador', admin:'Administración' };

/* nombre visible de un uid (en la demo, el directorio; en real, perfiles resueltos) */
const PROFILES = {};
function nombreUid(uid){
  if(!uid) return '';
  if(PROFILES[uid] && PROFILES[uid].name) return PROFILES[uid].name;
  const p = personaPorUid(uid); if(p) return p.nombre;
  if(uid === S.me.id) return S.me.name || 'Tú';
  return 'Usuario sin nombre visible';
}
async function resolverPerfiles(ids){
  ids = uniq(ids.filter(x => validId(x)));
  if(!S.user || !ids.length) return;
  try {
    const falt = ids.filter(id => !PROFILES[id]);
    if(!falt.length) return;
    const r = await S.user.profiles(falt);
    let changed = false;
    for(const id of Object.keys(r)){ PROFILES[id] = { name: r[id].name || '', color: r[id].color || null }; changed = true; }
    if(changed) scheduleRender();
    if(S.salud.perfiles){ S.salud.perfiles = null; scheduleRender(); }
  } catch(e){
    // No se silencia: queda en consola, en S.salud (Panel y Ajustes lo muestran) y se avisa una vez por sesión
    console.warn('perfiles', e);
    const primera = !S.salud.perfiles;
    S.salud.perfiles = { t: new Date().toISOString(), msg: (e && (e.message || e.code)) || 'sin detalle' };
    if(primera && S.role === 'admin'){ toast('No se pudieron cargar los nombres de las cuentas. Se muestran como "Usuario sin nombre visible".', 'warn'); scheduleRender(); }
  }
}

/* ---------- suscripciones ---------- */
function unsubscribeAll(){ for(const u of S.unsub) try { u(); } catch(e){} S.unsub = []; S.loaded = new Set(); }
function subCol(name, key){
  const un = S.db.collection(name).onSnapshot(snap => {
    const m = {}; for(const d of snap.docs) m[d.id] = d.data();
    S.D[key] = m; S.loaded.add(key); S.rev++; scheduleRender();
    if(key === 'personas' || key === 'duos' || key === 'expedientes' || key === 'sesiones') programarReconciliacion();
  }, err => onDbError(err));
  S.unsub.push(un);
}
function subDoc(path, setter, key){
  const un = S.db.doc(path).onSnapshot(snap => { setter(snap.exists ? snap.data() : null); S.loaded.add(key); S.rev++; scheduleRender(); }, err => onDbError(err));
  S.unsub.push(un);
}
function onDbError(e){
  if(e && (e.code === 'revoked' || e.code === 'not_granted' || e.code === 'capability_disabled' || e.code === 'capability_removed')){
    S.readOnly = true; toast(errMsg(e), 'crit'); scheduleRender(); return;
  }
  if(e && e.code === 'resource_exhausted'){ toast(errMsg(e), 'warn'); return; }
  console.warn('db', e);
}
function suscribir(){
  unsubscribeAll();
  if(S.role === 'admin'){
    subCol('personas', 'personas'); subCol('sesiones', 'sesiones'); subCol('duos', 'duos'); subCol('registros', 'registros');
    subCol('avance', 'avance'); subCol('marcas', 'marcas'); subCol('agenda', 'agenda'); subCol('expedientes', 'expedientes'); subCol('bitacora', 'bitacora'); subCol('solicitudes', 'solicitudes');
    subDoc('config/parametros', v => { S.D.params = v; }, 'params');
    subDoc('ajustes/gestion', v => { S.D.gestion = v; }, 'gestion');
    subDoc('config/contenido', v => { S.D.contenido = v; }, 'contenido');
  } else if(S.me.id && validId(S.me.id)){
    subDoc('config/parametros', v => { S.D.params = v; }, 'params');
    subDoc('config/contenido', v => { S.D.contenido = v; }, 'contenido');
    subDoc('expedientes/' + S.me.id, v => { S.mine.expediente = v; }, 'expediente');
    subDoc('avance/' + S.me.id, v => { S.mine.avance = v; }, 'avance');
    subDoc('agenda/' + S.me.id, v => { S.mine.agenda = v; }, 'agenda');
    subDoc('marcas/' + S.me.id, v => { S.mine.marcas = v; }, 'marcas');
    subDoc('solicitudes/' + S.me.id, v => { S.mine.solicitud = v; }, 'solicitud');
  }
}
function cargado(keys){ return keys.every(k => S.loaded.has(k)); }
/* contenido efectivo de un módulo: el del código, con los ajustes guardados en config/contenido */
function contenidoDe(mid){ return contenidoModulo(mid, S.D.contenido && S.D.contenido.modulos); }

/* ---------- expedientes: proyección determinista ----------
   Cada técnico lee una copia (expedientes/{uid}) porque no puede leer personas/.
   Cualquier administración con la página abierta la recalcula desde personas/ y
   escribe solo lo que difiere, así un cambio hecho por otra vía no deja al técnico
   viendo un estado viejo. Una escritura por documento y solo si cambió. */
let RECON_T = null, RECON_CORRIENDO = false;
function programarReconciliacion(){
  if(S.role !== 'admin' || S.preview || S.readOnly) return;
  clearTimeout(RECON_T);
  RECON_T = setTimeout(reconciliarExpedientes, 1500);
}
async function reconciliarExpedientes(){
  if(RECON_CORRIENDO || S.role !== 'admin' || S.preview || S.readOnly) return;
  if(!cargado(['personas','duos','expedientes','params','sesiones'])) return;
  RECON_CORRIENDO = true;
  try {
    const c = ctx();
    for(const p of c.personas){
      if(!p.uid || !validId(p.uid)) continue;
      const cur = S.D.expedientes[p.uid];
      if(!cur || stableJSON(cur) !== stableJSON(proyectarExpediente(p, c))) await syncExpediente(p.id);
    }
  } catch(e){ console.warn('reconciliación', e); }
  finally { RECON_CORRIENDO = false; }
}

/* ---------- kiosco bloqueado ----------
   El kiosco corre en un equipo de Lumine con la cuenta de administración abierta.
   Mientras está activo, la navegación queda encerrada en #kiosco y salir pide el PIN
   que definió el Responsable Técnico al abrirlo. Vive en sessionStorage: cerrar la
   pestaña lo termina. */
const KIOSK_KEY = 'lh-kiosco';
function hashPin(pin){ return String(semillaDe('lumine-kiosco:' + pin)); }
function kioscoBloqueado(){ try { return !!JSON.parse(sessionStorage.getItem(KIOSK_KEY) || 'null'); } catch(e){ return !!S.kioskMem; } }
function activarKiosco(pin, sid){
  const v = { h: hashPin(pin), sid: sid || null, desde: new Date().toISOString() };
  S.kioskMem = v;
  try { sessionStorage.setItem(KIOSK_KEY, JSON.stringify(v)); } catch(e){}
}
function pinKioscoOk(pin){ let v = null; try { v = JSON.parse(sessionStorage.getItem(KIOSK_KEY) || 'null'); } catch(e){} v = v || S.kioskMem; return !!v && v.h === hashPin(pin); }
function desactivarKiosco(){ S.kioskMem = null; try { sessionStorage.removeItem(KIOSK_KEY); } catch(e){} }

/* ---------- vista previa de administración ("ver como") ----------
   Quien administra no tiene otra cuenta para ver lo que ve un postulante o un técnico.
   La vista previa monta una base en memoria con los mismos permisos de un Colaborador
   (nivel interact) y una copia del expediente elegido: nada de lo que se haga ahí
   se escribe en la base real. */
async function iniciarVistaPrevia(tipo, pid){
  if(S.role !== 'admin' && !S.preview) throw new Error('Solo administración puede usar la vista previa');
  if(!S.preview) S.real = { db:S.db, user:S.user, me:S.me, D:S.D };
  const R = S.real;
  S.D = R.D; // ctx() se calcula sobre los datos reales
  const uid = 'u_vista_previa';
  const docs = {};
  if(R.D.params) docs['config/parametros'] = JSON.parse(JSON.stringify(R.D.params));
  if(R.D.contenido) docs['config/contenido'] = JSON.parse(JSON.stringify(R.D.contenido));
  let nombre = 'Postulante de prueba';
  if(tipo === 'tecnico'){
    const p = R.D.personas[pid]; if(!p) throw new Error('Persona no encontrada');
    nombre = p.nombre;
    const c = Object.assign(ctx(), { P: R.D.personas });
    docs['expedientes/' + uid] = proyectarExpediente(p, c);
    if(p.uid && R.D.avance[p.uid]) docs['avance/' + uid] = JSON.parse(JSON.stringify(R.D.avance[p.uid]));
  }
  const mem = new MemDB(DB_RULES, { level:'interact', id:uid });
  mem.load(docs);
  const dir = { [uid]: { name: nombre, color:'#697177' } };
  S.db = mem; S.user = new MemUser(dir, { level:'interact', id:uid });
  S.preview = { tipo, pid: pid || null, nombre };
  S.mine = { expediente:null, avance:null, agenda:null, marcas:null, solicitud:null };
  S.D = { personas:{}, sesiones:{}, duos:{}, registros:{}, params:null, gestion:null, contenido:null, avance:{}, marcas:{}, agenda:{}, expedientes:{}, bitacora:{}, solicitudes:{} };
  for(const k of Object.keys(UI)) if(/^(postular|prac-|esc-|sim-|mod-)/.test(k)) delete UI[k];
  await identificar();
  S.role = 'tecnico';
  suscribir();
  go(tipo === 'tecnico' ? 'ruta' : 'postular');
}
async function salirVistaPrevia(){
  if(!S.preview) return;
  const R = S.real; S.real = null; S.preview = null;
  S.db = R.db; S.user = R.user; S.me = R.me; S.D = R.D;
  S.mine = { expediente:null, avance:null, agenda:null, marcas:null, solicitud:null };
  S.role = 'admin';
  suscribir();
  go('entrar');
}

/* ---------- identidad y rol ---------- */
async function identificar(){
  const u = S.user;
  if(!u){ S.me = { id:null, name:'', level:'none', isOwner:false, canEdit:false }; return; }
  const [isOwner, canEdit, me] = await Promise.all([u.isOwner(), u.canEdit(), u.me()]);
  S.me = { id: me.id, name: me.name || '', color: me.color, isOwner: !!isOwner, canEdit: !!canEdit, level: isOwner ? 'owner' : canEdit ? 'admin' : 'interact' };
  if(me.id) PROFILES[me.id] = { name: me.name || '', color: me.color };
}
function decidirRol(){
  if(!S.db) return 'sindb';
  if(S.me.canEdit || S.me.isOwner) return 'admin';
  if(!S.me.id || !validId(S.me.id)) return 'anonimo';
  return 'tecnico'; // técnico o postulante: se distingue al llegar el expediente
}
function esPostulante(){ return S.role === 'tecnico' && S.loaded.has('expediente') && !S.mine.expediente; }
function esFormador(){ return S.role === 'tecnico' && S.mine.agenda && Object.keys(S.mine.agenda.sesiones || {}).length > 0; }

/* ---------- arranque de cada modo ---------- */
function demoStorageLoad(){
  try { const raw = localStorage.getItem('lh-demo-v5'); if(!raw) return null; const o = JSON.parse(raw); if(o && o.hoy === S.hoy && o.docs) return o.docs; } catch(e){}
  return null;
}
let demoSaveT = null;
function demoStorageSave(){
  clearTimeout(demoSaveT);
  demoSaveT = setTimeout(() => { try { localStorage.setItem('lh-demo-v5', JSON.stringify({ hoy:S.hoy, docs:S.mem.dump() })); } catch(e){} }, 400);

function demoReset(){
  try { localStorage.removeItem('lh-demo-v5'); } catch(e){}
  S.mem.load(demoSeed(S.hoy));
  toast('Demostración restablecida');
}
async function iniciarDemo(){
  const role = DEMO_ROLES.find(r => r.id === S.demoRole) || DEMO_ROLES[0];
  if(!S.mem){
    S.mem = new MemDB(DB_RULES, role.viewer);
    const saved = demoStorageLoad();
    S.mem.load(saved || demoSeed(S.hoy));

/* =====================================================================
   Lumine Habilita · acciones (toda escritura pasa por aquí)
   Cada acción valida las reglas antes de escribir y deja rastro.
   ===================================================================== */
'use strict';

const nowISO = () => new Date().toISOString();
function stableStr(o){
  if(Array.isArray(o)) return '[' + o.map(stableStr).join(',') + ']';
  if(o && typeof o === 'object') return '{' + Object.keys(o).sort().map(k => JSON.stringify(k) + ':' + stableStr(o[k])).join(',') + '}';
  return JSON.stringify(o === undefined ? null : o);
}
function txt(v, max){ return String(v == null ? '' : v).replace(/[\u0000-\u001f\u007f]/g, ' ').trim().slice(0, max || 200); }
function mustId(id){ if(!validId(id)) throw new Error('Identificador inválido'); return id; }
function requireAdmin(){ if(S.role !== 'admin') throw new Error('Solo administración puede hacer esto'); if(S.readOnly) throw new Error('Tu acceso cambió: la página quedó en solo lectura'); }

/* ---------- operaciones de varios pasos ----------
   La base de claude.ai no tiene transacciones (escrituras last-writer-wins).
   transaccion() guarda cómo estaba cada documento antes de tocarlo y, si un
   paso falla, deshace los anteriores en orden inverso. Si incluso deshacer
   falla, lo deja escrito en la bitácora y Ajustes › Consistencia lo detecta. */
async function leerDoc(path){ try { const s = await S.db.doc(path).get(); return s.exists ? JSON.parse(JSON.stringify(s.data())) : null; } catch(e){ return undefined; } }
async function transaccion(nombre, pasos){
  const hechos = [];
  for(const st of pasos){
    const antes = await leerDoc(st.path);
    try {
      if(st.op === 'set') await W.set(st.path, st.data);
      else if(st.op === 'update') await W.update(st.path, st.data);
      else if(st.op === 'upsert') await W.upsert(st.path, st.data, antes !== null && antes !== undefined);
      else if(st.op === 'del') await W.del(st.path);
      hechos.push({ path: st.path, antes });
    } catch(e){
      const sinDeshacer = [];
      for(const hx of hechos.reverse()){
        try { if(hx.antes === undefined) throw new Error('sin copia'); if(hx.antes === null) await W.del(hx.path); else await W.set(hx.path, hx.antes); }
        catch(e2){ sinDeshacer.push(hx.path); }
      }
      await logEvento('Operación revertida', null, nombre + ': ' + errMsg(e) + (sinDeshacer.length ? ' · sin deshacer: ' + sinDeshacer.join(', ') : ''));
      throw new Error(nombre + ' no se completó' + (hechos.length ? (sinDeshacer.length ? '. Algunos pasos no se pudieron deshacer: revisa Ajustes › Consistencia' : ' y se deshicieron los pasos anteriores') : '') + '. ' + errMsg(e));
    }
  }
}
/* Candado de negocio: una misma acción sobre el mismo objeto no corre dos veces a la vez,
   aunque se llame desde código (no solo desde un botón). */
const CANDADOS = new Set();
async function conCandado(clave, fn){
  if(CANDADOS.has(clave)) throw new Error('Ya se está guardando ese cambio');
  CANDADOS.add(clave);
  try { return await fn(); } finally { CANDADOS.delete(clave); }
}

  const ev = { t: nowISO(), uid: S.me.id || null, a: txt(a, 120), ref: ref ? txt(ref, 80) : null, d: d ? txt(d, 240) : null };
  try { await W.upsert('bitacora/' + mes, { eventos: { [nid('e')]: ev } }, !!S.D.bitacora[mes]); }

/* ---------- validaciones ---------- */
function tiposPosibles(p){
  const out = [];
  if(!p) return out;
  if((p.etapa === 'postulante' || p.etapa === 'tecnico') && !(p.jornada && p.jornada.fecha)) out.push('JT');
  if(p.etapa === 'tecnico'){
    const sig = siguienteNivel(p); if(sig) out.push('N' + sig);
    if((p.nivel || 0) >= 1) out.push('REV');
  }
  return out;
}
function sesionAbiertaDe(pid, tipo){ return sesiones().find(s => s.pid === pid && s.estado === 'abierta' && (!tipo || s.tipo === tipo)) || null; }
function itemsParaNueva(p, tipo){
  if(tipo === 'JT') return mapaPreliminar(p.antecedentes);
  return itemsValidacion(tipo, p);
}
async function crearSesion(o){
  requireAdmin();
  const p = persona(mustId(o.pid));
  if(!p) throw new Error('Persona no encontrada');
  if(!tiposPosibles(p).includes(o.tipo)) throw new Error('Esa validación no corresponde a la etapa de ' + p.nombre);
  if(sesionAbiertaDe(p.id, o.tipo)) throw new Error(p.nombre + ' ya tiene una ' + TIPOS_SESION[o.tipo].l.toLowerCase() + ' abierta');
  const fecha = o.fecha || S.hoy;
  if(!fechaValida(fecha)) throw new Error('La fecha no es válida');
  const permitidos = itemsParaNueva(p, o.tipo);
  const codes = o.codes && o.codes.length ? uniq(o.codes) : permitidos;
  const ajenos = codes.filter(c => !permitidos.includes(c));
  if(ajenos.length) throw new Error('Estas competencias no corresponden a esa validación: ' + ajenos.join(', '));
  if(o.tipo !== 'JT' && !codes.length) throw new Error('No quedan competencias por validar en ese nivel');
  // D8 se valida aquí, no solo en la hoja: sin práctica completa hace falta un motivo escrito
  const d8 = requisitoD8(p, o.tipo, params(), p.uid ? S.D.avance[p.uid] : null);
  if(d8.aplica && d8.listo === false && !motivoValido(o.override)) throw new Error('Sin práctica online completa (faltan ' + d8.faltan.join(', ') + '). Para programar igual, escribe el motivo (D8).');
  const items = {};
  const asig = o.asig || {};
  for(const c of codes){
    if(!C[c]) continue;
    const ev = evaluadorDe(c);
    let a = ev === 'int' ? (asig[c] || null) : null;
    if(a){
      mustId(a);
      const chk = puedeValidar(a, rolEquipo(a), p, Pmap(), duos(), personas(), c);
      if(!chk.ok) throw new Error(C[c].c + ': ' + chk.motivo);
    }
    items[c] = { ev, asig: a, r: null };
  }
  const hist = Object.values(p.historial || {}).filter(h => h.tipo === o.tipo).length;
  const id = nid('s');
  const doc = { id, pid:p.id, tipo:o.tipo, intento: hist + 1, fecha, estado:'abierta', items, creado: nowISO(), creadoPor: S.me.id };
  if(o.tipo === 'JT') doc.basico = { electrica:null, mecanica:null, electronica:null };
  if(d8.aplica && d8.listo === false) doc.override = txt(o.override, 300);
  await W.set('sesiones/' + id, doc);
  S.D.sesiones[id] = doc;
  await publicarAgenda(doc);
  await logEvento('Validación programada', id, TIPOS_SESION[o.tipo].l + ' · ' + p.nombre + (doc.override ? ' · sin práctica completa: ' + doc.override : ''));
  return id;
}
/* Los formadores reciben en su agenda solo sus ítems y el nombre del técnico.
   'antes' son los formadores que tenían algo de esta sesión: si ya no les queda
   ningún ítem, su entrada se marca como reasignada para que no la sigan viendo pendiente. */
async function publicarAgenda(ses, estado, antes){
  const p = persona(ses.pid);
  const porUid = {};
  for(const c of Object.keys(ses.items || {})){ const it = ses.items[c]; if(it.asig && !it.r && rolEquipo(it.asig) === 'formador') (porUid[it.asig] = porUid[it.asig] || {})[c] = { t: C[c].t }; }
  for(const uid of Object.keys(porUid)){
    const prevItems = S.D.agenda[uid] && S.D.agenda[uid].sesiones && S.D.agenda[uid].sesiones[ses.id] && S.D.agenda[uid].sesiones[ses.id].items;
    // 'items' se reemplaza completo: un update anidado no borra claves viejas, así que primero se vacía
    if(prevItems) await W.update('agenda/' + uid, { sesiones: { [ses.id]: { items: null } } });
    await W.upsert('agenda/' + uid, { sesiones: { [ses.id]: { etiqueta: p ? p.nombre : '', tipo: ses.tipo, fecha: ses.fecha, items: porUid[uid], estado: estado || 'pendiente', asignado: nowISO() } } }, !!S.D.agenda[uid]);
  }
  for(const uid of (antes || [])){
    if(porUid[uid]) continue;
    const a = S.D.agenda[uid] && S.D.agenda[uid].sesiones && S.D.agenda[uid].sesiones[ses.id];
    if(a && a.estado === 'pendiente') await W.update('agenda/' + uid, { sesiones: { [ses.id]: { estado:'reasignado', items:null } } });
  }
}
async function cerrarAgenda(ses, estado){

  }

function puedeMarcar(ses, code, modo){
  if(!ses || ses.estado !== 'abierta') return { ok:false, motivo:'La validación no está abierta' };
  if(S.readOnly) return { ok:false, motivo:'Solo lectura' };
  const it = ses.items[code]; if(!it) return { ok:false, motivo:'Ítem no encontrado' };
  const p = persona(ses.pid);
  if(it.ev === 'ext'){
    if(modo !== 'kiosco') return { ok:false, motivo:'Lo marca el evaluador externo en modo kiosco' };
    if(ses.externa && ses.externa.entregada) return { ok:false, motivo:'La evaluación externa ya se entregó. Solo el Responsable Técnico puede reabrirla.' };
    return { ok:true };
  }
  if(modo === 'kiosco') return { ok:false, motivo:'Ítem interno' };
  if(it.asig && it.asig !== S.me.id) return { ok:false, motivo:'Asignado a ' + nombreUid(it.asig) };
  const chk = puedeValidar(S.me.id, miRol(), p, Pmap(), duos(), personas(), code);
  return chk;
}

async function aceptarMarcas(sid, uid){

  for(const c of rec.cods) patch[c] = { r: m.items[c], t: m.enviado || nowISO(), por:{ tipo:'formador', uid, acepta: S.me.id, obs: txt(m.obs, 300) } };
  await transaccion('Aceptar resultados', [
    { path:'sesiones/' + sid, op:'update', data:{ items: patch } },
    { path:'agenda/' + uid, op:'update', data:{ sesiones: { [sid]: { estado:'aceptado' } } } }
  ]);
  await logEvento('Resultados de formador aceptados', sid, nombreUid(uid) + ' · ' + rec.cods.join(', '));
}
function resumenSesion(ses){
  const p = persona(ses.pid);
  const items = Object.keys(ses.items || {});
  const marc = items.filter(c => ses.items[c].r === 's' || ses.items[c].r === 'n').length;
  const bas = ses.tipo === 'JT' ? Object.keys(ses.basico || {}).filter(a => ses.basico[a]).length : 0;
  const totalB = ses.tipo === 'JT' ? 3 : 0;
  let ev = null;
  if(p && /^N[1-4]$/.test(ses.tipo)){
    const n = Number(ses.tipo.slice(1));
    const pre = new Set(preaprobadas(ses.tipo, p));
    const all = COMP.filter(x => x.n === n).map(x => ({ c:x.c, r: ses.items[x.c] ? ses.items[x.c].r : (pre.has(x.c) ? ((p.pauta[x.c] || {}).r === 'j' ? 'j' : 's') : null) }));
    ev = evaluar(all, params().umbralComp);
  } else if(ses.tipo === 'REV'){
    ev = evaluar(items.map(c => ({ c, r: ses.items[c].r })), params().umbralComp);
  } else {
    ev = { completo: marc === items.length && bas === totalB, aprobado:true, fallidas: items.filter(c => ses.items[c].r === 'n') };
  }
  return { total: items.length + totalB, marcados: marc + bas, ev, completo: marc === items.length && bas === totalB };
}
async function cerrarSesion(sid){
  requireAdmin();
  const ses = S.D.sesiones[mustId(sid)];
  if(!ses || ses.estado !== 'abierta') throw new Error('La validación no está abierta');
  const p = persona(ses.pid);
  if(!p) throw new Error('Persona no encontrada');
  const rs = resumenSesion(ses);
  if(!rs.completo) throw new Error('Faltan ítems por marcar');
  const fecha = S.hoy;
  const codes = Object.keys(ses.items);
  const pautaPatch = {};
  const patch = { actualizado: nowISO() };
  let resultado;
  if(ses.tipo === 'JT'){
    const est = {}; for(const c of codes) est[c] = ses.items[c].r;
    for(const c of codes) if(est[c] === 's') pautaPatch[c] = { r:'j', t:fecha, sid };
    patch.jornada = { fecha, basico: Object.assign({}, ses.basico), estaciones: est, sesion: sid };
    const dem = codes.filter(c => est[c] === 's');
    resultado = { aprobado:true, demostradas: dem, fallidas: codes.filter(c => est[c] === 'n'), fecha };
  } else {
    const n = ses.tipo === 'REV' ? null : Number(ses.tipo.slice(1));
    if(n && (p.nivel || 0) !== n - 1) throw new Error(p.nombre + ' tiene nivel ' + (p.nivel || 0) + ': no corresponde validar el nivel ' + n);
    for(const c of codes) pautaPatch[c] = { r: ses.items[c].r, t: fecha, sid, n: ses.intento };
    const hid = nid('h');
    patch.historial = { [hid]: { tipo: ses.tipo, intento: ses.intento, fecha, aprobado: rs.ev.aprobado, fallidas: rs.ev.fallidas.filter(c => codes.includes(c)), externa: codes.some(c => ses.items[c].ev === 'ext'), sid } };
    if(rs.ev.aprobado && n){ patch.nivel = n; patch.fechasNivel = { [n]: fecha }; }
    if(rs.ev.aprobado && ses.tipo === 'REV') patch.suspendidoAT = false;
    resultado = { aprobado: rs.ev.aprobado, fallidas: rs.ev.fallidas, fecha, comp: rs.ev.comp };
  }
  patch.pauta = pautaPatch;
  const pasos = [
    { path:'personas/' + p.id, op:'update', data: patch },
    { path:'sesiones/' + sid, op:'update', data:{ estado:'cerrada', resultado, cerrado: nowISO(), cerradoPor: S.me.id } }
  ];
  for(const uid of Object.keys(S.D.agenda)){ const a = S.D.agenda[uid]; if(a && a.sesiones && a.sesiones[sid]) pasos.push({ path:'agenda/' + uid, op:'update', data:{ sesiones: { [sid]: { estado:'cerrada' } } } }); }
  await transaccion('Cierre de la validación', pasos);
  // estado local inmediato para la proyección
  const np = JSON.parse(JSON.stringify(p));
  np.pauta = Object.assign({}, np.pauta, pautaPatch);
  if(patch.historial) np.historial = Object.assign({}, np.historial, patch.historial);
  if(patch.jornada) np.jornada = patch.jornada;
  if(patch.nivel) np.nivel = patch.nivel;
  if(patch.fechasNivel) np.fechasNivel = Object.assign({}, np.fechasNivel, patch.fechasNivel);
  if(patch.suspendidoAT === false) np.suspendidoAT = false;
  S.D.personas[p.id] = np;
  await syncMuchos([p.id, companero(p.id, duos())]);
  const msg = ses.tipo === 'JT' ? 'Jornada cerrada: ' + resultado.demostradas.length + ' de ' + codes.length + ' estaciones demostradas'
    : resultado.aprobado ? TIPOS_SESION[ses.tipo].l + ' aprobada' : TIPOS_SESION[ses.tipo].l + ' reprobada: repite ' + resultado.fallidas.join(', ');
  await logEvento(ses.tipo === 'JT' ? 'Jornada técnica cerrada' : resultado.aprobado ? 'Validación aprobada' : 'Validación reprobada', sid, p.nombre + ' · ' + msg);
  return { resultado, msg };
}

  // D13 se calcula aquí con la fecha del duo y el parámetro vigente; no se confía en lo que diga la pantalla
  const { anticipado, libreDesde } = separacionAnticipada(d, params(), S.hoy);
  if(anticipado && !motivoValido(motivo)) throw new Error('Antes del ' + fechaLarga(libreDesde) + ' solo se separa por seguridad o conflicto: escribe el motivo (D13)');
