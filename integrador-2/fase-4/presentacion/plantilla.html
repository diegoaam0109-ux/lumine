<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lumine · Fase 4 · Plan financiero</title>
<style>
:root{
  --negro:#020304; --tinta:#1d1d1f; --gris:#5f6368; --gris-o:#8b9598; --linea:#2e3438;
  --celeste:#22B8F0; --celeste-t:#0A6F9E; --claro:#f2f6fa; --rojo:#F87171;
  --titular:'Michroma',sans-serif; --acento:'ArchivoXL',serif; --texto:'Archivo',system-ui,sans-serif;
  --cifra:'ArchivoC','Archivo',sans-serif; --etiqueta:'ArchivoSC','Archivo',sans-serif; --mono:'Plex',ui-monospace,monospace;
  /* layout: escenario 16:9 de 1920 × 1080 escalado al ancho; nota de diseño e índice debajo */
  color-scheme:dark;
}
@font-face{font-family:'Michroma';src:url(__F_MICHROMA__) format('truetype')}
@font-face{font-family:'ArchivoXL';font-style:italic;src:url(__F_ACENTO__) format('truetype')}
@font-face{font-family:'Archivo';font-weight:400;src:url(__F_ARCHIVO__) format('truetype')}
@font-face{font-family:'Archivo';font-weight:700;src:url(__F_ARCHIVOB__) format('truetype')}
@font-face{font-family:'ArchivoC';font-weight:700;src:url(__F_COND__) format('truetype')}
@font-face{font-family:'ArchivoSC';font-weight:500;src:url(__F_SEMIC__) format('truetype')}
@font-face{font-family:'Plex';src:url(__F_MONO__) format('truetype')}
*{box-sizing:border-box;margin:0;padding:0}
html,body{background:#06080a;color:#ececec;font-family:var(--texto)}
body{padding:20px 16px 48px}
.pagina{max-width:1280px;margin:0 auto;display:grid;gap:18px}
.cabeza{display:flex;justify-content:space-between;align-items:baseline;gap:16px;flex-wrap:wrap}
.cabeza h1{font-family:var(--titular);font-weight:400;font-size:18px;letter-spacing:.04em;text-wrap:balance}
.cabeza h1 em{font-family:var(--acento);color:var(--celeste);font-size:19px}
.cabeza p{font-family:var(--mono);font-size:12px;color:var(--gris-o);letter-spacing:.12em;text-transform:uppercase}
.marco{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden;border:1px solid #1f2427;background:var(--negro)}
.deck{position:absolute;left:0;top:0;width:1920px;height:1080px;transform-origin:0 0}
.lam{position:absolute;inset:0;opacity:0;pointer-events:none;transition:opacity .45s ease;overflow:hidden}
.lam.vis{opacity:1;pointer-events:auto}
.oscura{background:radial-gradient(1100px 700px at 50% 60%,#0b1820 0%,var(--negro) 70%);color:#ececec}
.oscura::before,.clara::before{content:"";position:absolute;inset:0;pointer-events:none;
  background-image:linear-gradient(rgba(34,184,240,.05) 1px,transparent 1px),linear-gradient(90deg,rgba(34,184,240,.05) 1px,transparent 1px);
  background-size:64px 64px;-webkit-mask-image:radial-gradient(900px 600px at 60% 50%,#000 30%,transparent 80%);mask-image:radial-gradient(900px 600px at 60% 50%,#000 30%,transparent 80%)}
.clara{background:linear-gradient(180deg,#f7fafc 0%,#e8f0f6 100%);color:var(--tinta)}
.clara::before{background-image:linear-gradient(rgba(10,111,158,.06) 1px,transparent 1px),linear-gradient(90deg,rgba(10,111,158,.06) 1px,transparent 1px)}
.logo{position:absolute;left:96px;top:58px;height:34px}
.inst{position:absolute;right:96px;top:66px;font-family:var(--mono);font-size:20px;letter-spacing:.3em;color:var(--gris-o)}
.clara .inst{color:var(--gris)}
.ceja{position:absolute;left:96px;top:168px;font-family:var(--etiqueta);font-weight:500;font-size:26px;letter-spacing:.28em;color:var(--celeste);text-transform:uppercase}
.clara .ceja{color:var(--celeste-t)}
.ceja b{font-weight:500;color:var(--gris-o);margin-left:18px}
.clara .ceja b{color:var(--gris)}
.tit{position:absolute;left:96px;top:212px;right:96px;font-family:var(--titular);font-weight:400;font-size:70px;line-height:1.08;letter-spacing:.01em;text-transform:uppercase}
.tit em{font-family:var(--acento);text-transform:none;color:var(--celeste);font-size:76px;letter-spacing:0}
.clara .tit em{color:var(--celeste-t)}
.fuente{position:absolute;left:96px;bottom:42px;right:220px;font-family:var(--texto);font-size:20px;color:var(--gris-o)}
.clara .fuente{color:var(--gris)}
.num{position:absolute;right:96px;bottom:42px;font-family:var(--mono);font-size:20px;color:var(--gris-o)}
.ruta{position:absolute;left:50%;top:44px;width:360px;height:64px;transform:translateX(-50%)}
.mono{font-family:var(--mono)}
.cifra{font-family:var(--cifra);font-weight:700;letter-spacing:-.01em;font-variant-numeric:tabular-nums}
.et{font-family:var(--etiqueta);font-weight:500;letter-spacing:.18em;text-transform:uppercase}
.txt{font-family:var(--texto);font-size:30px;line-height:1.4}
svg text{font-variant-numeric:tabular-nums}
.anim{transition:all 1.1s cubic-bezier(.2,.7,.2,1)}
.lam:not(.on) .sube{transform:translateY(30px);opacity:0}
.sube{transition:transform .8s cubic-bezier(.2,.7,.2,1),opacity .8s}
.d1{transition-delay:.15s}.d2{transition-delay:.35s}.d3{transition-delay:.55s}.d4{transition-delay:.75s}.d5{transition-delay:.95s}.d6{transition-delay:1.15s}
.traza{transition:stroke-dashoffset 2.2s cubic-bezier(.4,0,.2,1)}
.barra{transform-box:fill-box;transform-origin:50% 100%;transition:transform .9s cubic-bezier(.2,.7,.2,1)}
.barra.neg{transform-origin:50% 0%}
.lam:not(.on) .barra{transform:scaleY(0)}
.aguja{transform-box:view-box;transition:transform 2s cubic-bezier(.25,.9,.25,1.05)}
.controles{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.controles button{font-family:var(--mono);font-size:13px;letter-spacing:.08em;background:#0e1316;color:#ececec;border:1px solid #2e3438;padding:9px 14px;cursor:pointer}
.controles button:hover{border-color:var(--celeste)}
.controles button:focus-visible,.indice button:focus-visible{outline:2px solid var(--celeste);outline-offset:2px}
.contador{font-family:var(--mono);font-size:13px;color:var(--gris-o);margin-left:auto}
.nota{display:grid;grid-template-columns:minmax(0,180px) minmax(0,1fr);gap:16px;border-top:1px solid #1f2427;padding-top:14px}
.nota .rol{font-family:var(--mono);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--celeste)}
.nota p{font-size:15px;line-height:1.6;color:#c9d0d3;max-width:72ch}
.indice{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:6px}
.indice button{text-align:left;background:transparent;color:#c9d0d3;border:1px solid #1f2427;padding:8px 10px;font-family:var(--texto);font-size:13px;cursor:pointer;display:flex;gap:10px;align-items:center}
.indice button span{font-family:var(--mono);font-size:11px;color:var(--gris-o)}
.indice button i{width:10px;height:10px;flex:none;border:1px solid #4b5154}
.indice button i.c{background:#e8f0f6}.indice button i.o{background:#020304}
.indice button.act{border-color:var(--celeste);color:#fff}
@media (max-width:640px){.nota{grid-template-columns:1fr}}
@media (prefers-reduced-motion:reduce){.lam,.sube,.traza,.barra,.aguja,.anim{transition:none!important}}
/* El visor compartido aloja la lámina sin la interfaz de revisión. */
html.embebida, html.embebida body { height:100%; overflow:hidden; padding:0; background:#020304; }
.embebida .pagina { position:fixed; inset:0; max-width:none; display:grid; place-items:center; margin:0; }
.embebida .pagina > :not(.marco) { display:none; }
.embebida .marco { width:min(100vw,177.777778vh); height:min(56.25vw,100vh); border:0; }
</style>
<script>if(new URLSearchParams(location.search).has('embed'))document.documentElement.classList.add('embebida');</script>
</head>
<body>
<main class="pagina">
  <header class="cabeza">
    <h1>Fase 4 · Plan financiero <em>propuesta visual, versión 2</em></h1>
    <p>Integrador II · Grupo 1 · cifras del libro v7</p>
  </header>
  <div class="marco" id="marco" aria-roledescription="presentación"><div class="deck" id="deck"></div></div>
  <div class="controles">
    <button id="ant" aria-label="Lámina anterior">← Anterior</button>
    <button id="sig" aria-label="Lámina siguiente">Siguiente →</button>
    <button id="rep">Repetir animación</button>
    <span class="contador" id="cont">01 / 17</span>
  </div>
  <section class="nota" aria-live="polite"><div class="rol" id="rol"></div><p id="nota"></p></section>
  <nav class="indice" id="indice" aria-label="Índice de láminas"></nav>
</main>
<script>
const CAJA = __CAJA__;
const LOGO_C = '__LOGO_C__', LOGO_O = '__LOGO_O__', PORTADA = '__PORTADA__', CIERRE = '__CIERRE__';
const NS = 'http://www.w3.org/2000/svg';
const f1 = (x, d = 1) => x.toLocaleString('es-CL', { minimumFractionDigits: d, maximumFractionDigits: d });
const C = { cel: '#22B8F0', celT: '#0A6F9E', tinta: '#1d1d1f', gris: '#5f6368', grisO: '#8b9598', linea: '#2e3438', lineaC: '#c8cace', rojo: '#F87171', blanco: '#ececec' };

/* ------------------------------------------------------------------ piezas comunes */
function chrome(n, ceja, sub, titulo, fuente, clara, sinRuta) {
  return `<img class="logo" src="${clara ? LOGO_O : LOGO_C}" alt="Lumine">
  ${sinRuta ? '' : '<svg class="ruta" viewBox="0 0 360 64" aria-hidden="true"></svg>'}
  <div class="inst">INTEGRADOR II · ICMA 1001 · GRUPO 1</div>
  <div class="ceja">${ceja}<b>${sub}</b></div>
  <h2 class="tit">${titulo}</h2>
  <div class="fuente">Fuente: ${fuente}</div><div class="num">${typeof n === 'string' ? n : String(n).padStart(2, '0')}</div>`;
}
function testigos(encendidos, claro, x, y, w) {
  const obj = [
    ['Crear valor', 'VAN puro a Ku mayor que cero'],
    ['Rentar al socio', 'TIR financiada mayor que Ke'],
    ['Recuperar el aporte', 'Payback descontado antes del año 5'],
    ['Operar sobre el equilibrio', 'Desde el segundo año'],
    ['Endeudarse con mesura', 'D/P hasta 42,37%, la industria'],
  ];
  const col = claro ? C.tinta : C.blanco, sub = claro ? C.gris : C.grisO;
  return `<div style="position:absolute;left:${x}px;top:${y}px;width:${w}px;display:grid;grid-template-columns:repeat(5,1fr);gap:24px">` +
    obj.map((o, i) => `<div class="sube d${i + 1}" style="border-top:2px solid ${encendidos ? C.cel : (claro ? '#c8cace' : C.linea)};padding-top:28px">
      <svg width="96" height="96" viewBox="0 0 64 64" style="display:block;margin-bottom:28px">
        <circle cx="32" cy="32" r="28" fill="${encendidos ? C.cel : 'none'}" stroke="${encendidos ? C.cel : (claro ? '#a1a5aa' : '#4b5154')}" stroke-width="3"/>
        ${encendidos ? '<path d="M19 33 l9 9 l18 -20" fill="none" stroke="#031015" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>' : `<text x="32" y="41" text-anchor="middle" font-family="Plex" font-size="22" fill="${claro ? '#5f6368' : '#8b9598'}">0${i + 1}</text>`}
      </svg>
      <div style="font-family:var(--texto);font-weight:700;font-size:40px;line-height:1.15;color:${col}">${o[0]}</div>
      <div style="font-family:var(--texto);font-size:28px;line-height:1.35;color:${sub};margin-top:14px">${o[1]}</div></div>`).join('') + '</div>';
}
function el(tag, at, padre) { const e = document.createElementNS(NS, tag); for (const k in at) e.setAttribute(k, at[k]); if (padre) padre.appendChild(e); return e; }
function txt(padre, x, y, s, at = {}) { const t = el('text', Object.assign({ x, y }, at), padre); t.textContent = s; return t; }

/* ------------------------------------------------------------------ láminas */
const L = [];
L.push({ rol: 'Portada · negro', clara: false, nota: 'Misma familia que la Fase 3 (auto en rayos X, Michroma y acento en itálica celeste), para que en la presentación final las fases se lean como un solo trabajo. Cambia la promesa: esta vez la pregunta es si el negocio rinde.',
  html: () => `<img src="${PORTADA}" alt="" style="position:absolute;inset:0;width:100%;height:100%;object-fit:cover">
  <img class="logo" src="${LOGO_C}" alt="Lumine"><div class="inst">UNAB · NOVIEMBRE 2026</div>
  <div class="ceja" style="top:150px">CAPÍTULO IV<b>PLAN FINANCIERO</b></div>
  <h2 class="tit" style="top:200px;font-size:96px">LUMINE MOTORS</h2>
  <div class="sube d1" style="position:absolute;left:96px;top:330px;font-family:var(--acento);font-style:italic;font-size:64px;color:var(--celeste)">¿rinde el negocio? · Fase 4</div>
  <div class="sube d2" style="position:absolute;left:96px;bottom:150px;font-size:28px;line-height:1.5;color:#c9d0d3"><b style="color:#fff">Integrador II · ICMA 1001 · Grupo 1</b><br>Universidad Andrés Bello · Facultad de Economía y Negocios · Ingeniería Comercial<br>Profesor: Roberto Brito<br>Diego Alarcón · Benjamín Torres · Lukas Verdugo</div>` });

L.push({ rol: 'Método · blanco', clara: true, nota: 'Los cinco objetivos se presentan como testigos del tablero, apagados. Quedan pendientes a la vista y se encienden en el cierre: la presentación promete algo al inicio y lo cobra al final.',
  html: (n) => chrome(n, 'Plan financiero', 'Objetivos', 'CINCO METAS <em>por cumplir</em>', 'Capítulo IV, objetivos financieros (criterios SMART).', true) + testigos(false, true, 96, 430, 1728) });

L.push({ rol: 'Método · blanco', clara: true, nota: 'Una sola barra responde quién pone la plata; abajo, las tres etapas del financiamiento como una línea de tiempo. Ninguna tabla: los detalles del crédito van como etiquetas de tablero.',
  html: (n) => chrome(n, 'Plan financiero', 'Estrategias de financiamiento', '¿QUIÉN PONE <em>la plata?</em>', 'Hojas 5 y 5.1 del libro de cálculo. Total del año 0 en el flujo financiado (costo del calendario a Ke).', true) + `
  <div class="sube d1" style="position:absolute;left:96px;top:420px;width:1728px">
    <div style="display:flex;justify-content:space-between;align-items:baseline;margin-bottom:22px"><span class="et" style="font-size:24px;color:var(--gris)">Año 0 · inversión total</span><span class="cifra" style="font-size:72px">$402,6 M</span></div>
    <div style="display:flex;height:120px">
      <div class="anim" id="bSoc" style="width:0;background:#1d1d1f;color:#fff;display:flex;align-items:center;padding:0 36px;justify-content:space-between;overflow:hidden;white-space:nowrap"><span class="et" style="font-size:24px">Socios · 70%</span><span class="cifra" style="font-size:60px">$280,0 M</span></div>
      <div class="anim" id="bBan" style="width:0;background:var(--celeste);color:#031015;display:flex;align-items:center;padding:0 36px;justify-content:space-between;overflow:hidden;white-space:nowrap"><span class="et" style="font-size:24px">Banco · 30%</span><span class="cifra" style="font-size:60px">$122,6 M</span></div>
    </div>
    <div style="display:flex;justify-content:flex-end;gap:40px;margin-top:18px;font-family:var(--mono);font-size:22px;color:var(--gris)"><span>FRANCÉS · 5 AÑOS · 1 DE GRACIA</span><span>Kd 7,86%</span><span>CON GARANTÍA ESTATAL</span></div>
  </div>
  <div style="position:absolute;left:96px;top:800px;width:1728px;display:grid;grid-template-columns:repeat(3,1fr);gap:32px">
    ${[['Antes', 'Piloto y espera de la norma', 'Fondo de I+D por postular, fuera de esta evaluación'], ['Al abrir', 'Etapa comercial', 'Socios y banco, en la proporción de la industria'], ['Desde el mes 13', 'Proveedor', '30% al pedir, saldo 30 días después del embarque']]
      .map((e, i) => `<div class="sube d${i + 3}" style="border-top:2px solid ${i === 1 ? 'var(--celeste-t)' : '#c8cace'};padding-top:20px"><div class="et" style="font-size:22px;color:var(--celeste-t)">${e[0]}</div><div style="font-weight:700;font-size:32px;margin:8px 0 6px">${e[1]}</div><div style="font-size:24px;color:var(--gris);line-height:1.35">${e[2]}</div></div>`).join('')}
  </div>`,
  on: (s) => { s.querySelector('#bSoc').style.width = '69.5%'; s.querySelector('#bBan').style.width = '30.5%'; },
  off: (s) => { s.querySelector('#bSoc').style.width = '0'; s.querySelector('#bBan').style.width = '0'; } });

L.push({ rol: 'Método · blanco', clara: true, nota: 'Despiece de la inversión: cada bloque mide lo que cuesta, con rótulos numerados como el explorador del kit en la página comercial. El público ve de inmediato que el capital de trabajo pesa más que los equipos.',
  html: (n) => chrome(n, 'Plan financiero', 'Inversión inicial', '$402,1 M <em>antes de la primera venta</em>', 'Hojas 1, 1.1 y 3 del libro de cálculo. Pesos de 2026, netos de IVA.', true) + `<svg id="mapa" viewBox="0 0 1728 600" style="position:absolute;left:96px;top:380px;width:1728px;height:600px"></svg>`,
  dibujar: (s) => {
    const g = s.querySelector('#mapa');
    const B = [ // x, y, w, h en px del svg, color, rótulo, nombre, monto
      [0, 0, 800, 600, '#1d1d1f', '01', 'Capital de trabajo adicional', '180,8', 'Mayor déficit de caja · mes 10'],
      [808, 0, 520, 360, C.cel, '02', 'Activo fijo', '88,4', 'Dinamómetro, local, bodega, equipos'],
      [1336, 0, 392, 360, '#7fcdf0', '03', 'Activo nominal', '77,0', 'Puesta en marcha y software'],
      [808, 368, 680, 232, '#a1a5aa', '04', 'Capital de trabajo al abrir', '49,6', 'Primeros kits e IVA'],
      [1496, 368, 232, 116, '#c8cace', '05', 'Garantía', '3,6', ''],
      [1496, 492, 232, 108, '#dde1e5', '06', 'Costo financiero', '2,7', ''],
    ];
    B.forEach((b, i) => {
      const gr = el('g', { class: 'sube d' + (i + 1) }, g);
      el('rect', { x: b[0], y: b[1], width: b[2], height: b[3], fill: b[4] }, gr);
      const oscuro = i === 0;
      const ct = oscuro ? '#fff' : '#1d1d1f', cs = oscuro ? '#a1a5aa' : (i < 3 ? '#062a3a' : '#5f6368');
      el('rect', { x: b[0] + 24, y: b[1] + 24, width: 46, height: 34, fill: oscuro ? C.cel : '#1d1d1f' }, gr);
      txt(gr, b[0] + 47, b[1] + 48, b[5], { 'text-anchor': 'middle', 'font-family': 'Plex', 'font-size': 20, fill: oscuro ? '#031015' : '#fff' });
      if (b[3] >= 200) {
        txt(gr, b[0] + 28, b[1] + b[3] - (b[8] ? 100 : 60), '$' + b[7] + ' M', { 'font-family': 'ArchivoC', 'font-weight': 700, 'font-size': b[2] > 700 ? 120 : 84, fill: ct });
        txt(gr, b[0] + 28, b[1] + b[3] - (b[8] ? 58 : 24), b[6], { 'font-family': 'Archivo', 'font-weight': 700, 'font-size': 28, fill: ct });
        if (b[8]) txt(gr, b[0] + 28, b[1] + b[3] - 22, b[8], { 'font-family': 'Archivo', 'font-size': 24, fill: cs });
      } else {
        txt(gr, b[0] + 84, b[1] + 50, '$' + b[7] + ' M', { 'font-family': 'ArchivoC', 'font-weight': 700, 'font-size': 36, fill: ct });
        txt(gr, b[0] + 24, b[1] + b[3] - 18, b[6], { 'font-family': 'Archivo', 'font-size': 22, fill: cs });
      }
    });
  } });

L.push({ rol: 'Método · blanco', clara: true, nota: 'El capital de trabajo contado con la caja real, mes a mes: la línea baja hasta el valle del mes 10 y ese punto es el déficit acumulado máximo. El salto del mes 13 muestra el plazo del proveedor. La línea se dibuja en vivo.',
  html: (n) => chrome(n, 'Plan financiero', 'Capital de trabajo', 'EL VALLE <em>que hay que financiar</em>', 'Anexo 3 del libro de cálculo: caja operativa acumulada de 60 meses. Método del déficit acumulado máximo.', true) + `<svg id="caja" viewBox="0 0 1728 600" style="position:absolute;left:96px;top:380px;width:1728px;height:600px"></svg>`,
  dibujar: (s) => {
    const g = s.querySelector('#caja'), x0 = 90, x1 = 1440, yMin = -330, yMax = Math.max(560, Math.ceil(Math.max(...CAJA) / 100) * 100 + 60), h = 520, top = 10;
    const X = (m) => x0 + (m - 1) * (x1 - x0) / 59, Y = (v) => top + (yMax - v) * h / (yMax - yMin);
    for (const v of [-200, 0, 200, 400, 600].filter((v) => v < yMax)) { el('line', { x1: x0, x2: x1, y1: Y(v), y2: Y(v), stroke: v === 0 ? '#1d1d1f' : '#c8cace', 'stroke-width': v === 0 ? 2 : 1 }, g); txt(g, x0 - 16, Y(v) + 8, (v > 0 ? '+' : '') + v, { 'text-anchor': 'end', 'font-family': 'Plex', 'font-size': 20, fill: C.gris }); }
    for (let a = 1; a <= 5; a++) txt(g, X(a * 12 - 6), 586, 'AÑO ' + a, { 'text-anchor': 'middle', 'font-family': 'Plex', 'font-size': 20, fill: C.gris });
    const d = CAJA.map((v, i) => (i ? 'L' : 'M') + X(i + 1).toFixed(1) + ' ' + Y(v).toFixed(1)).join(' ');
    el('path', { d: d + ` L${X(60)} ${Y(0)} L${X(1)} ${Y(0)} Z`, fill: 'rgba(10,111,158,.07)' }, g);
    const p = el('path', { d, fill: 'none', stroke: C.celT, 'stroke-width': 5, class: 'traza', 'stroke-linejoin': 'round' }, g);

/* ------------------------------------------------------------------ gráficos reutilizables */
function barrasJ(g, flujo, acum, clara, tablero, payback) {
  const x0 = 120, paso = 190, yMin = -500, yMax = 450, top = 10, h = 500;
  const Y = (v) => top + (yMax - v) * h / (yMax - yMin), X = (i) => x0 + i * paso;

    const xp = X(4) + (payback - 4) * paso;

    el('line', { x1: xp, x2: xp, y1: Y(0) - 20, y2: Y(0) - 70, stroke: '#fff', 'stroke-width': 2 }, fin);
    txt(fin, xp, Y(0) - 84, 'cruza el cero', { 'text-anchor': 'middle', 'font-family': 'Plex', 'font-size': 20, fill: '#fff' });
  }

    txt(t, 1728, 60 + i * 170, r[0], { 'text-anchor': 'end', 'font-family': 'ArchivoC', 'font-weight': 700, 'font-size': i ? 64 : 80, fill: i ? sec : (clara ? C.celT : '#fff') });
    txt(t, 1728, 100 + i * 170, r[1], { 'text-anchor': 'end', 'font-family': 'Archivo', 'font-size': 24, fill: sec });
  });
}
function reloj(g, vmin, vmax, agujas, marcas, valor, etiqueta, pie, filas) {
  const cx = filas ? 560 : 864, cy = 360, R = 300, a0 = -120, a1 = 120;
  const ang = (v) => a0 + (v - vmin) / (vmax - vmin) * (a1 - a0);
  const pt = (a, r) => [cx + r * Math.sin(a * Math.PI / 180), cy - r * Math.cos(a * Math.PI / 180)];
  const arco = (a, b, r) => { const p = pt(a, r), q = pt(b, r); return `M${p[0]} ${p[1]} A${r} ${r} 0 ${b - a > 180 ? 1 : 0} 1 ${q[0]} ${q[1]}`; };
  el('path', { d: arco(a0, a1, R), fill: 'none', stroke: '#1a1e22', 'stroke-width': 30 }, g);
  const act = agujas[agujas.length - 1].v;
  const pa = el('path', { d: arco(a0, ang(act), R), fill: 'none', stroke: C.cel, 'stroke-width': 30, class: 'traza' }, g); pa.dataset.traza = 1;
  for (let v = vmin; v <= vmax; v += (vmax - vmin) / (filas ? 7 : 6)) {
    const a = ang(v), p = pt(a, R - 34), q = pt(a, R - 54), l = pt(a, R - 92);

    txt(g, l[0], l[1] + 8, Math.round(v) + '%', { 'text-anchor': 'middle', 'font-family': 'Plex', 'font-size': 20, fill: C.grisO });
  }

    const gg = el('g', { class: 'aguja' }, g);

  if (pie) txt(g, 1728, 600, pie, { 'text-anchor': 'end', 'font-family': 'Plex', 'font-size': 26, fill: C.grisO, class: 'sube d6' });
  if (filas) filas.forEach((f, i) => {
    const y = 150 + i * 170, gg = el('g', { class: 'sube d' + (i + 3) }, g);
    el('line', { x1: 1180, x2: 1728, y1: y - 70, y2: y - 70, stroke: i === 1 ? C.cel : '#2e3438', 'stroke-width': 2 }, gg);
    txt(gg, 1180, y - 30, f[0].toUpperCase(), { 'font-family': 'ArchivoSC', 'font-weight': 500, 'font-size': 22, 'letter-spacing': 4, fill: i === 1 ? C.cel : C.grisO });
    txt(gg, 1180, y + 40, f[1], { 'font-family': 'ArchivoC', 'font-weight': 700, 'font-size': 64, fill: i === 1 ? '#fff' : C.grisO });
    txt(gg, 1728, y + 40, f[2], { 'text-anchor': 'end', 'font-family': 'Plex', 'font-size': 24, fill: i === 1 ? '#fff' : C.grisO });
  });
}
function ruta(svg, i, total, clara) {
  const acum = [-280.0, -362.2, -260.0, -173.0, -123.0, 116.1];
  const X = (k) => 10 + k * 68, Y = (v) => 8 + (290 - v) * 48 / 640;
  const d = acum.map((v, k) => (k ? 'L' : 'M') + X(k) + ' ' + Y(v)).join(' ');
  el('line', { x1: 4, x2: 356, y1: Y(0), y2: Y(0), stroke: clara ? '#c8cace' : '#2e3438', 'stroke-dasharray': '3 4' }, svg);
  el('path', { d, fill: 'none', stroke: clara ? '#c8cace' : '#2e3438', 'stroke-width': 3 }, svg);

  el('circle', { cx: q.x, cy: q.y, r: 6, fill: clara ? C.celT : C.cel }, svg);
}

/* ------------------------------------------------------------------ motor */
const deck = document.getElementById('deck'), marco = document.getElementById('marco');
const S = L.map((l, i) => {
  const s = document.createElement('section');
  s.className = 'lam ' + (l.clara ? 'clara' : 'oscura');
  s.setAttribute('aria-label', 'Lámina ' + (i + 1));
  s.innerHTML = l.html(i + 1);
  deck.appendChild(s);
  if (l.dibujar) l.dibujar(s);
  const r = s.querySelector('.ruta'); if (r) ruta(r, i, L.length, l.clara);
  s.querySelectorAll('[data-traza]').forEach((p) => { const n = p.getTotalLength(); p.style.strokeDasharray = n; p.style.strokeDashoffset = n; });
  return s;
});
const idx = document.getElementById('indice');
const nombres = ['Portada', 'Objetivos', 'Financiamiento', 'Inversión', 'Capital de trabajo', 'Ingresos y costos', 'Flujo puro', 'Tasas', 'Flujo del socio', 'VAN', 'TIR', 'Equilibrio', 'Escenarios', 'Cierre', 'A1 Escenarios puros', 'A2 ¿Por qué no el IPSA?', 'A3 El crédito', 'A4 ¿Y si el kit sube?'];
nombres.forEach((n, i) => { const b = document.createElement('button'); b.innerHTML = `<i class="${L[i].clara ? 'c' : 'o'}"></i><span>${String(i + 1).padStart(2, '0')}</span>${n}`; b.onclick = () => ir(i); idx.appendChild(b); });
const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
let act = -1;
function apagar(s, l) {
  s.classList.remove('on');
  s.querySelectorAll('[data-traza]').forEach((p) => { p.style.transition = 'none'; p.style.strokeDashoffset = p.getTotalLength(); });
  s.querySelectorAll('.aguja').forEach((a) => { a.style.transition = 'none'; a.style.transform = `rotate(${a.dataset.a0}deg)`; });
  s.querySelectorAll('[data-cuenta]').forEach((c) => { c.textContent = (c.dataset.pre || '') + f1(0, +c.dataset.dec) + (c.dataset.suf || ''); });
  if (l.off) l.off(s);
}
function encender(s, l) {

    const fin = +c.dataset.cuenta, dec = +c.dataset.dec, t0 = performance.now(), dur = reduce ? 0 : 1600;
    const paso = (t) => { const k = dur ? Math.min(1, (t - t0) / dur) : 1, e = 1 - Math.pow(1 - k, 3); c.textContent = (c.dataset.pre || '') + f1(fin * e, dec) + (c.dataset.suf || ''); if (k < 1) requestAnimationFrame(paso); };
    requestAnimationFrame(paso);
  });
  if (l.on) l.on(s);
}
function ir(i) {
  i = Math.max(0, Math.min(L.length - 1, i));
  if (act >= 0) { S[act].classList.remove('vis'); apagar(S[act], L[act]); }
  act = i; S[i].classList.add('vis');
  apagar(S[i], L[i]); requestAnimationFrame(() => encender(S[i], L[i]));
  document.getElementById('cont').textContent = String(i + 1).padStart(2, '0') + ' / ' + L.length;
  document.getElementById('rol').textContent = L[i].rol;
  document.getElementById('nota').textContent = L[i].nota;
  [...idx.children].forEach((b, k) => b.classList.toggle('act', k === i));

}
function escalar() { deck.style.transform = `scale(${marco.clientWidth / 1920})`; }
new ResizeObserver(escalar).observe(marco); escalar();
document.getElementById('ant').onclick = () => ir(act - 1);
document.getElementById('sig').onclick = () => ir(act + 1);

marco.addEventListener('click', () => ir(act + 1));
addEventListener('keydown', (e) => {

});
const h = /^#lamina-(\d+)$/.exec(location.hash);
ir(h ? +h[1] - 1 : 0);
